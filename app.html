function kbHTML(){ return `<div class="kb">${TR_KEYS.map(k=>`<button type="button" data-k="${k}">${k}</button>`).join('')}</div>`; }
function wireKb(root, input){
  $$('.kb button', root).forEach(b => b.onclick = () => {
    const k = b.dataset.k; const s = input.selectionStart ?? input.value.length, e = input.selectionEnd ?? input.value.length;
    input.value = input.value.slice(0,s) + k + input.value.slice(e); input.focus(); input.setSelectionRange(s+k.length, s+k.length);
  });
}
function glossHTML(g){
  if (!g) return '';
  return `<div class="gloss">${g.split('|').map(p => { const [a,b] = p.split('=').map(x=>x.trim()); return `<span><span class="tr">${esc(a)}</span>${esc(b||'')}</span>`; }).join('')}</div>`;
}
function runQuiz(body, items, done){
  let idx = 0, score = 0; const wrongs = [];
  const order = items; // orden pedagógico
  const total = order.length;
  const head = () => `<div class="qhead"><span class="muted" style="font-weight:600">${idx+1} / ${total}</span><div class="bar" style="flex:1"><i style="width:${idx/total*100}%"></i></div><span class="pill">${Math.round(score*10)/10} ✓</span></div>`;
  const next = () => { idx++; if (idx >= total) done({ score, total, wrongs }); else draw(); };
  const draw = () => {
    const e = order[idx];
    window.__meduCur = e;
    let html = `<div class="quiz fadein">${head()}<div class="card qbox">`;
    if (e.t === 'mc'){
      html += `<div class="qprompt">${e.q}</div>${e.h?`<div class="qhg hg big">${e.h}</div>`:''}<div class="opts">${e.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>`;
    } else if (e.t === 'tl'){
      html += `<div class="qprompt">${e.q || 'Translitera:'}</div><div class="qhg hg big">${e.h}</div>
        <input class="inp" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escribe la transliteración…">${kbHTML()}
        <div class="row" style="justify-content:center;margin-top:8px"><button class="btn ghost" id="skip">No lo sé</button><button class="btn" id="chk">Comprobar</button></div>`;
    } else if (e.t === 'tr'){
      html += `<div class="qprompt">${e.q || 'Traduce al español:'}</div><div class="qhg hg big">${e.h}</div>
        <button class="btn ghost sm" id="showtl" style="margin-bottom:10px">Ver transliteración</button><div id="tlhint" class="tr" style="display:none;font-size:20px;margin-bottom:10px">${esc(e.l||'')}</div>
        <textarea class="inp" id="ans" placeholder="Escribe tu traducción…"></textarea>
        <div class="row" style="justify-content:center;margin-top:10px"><button class="btn ghost" id="skip">No lo sé</button><button class="btn" id="chk">Comprobar</button></div>`;
    }
    html += `<div id="fb"></div></div></div>`;
    body.innerHTML = html;
    const fb = $('#fb', body);
    const after = (ok, inner, partial) => {
      const credit = ok ? 1 : (partial || 0);
      score += credit;
      if (credit < 1) wrongs.push(inner);
      fb.innerHTML = `<div class="feedback ${ok?'ok':partial?'mid':'bad'} fadein">${inner}<div class="row" style="justify-content:flex-end;margin-top:12px">
        ${!ok && e.t!=='mc' ? `<button class="btn ghost sm" id="override">Yo lo tenía bien</button>`:''}<button class="btn" id="nx">${idx+1<total?'Siguiente →':'Ver resultado'}</button></div></div>`;
      $('#nx', body).onclick = next; $('#nx', body).focus();
      const ov = $('#override', body);
      if (ov) ov.onclick = () => { score += (1 - credit); wrongs.pop(); ov.remove(); toast('Anotado como correcto'); };
    };
    if (e.t === 'mc'){
      $$('.opt', body).forEach(b => b.onclick = () => {
        const i = +b.dataset.i; const ok = i === e.a;
        $$('.opt', body).forEach(x => { x.disabled = true; if (+x.dataset.i === e.a) x.classList.add('right'); });
        if (!ok) b.classList.add('wrong');
        after(ok, `<b class="t">${ok?'¡Correcto!':'No exactamente'}</b>${e.h?`<span class="hg">${e.h}</span> → `:''}${e.o[e.a]}${e.e?`<p style="margin:.4em 0 0">${e.e}</p>`:''}`);
      });
    } else {
      const inp = $('#ans', body); inp.focus();
      if (e.t === 'tl') wireKb(body, inp);
      const sh = $('#showtl', body); if (sh) sh.onclick = () => { $('#tlhint', body).style.display = 'block'; sh.remove(); };
      const check = (skip) => {
        $('#chk', body).disabled = true; $('#skip', body).disabled = true; inp.disabled = true;
        if (e.t === 'tl'){
          const ok = !skip && trMatch(inp.value, e.a);
          const main = [].concat(e.a)[0];
          after(ok, `<b class="t">${ok?'¡Correcto!':'Respuesta:'}</b><span class="tr" style="font-size:22px">${esc(main)}</span>${e.m?` — <span class="es">«${esc(e.m)}»</span>`:''}${e.e?`<p style="margin:.4em 0 0">${e.e}</p>`:''}`);
        } else {
          const miss = skip ? (e.k||[]).map(g=>g[0]) : keyCheck(inp.value, e.k);
          const nk = (e.k||[]).length;
          const ok = !skip && miss.length === 0 && inp.value.trim().length > 0;
          const partial = (!ok && !skip && nk) ? Math.max(0, (nk - miss.length) / nk) * 0.5 : 0;
          after(ok, `<b class="t">${ok?'¡Muy bien!':partial?'Casi':'Traducción propuesta'}</b>
            <div class="tr" style="font-size:19px">${esc(e.l||'')}</div><div style="font-size:18px;margin:4px 0">«${esc(e.a)}»</div>
            ${glossHTML(e.g)}${!ok && !skip && miss.length ? `<p class="muted" style="margin:.5em 0 0;font-size:14px">Faltaba en tu respuesta alguna idea como: ${miss.map(x=>'«'+esc(x)+'»').join(', ')}</p>`:''}${e.e?`<p style="margin:.4em 0 0">${e.e}</p>`:''}`, partial);
        }
      };
      $('#chk', body).onclick = () => check(false);
      $('#skip', body).onclick = () => check(true);
      inp.addEventListener('keydown', ev => { if (ev.key === 'Enter' && (e.t === 'tl' || ev.ctrlKey || ev.metaKey)){ ev.preventDefault(); if (!$('#chk', body).disabled) check(false); else { const nx = $('#nx', body); if (nx) nx.click(); } } });
    }
  };
  draw();
}

  <p class="lead">${SIGNS.length} signos frecuentes, ordenados según la clasificación de Gardiner que usan los egiptólogos. Pulsa cualquiera para ver sus usos.</p>
  <div class="row" style="margin-bottom:12px"><input class="search" id="q" placeholder="Busca por sonido (ḥtp, nfr…), código (G17) o significado…"></div>
  <div class="chips" id="kf" style="margin-bottom:10px">${[['all','Todos'],['uni','Unilíteros'],['bi','Bilíteros'],['tri','Trilíteros'],['ideo','Ideogramas'],['det','Determinativos'],['num','Números']].map(([k,t])=>`<button class="chip ${k==='all'?'on':''}" data-k="${k}">${t}</button>`).join('')}</div>
  <div class="row" style="margin-bottom:16px"><select class="search" id="grp" style="flex:0 1 320px;min-width:0"><option value="all">Todos los grupos</option>${Object.entries(GROUPS).map(([k,v])=>`<option value="${k}">${k} · ${v}</option>`).join('')}</select></div>
  <div id="sg"></div>`;
  const draw = () => {
    const nq = q.trim(); const cq = canonTr(nq, false), nes = normEs(nq);
    const list = SIGNS.filter(s => (kind==='all' || s.k===kind) && (grp==='all' || s.c.replace(/\d.*$/,'')===grp) &&
      (!nq || s.c.toLowerCase()===nq.toLowerCase() || (s.s && canonTr(s.s,false).includes(cq) && cq) || normEs(s.m).includes(nes)));
    $('#sg').innerHTML = list.length ? `<div class="sign-grid">${list.map(s => `<div class="sign" data-c="${s.c}"><span class="hg">${s.ch}</span><span class="tr">${esc(s.s||'')}</span><span class="code">${s.c}</span></div>`).join('')}</div>` : '<p class="muted">Ningún signo coincide con la búsqueda.</p>';
    $$('.sign', $('#sg')).forEach(el => el.onclick = () => signModal(SIGNS.find(s => s.c === el.dataset.c)));
  };
  $('#q').oninput = e => { q = e.target.value; draw(); };
  $('#grp').onchange = e => { grp = e.target.value; draw(); };
  $$('#kf .chip').forEach(b => b.onclick = () => { kind = b.dataset.k; $$('#kf .chip').forEach(x=>x.classList.toggle('on', x===b)); draw(); });
  draw();
}
function signModal(s){
  const words = [];
  LESSONS.forEach(l => (l.vocab||[]).forEach(v => { if (v[0].includes(s.ch)) words.push(v); }));
  modal(`<div style="text-align:center"><div class="hg huge">${s.ch}</div><div class="row" style="justify-content:center"><span class="pill">${s.c}</span><span class="pill">${KIND[s.k]||''}</span><span class="pill">Lección ${s.l||2}</span></div>
   ${s.s?`<div class="tr" style="font-size:30px;margin-top:8px">${esc(s.s)}</div>`:''}<p style="font-size:17px">${esc(s.m)}</p></div>
   ${words.length?`<hr class="sep"><b>Aparece en tu vocabulario:</b><div style="margin-top:8px">${words.slice(0,8).map(v=>`<div class="row" style="gap:10px"><span class="hg">${v[0]}</span><span class="tr">${esc(v[1])}</span><span class="es">${esc(v[2])}</span></div>`).join('')}</div>`:''}
   <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-x>Cerrar</button></div>`, (bg, close) => { $('[data-x]', bg).onclick = close; });
}

/* ---------- Diccionario ---------- */
function viewDict(m){
  const all = []; LESSONS.forEach(l => (l.vocab||[]).forEach(v => all.push({ v, n:l.n })));
  all.sort((a,b) => canonTr(a.v[1]).localeCompare(canonTr(b.v[1])));
  let q = '', onlyMine = false;
  m.innerHTML = `<div class="eyebrow">Egipcio – español</div><h1>Diccionario</h1>
  <p class="lead">Las ${all.length} palabras del curso. Busca en egipcio (transliteración, admite la convención ASCII) o en español.</p>
  <div class="row" style="margin-bottom:14px"><input class="search" id="q" placeholder="Ej.: nfr, ḥtp, casa, dios…"><label class="row" style="gap:6px;font-size:15px"><input type="checkbox" id="mine"> Solo lecciones empezadas</label></div>
  <div class="card" style="padding:4px 0" id="dl"></div>`;
  const draw = () => {
    const cq = canonTr(q, true), nes = normEs(q);
    const list = all.filter(({v,n}) => (!onlyMine || (S.lessons[n] && S.lessons[n].read && S.lessons[n].read.length)) && (!q.trim() || (cq && canonTr(v[1]).includes(cq)) || normEs(v[2]).includes(nes)));
    $('#dl').innerHTML = list.length ? list.slice(0,400).map(({v,n}) => `<div class="dict-row"><span class="hg">${v[0]}</span><span class="tr">${esc(v[1])}</span><span class="es">${esc(v[2])}</span><a class="pill" href="#leccion-${n}-vocabulario" style="text-decoration:none">L${n}</a></div>`).join('') : '<p class="muted" style="padding:14px">Sin resultados.</p>';
  };
  $('#q').oninput = e => { q = e.target.value; draw(); };
  $('#mine').onchange = e => { onlyMine = e.target.checked; draw(); };
  draw();
}

/* ---------- Textos ---------- */
function textUnlocked(t){ return S.settings.unlockAll || t.req <= 1 || !!(S.lessons[t.req] && S.lessons[t.req].done); }
function viewTexts(m){
  m.innerHTML = `<div class="eyebrow">Lecturas</div><h1>Textos egipcios</h1>
  <p class="lead">Frases y pasajes de inscripciones y obras literarias auténticas, en orden de dificultad. Cada texto se abre al superar la lección que indica.</p>
  <div class="grid g2">${TEXTS.map((t,i) => { const un = textUnlocked(t); return `<a class="lesson-item ${un?'':'locked'} ${S.texts[i]?'done':''}" href="#texto-${i+1}">
    <div class="lesson-num">${S.texts[i]?'✓':i+1}</div><div style="flex:1"><div class="t">${esc(t.title)}</div><div class="s">${esc(t.src)} · tras la lección ${t.req}</div></div>${un?'':'<span class="pill lock">🔒</span>'}</a>`; }).join('')}</div>`;
}
function viewText(m, i){
  const t = TEXTS[i-1];
  if (!t){ m.innerHTML = `<div class="card"><h2>Ese texto no existe</h2><a class="btn" href="#textos">Ver textos</a></div>`; return; }
  if (!textUnlocked(t)){ m.innerHTML = `<div class="card" style="text-align:center;padding:40px"><h2>Texto bloqueado</h2><p>Se abre al superar la lección ${t.req}.</p><a class="btn" href="#leccion-${t.req}">Ir a la lección ${t.req}</a></div>`; return; }
  let showTr = false, showEs = false;
  const draw = () => {
    m.innerHTML = `<a href="#textos" class="muted" style="text-decoration:none">← Textos</a><div class="eyebrow" style="margin-top:12px">${esc(t.src)}</div><h1>${esc(t.title)}</h1>
    <p class="lead">${t.intro}</p>
    <div class="row" style="margin:14px 0"><button class="btn ${showTr?'':'ghost'} sm" id="btr">${showTr?'Ocultar':'Mostrar'} transliteración</button><button class="btn ${showEs?'':'ghost'} sm" id="bes">${showEs?'Ocultar':'Mostrar'} traducción</button><span class="muted" style="font-size:14px">Consejo: intenta leer cada línea antes de mostrar nada. Pulsa sobre lo difuminado para verlo línea a línea.</span></div>
    <div class="card">${t.lines.map((ln,k) => `<div class="tline"><div class="hg">${ln.h}</div>
      <div class="tr ${showTr?'':'hidden-ans'}" data-r style="font-size:19px;margin-top:6px">${esc(ln.l)}</div>
      <div class="${showEs?'':'hidden-ans'}" data-r style="margin-top:4px">«${esc(ln.a)}»</div>
      ${ln.n?`<details style="margin-top:6px"><summary class="muted" style="font-size:14px">Notas gramaticales</summary><p style="margin:.4em 0;font-size:15.5px">${ln.n}</p></details>`:''}</div>`).join('')}</div>
    <div class="row" style="justify-content:center;margin-top:20px"><button class="btn gold" id="fin">${S.texts[i-1]?'Leído ✓':'Marcar como leído (+15 XP)'}</button>${TEXTS[i]?`<a class="btn ghost" href="#texto-${i+1}">Siguiente texto →</a>`:''}</div>`;
    $('#btr').onclick = () => { showTr = !showTr; draw(); };
    $('#bes').onclick = () => { showEs = !showEs; draw(); };
    $$('[data-r]').forEach(el => el.onclick = () => el.classList.remove('hidden-ans'));
    $('#fin').onclick = () => { if (!S.texts[i-1]){ S.texts[i-1] = true; addXP(15); toast('¡Texto completado!'); draw(); } };
  };
  draw();
}

/* ---------- Ajustes ---------- */
function viewSettings(m){
  m.innerHTML = `<div class="eyebrow">Preferencias y datos</div><h1>Ajustes</h1>
  <div class="grid g2">
   <div class="card"><h3>Apariencia</h3>
     <label class="row" style="justify-content:space-between"><span>Tema oscuro</span><input type="checkbox" id="dark" ${S.settings.theme==='dark'?'checked':''}></label>
     <div style="margin-top:14px">Tamaño de los jeroglíficos <span class="hg" style="font-size:calc(1.6em * var(--hg-scale))">𓅓𓂋</span></div>
     <input type="range" id="hgs" min="0.8" max="1.6" step="0.1" value="${S.settings.hg}" style="width:100%">
   </div>
   <div class="card"><h3>Estudio</h3>
     <label class="row" style="justify-content:space-between"><span>Fichas nuevas por día</span><input type="number" id="npd" min="0" max="100" value="${S.settings.newPerDay}" class="search" style="max-width:90px;min-width:0;flex:0"></label>
     <label class="row" style="justify-content:space-between;margin-top:12px"><span>Desbloquear todas las lecciones</span><input type="checkbox" id="unl" ${S.settings.unlockAll?'checked':''}></label>
     <p class="muted" style="font-size:14px">Útil si ya conoces parte del temario. Lo recomendable es avanzar en orden.</p>
   </div>
   <div class="card"><h3>Tu progreso</h3>
     <p id="syncState2">${syncLabel()}</p>
     <p class="muted" style="font-size:14.5px">El progreso se guarda automáticamente en este dispositivo y, si abres el curso desde Claude, también en tu cuenta. Para pasar tu progreso de un sitio a otro (por ejemplo, del navegador a la app del móvil), copia aquí una copia de seguridad y restáurala en el otro.</p>
     <div class="row"><button class="btn ghost sm" id="exp">Copiar copia de seguridad</button><button class="btn ghost sm" id="imp">Restaurar copia</button></div>
   </div>
   <div class="card"><h3>Empezar de cero</h3><p class="muted" style="font-size:14.5px">Borra todas las lecciones superadas, fichas y estadísticas.</p><button class="btn red sm" id="rst">Borrar mi progreso</button></div>
  </div>
  <div class="card" style="margin-top:16px"><h3>Sobre este curso</h3><p style="font-size:15.5px">El temario sigue el orden de <i>Middle Egyptian: An Introduction to the Language and Culture of Hieroglyphs</i> de James P. Allen (2.ª ed.), y la transliteración usa sus mismas convenciones (por ejemplo, <span class="tr">z</span> y <span class="tr">s</span> se distinguen, y el yod se escribe <span class="tr">j</span>). Las explicaciones, los ejercicios y las traducciones de este curso son originales. Puedes usar el libro como complemento: los números de lección coinciden.</p></div>`;
  $('#dark').onchange = e => { S.settings.theme = e.target.checked ? 'dark' : 'light'; applySettings(); save(); };
  $('#hgs').oninput = e => { S.settings.hg = +e.target.value; applySettings(); save(); };
  $('#npd').onchange = e => { S.settings.newPerDay = Math.max(0, Math.min(100, +e.target.value||0)); save(); };
  $('#unl').onchange = e => { S.settings.unlockAll = e.target.checked; save(); renderNav(route()); };
  $('#exp').onclick = () => {
    const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    modal(`<h3>Copia de seguridad</h3><p class="muted" style="font-size:14.5px">Guarda este código en un lugar seguro (una nota, un correo a ti mismo…). Podrás pegarlo en «Restaurar copia».</p><textarea class="inp" readonly style="font-size:12px;min-height:160px;font-family:monospace">${code}</textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn ghost" data-x>Cerrar</button><button class="btn" data-c>Copiar</button></div>`, (bg, close) => {
      $('[data-x]', bg).onclick = close; $('[data-c]', bg).onclick = () => copyText(code);
      const ta = $('textarea', bg); ta.onclick = () => ta.select();
    });
  };
  $('#imp').onclick = () => {
    modal(`<h3>Restaurar copia</h3><p class="muted" style="font-size:14.5px">Pega aquí el código de tu copia de seguridad. Sustituirá el progreso actual.</p><textarea class="inp" id="code" style="font-size:12px;min-height:140px;font-family:monospace"></textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn ghost" data-x>Cancelar</button><button class="btn" data-ok>Restaurar</button></div>`, (bg, close) => {
      $('[data-x]', bg).onclick = close;
      $('[data-ok]', bg).onclick = () => {
        try { const o = JSON.parse(decodeURIComponent(escape(atob($('#code', bg).value.trim())))); if (!o || typeof o !== 'object' || !o.lessons) throw 0; S = mergeDefaults(o); save(); applySettings(); close(); toast('Progreso restaurado'); render(); }
        catch(e){ toast('El código no es válido'); }
      };
    });
  };
  $('#rst').onclick = () => confirmBox('Se borrará todo tu progreso, también el guardado en tu cuenta. No se puede deshacer.', 'Borrar todo', () => { const th = S.settings; S = defaultState(); S.settings.theme = th.theme; save(); applySettings(); toast('Progreso borrado'); go('inicio'); });
}

/* ---------- Arranque ---------- */
const local = loadLocal();
if (local) S = mergeDefaults(local);
applySettings();
render();
initRemote();
window.__medu = { get state(){ return S; }, canonTr, trMatch, keyCheck };
})();
</script>
</body>
</html>

<p><b>Usos:</b> en principales (sobre todo en narraciones y autobiografías: ${t('jrj nn')} «esto se hizo»), en subordinadas y negado con ${tneg()}: ${t('n rdj')}… «no fue dado». También en preguntas.</p>`);

add(21, 'Las formas de sḏm.f: cuadro de conjunto', `
<p>Con este tema ya conoces las cinco formas que se escriben como ${t('sḏm.f')}. Cuadro para distinguirlas:</p>
${tb(['Forma','3ae inf. ('+t('jrj')+')','2ae gem. ('+t('mꜣꜣ')+')',t('rdj'),'Sentido típico'],[
['Perfectivo',t('jr.f'),t('mꜣ.f'),t('rdj.f'),'pasado (sobre todo negado: '+t('n sḏm.f')+')'],
['Imperfectivo',t('jrr.f'),t('mꜣꜣ.f'),t('dd.f'),'habitual, general, en curso'],
['Subjuntivo',t('jrj.f'),t('mꜣ.f'),t('dj.f'),'deseo, finalidad, tras '+t('rdj')],
['Prospectivo',t('jrj.f')+' / '+t('jry.f'),t('mꜣꜣ.f'),t('rdj.f'),'futuro ('+t('nn sḏm.f')+')'],
['Pasivo',t('jrj')+' / '+t('jry'),t('mꜣꜣ')+'(?)',t('rdj'),'pasado pasivo'],
])}
<p>En los verbos fuertes (${t('sḏm')}) las cinco formas se escriben igual. Para identificarlas, fíjate en: la presencia de una partícula o negación (${tneg()} → perfectivo pasado; ${t('nn')} → prospectivo), el tipo de oración (deseo, finalidad, tras ${t('rdj')} → subjuntivo), la falta de sujeto agente (→ pasivo) y la geminación en los verbos débiles (→ imperfectivo).</p>`);
/* ===================== TEMA 22 ===================== */
add(22, 'sḏm.jn.f, sḏm.ḫr.f y sḏm.kꜣ.f en detalle', `
<p>Estas tres formas se construyen con la raíz (como el perfectivo: sin geminar, sin j débil) + un elemento ${t('jn')}, ${t('ḫr')} o ${t('kꜣ')} + el sujeto. Un sujeto nominal va tras ese elemento: ${t('ḏd.jn zj pn')} «entonces este hombre dijo».</p>
${tb(['Forma','Sentido','Contexto típico'],[
[t('sḏm.jn.f'),'«entonces hizo»: acción pasada que sigue a otra','Narración, después de una fecha, de una circunstancia o de otro verbo'],
[t('sḏm.ḫr.f'),'«entonces hace / hará»: consecuencia normal, general o necesaria','Textos médicos, matemáticos, rituales e instrucciones: «si… entonces…»'],
[t('sḏm.kꜣ.f'),'«entonces hará»: consecuencia futura o esperada','Promesas, amenazas, condiciones; poco frecuente'],
])}
${x('','ḏd.jn.f n.j','entonces me dijo')}
${x('','jr gm.k sw … ḏd.ḫr.k','si lo encuentras… entonces dirás','estilo de los textos médicos')}
<p>Un pronombre objeto dependiente se coloca antes de un sujeto nominal, igual que en el perfecto. El pasivo se forma con ${t('.tw')}: ${t('rdj.jn.tw')}… «entonces se puso…».</p>
<p>Se llaman formas «sufijadas» porque los elementos ${t('jn')}, ${t('ḫr')} y ${t('kꜣ')} proceden de partículas que acabaron pegándose al verbo, igual que el ${t('n')} del perfecto.</p>`);

add(22, 'La forma sḏmt.f', `
<p>La ${t('sḏmt.f')} es una forma con ${t('-t')} que solo aparece en dos usos:</p>
<ul>
<li><b>Tras la negación ${t('n')}:</b> ${t('n sḏmt.f')} «todavía no ha oído», «antes de que oyera»: ${t('n jjt.f')} «todavía no ha venido».</li>
<li><b>Tras preposiciones</b> de tiempo: ${t('r sḏmt.f')} «hasta que oiga», ${t('ḏr sḏmt.f')} «antes de que oyera» (en algunos textos).</li>
</ul>
<p><b>Forma:</b> raíz + ${t('t')} + sujeto: ${t('jrt.f')}, ${t('jjt.f')}, ${t('mꜣt.f')}. La de ${t('wnn')} es ${t('wnt.f')}.</p>
<p><b>Sentido:</b> siempre una acción que aún no se ha completado respecto al momento de referencia («hasta que», «todavía no»).</p>`);

add(22, 'Los parentéticos', `
<p>Al citar palabras ajenas se intercalan formas especiales de «decir», llamadas <b>parentéticos</b>, que van <b>dentro</b> o <b>detrás</b> de la cita, como nuestro «dijo él»:</p>
${tb(['Forma','Sentido'],[
[t('jn.f')+' / '+t('j.n.f'),'dice él, dijo él (con sujeto nominal: '+t('jn zj pn')+')'],
[t('ḫr.f'),'dice él (en textos de enseñanza y diálogos)'],
[t('ḏd.f')+' / '+t('ḏd.sn'),'dice él, dicen (sobre todo para introducir la cita)'],
])}
${x('','zꜣ-nht ḏd.f','Sinuhé dice:')}
<p>Los parentéticos no tienen tiempo propio: se traducen como «dice» o «dijo» según el relato.</p>`);

/* ===================== TEMA 23 ===================== */
add(23, 'Género, número y traducción de los participios', `
<p>Los participios son <b>adjetivos verbales</b>: concuerdan con el sustantivo al que se refieren (masc. sin terminación o ${t('-w')}; fem. ${t('-t')}; pl. ${t('-w')}) y pueden usarse como sustantivos.</p>
<ul>
<li><b>Activo:</b> «el que hace / hizo»: ${t('jrr mꜣꜥt')} «el que hace la justicia».</li>
<li><b>Pasivo:</b> «el que es / fue hecho»: ${t('mrjj')} «amado».</li>
<li><b>Neutro (femenino):</b> «lo que…»: ${t('jrt')} «lo que se hizo / lo hecho».</li>
</ul>
<p>Al traducir, suele funcionar mejor una oración de relativo («el que…», «quien…», «lo que…») que un participio español.</p>`);

add(23, 'Formas: raíz, terminaciones y tipos', `
<p><b>Perfectivos e imperfectivos.</b> Como en la conjugación, hay participios <b>perfectivos</b> (acción única, puntual) e <b>imperfectivos</b> (acción repetida, habitual). En los verbos débiles se distinguen por la geminación:</p>
${tb(['Clase','Activo perfectivo','Activo imperfectivo','Pasivo perfectivo','Pasivo imperfectivo'],[
['3ae inf. ('+t('jrj')+')',t('jr')+' / '+t('jrj'),t('jrr'),t('jrj')+' / '+t('jrw'),t('jrrw')],
['3ae inf. ('+t('mrj')+')',t('mr'),t('mrr'),t('mrjj')+' «amado»',t('mrrw')],
['2ae gem. ('+t('mꜣꜣ')+')',t('mꜣ'),t('mꜣꜣ'),t('mꜣw'),t('mꜣꜣw')],
[t('rdj'),t('rdj')+' / '+t('dj'),t('dd'),t('rdj')+' / '+t('dj'),t('ddw')],
])}
<p><b>Terminaciones:</b> los participios pueden llevar ${t('-w')} o ${t('-y')} (pocas veces escritas). El pasivo perfectivo de los 3ae inf. termina a menudo en ${t('-jj')} / ${t('-y')}: ${t('mrjj')}, ${t('ḥzjj')}.</p>
<p><b>Participio prospectivo:</b> una forma con ${t('-tj')} (+ sufijo de concordancia ${t('-fj')}, ${t('-sj')}, ${t('-sn')}) significa «el que hará»: ${t('swꜣtj.sn')} «los que pasarán» (en las llamadas a los vivos), ${t('srwḏtj.fj')} «el que mantendrá».</p>`);

add(23, 'Sintaxis y sentido de los participios', `
<ul>
<li><b>Como modificador:</b> tras un sustantivo, como un adjetivo: ${t('nṯr ḫpr ḏs.f')} «el dios que llegó a existir por sí mismo».</li>
<li><b>Como sustantivo:</b> ${t('ꜥnḫw')} «los vivos», ${t('mrrw')} «los amados».</li>
<li><b>Con objeto y complementos</b> como cualquier verbo: ${t('dd t n ḥqr')} «el que da pan al hambriento».</li>
<li><b>Agente del pasivo:</b> se expresa con un genitivo directo o con sufijo: ${t('mrjj nb.f')} «amado de su señor», ${t('ḥzjj.f')} «su favorecido»; o con ${t('jn')}.</li>
<li><b>Como predicado adjetival:</b> ${t('mrr sw nṯr')}… / con ${t('wj')}: «¡cuán amado es…!».</li>
</ul>
<p><b>Sentido:</b> el participio no expresa tiempo absoluto, sino aspecto: el perfectivo presenta la acción como un hecho (normalmente pasado), el imperfectivo como algo repetido o característico («el que suele hacer»).</p>`);

add(23, 'La oración participial', `
<p>Un participio puede ser el predicado de una oración que <b>destaca quién</b> hace la acción («es X quien…»):</p>
<ul>
<li><b>Con sujeto nominal:</b> ${t('jn')} + sustantivo + participio: ${t('jn ḥm.f rdj n.j st')} «fue su majestad quien me lo dio».</li>
<li><b>Con pronombre:</b> pronombre independiente + participio: ${t('ntk jrj st')} «eres tú quien lo hizo»; ${t('jnk dd t')} «soy yo quien da pan».</li>
</ul>
<p>Se diferencia de la oración nominal ordinaria en que el participio es una acción: «él es el que hizo» frente a «él es un hacedor». Es la manera normal de preguntar o responder «¿quién hizo…?»: ${t('jn-m jrj st')} «¿quién lo hizo?».</p>`);

add(23, 'Casos especiales: pasivos de intransitivos, wnn y pꜣ, negación', `
<p><b>Pasivo con sufijo.</b> El participio pasivo puede llevar un sufijo que indica el agente: ${t('mrjj.f')} «su amado» (= «el amado por él»).</p>
<p><b>Pasivo de verbos intransitivos.</b> Con preposición y pronombre de retorno: ${t('jjw n.f')} «aquel a quien se viene» (= al que acuden). Poco frecuente pero importante en epítetos.</p>
<p><b>${t('wnn')} y ${t('pꜣ')}:</b> ${t('wn')} / ${t('wnn')} «el que existe / existía»; ${t('ntj wn')}… ; y el participio de ${t('pꜣ')} «haber hecho alguna vez»: ${t('pꜣ jrj')} «el que había hecho (antes)».</p>
<p><b>Negación:</b> se usa el participio del verbo negativo ${t('tm')} + complemento negativo: ${t('tm sḏm')} «el que no oye»; ${t('tmw rḫ')} «los que no saben».</p>`);

/* ===================== TEMA 24 ===================== */
add(24, 'Formas relativas: terminaciones, formas y orden', `
<p>Una <b>forma relativa</b> es un adjetivo verbal con su propio sujeto: «(el que) X hace / hizo». Concuerda con su antecedente (fem. y neutro ${t('-t')}, pl. ${t('-w')}) y lleva el sujeto detrás:</p>
${tb(['Forma','Construcción','Ejemplo'],[
['Perfectiva','raíz + '+t('n')+' + sujeto',t('jrt.n.f')+' «lo que él hizo»'],
['Imperfectiva','raíz (geminada si es débil) + sujeto',t('mrrt nṯrw')+' «lo que aman los dioses»'],
['Prospectiva','raíz (+ '+t('w')+') + sujeto',t('jrjw.f')+' «lo que hará» (rara)'],
])}
<p><b>Orden:</b> antecedente + forma relativa + sujeto + objeto / complementos. Si el antecedente no es el objeto directo, un <b>pronombre de retorno</b> lo recuerda: ${t('njwt jj.n.f jm.s')} «la ciudad de la que vino».</p>
<p><b>Traducción:</b> «el/la/lo que + sujeto + verbo», «a quien», «de la que»…</p>
<p><b>Formas pasivas:</b> con ${t('.tw')}: ${t('jrt.n.tw')} «lo que se hizo».</p>`);

add(24, 'Usos frecuentes de las formas relativas', `
<p>Algunas formas relativas aparecen continuamente:</p>
<ul>
<li>${t('mrrt')} «lo que (alguien) ama»: ${t('jr.n.j mrrt rmṯ')} «hice lo que la gente ama».</li>
<li>${t('ḏdt.n.f')} «lo que dijo»; ${t('ḏdt.f')} «lo que dice».</li>
<li>${t('ḥzzt')} «lo que alaban»; ${t('wḏt.n')} «lo que ordenó».</li>
<li>${t('ddt pt')} «lo que da el cielo», ${t('jnnt ḥꜥpj')} «lo que trae la inundación»: frecuentes en la fórmula de ofrendas (sección siguiente).</li>
</ul>`);

add(24, 'La fórmula de ofrendas ḥtp-dj-nswt', `
<p>La fórmula de ofrendas es probablemente el texto más repetido de todo el egipcio medio: aparece en miles de estelas, ataúdes, mesas de ofrendas y estatuas funerarias. Conviene conocerla de memoria. Un ejemplo completo, de una estela de finales del Reino Medio:</p>
${x('𓇓𓏏𓊵𓏙𓊨𓁹𓀭𓄂𓏏𓋀𓏏𓏭𓅱𓊹𓉻𓂝𓄿𓎟𓍋𓃀𓆓𓅱𓊖','ḥtp-dj-nswt jsjrt ḫntj-jmntjw nṯr ꜥꜣ nb ꜣbḏw','una ofrenda que da el rey a (de parte de) Osiris, el primero de los occidentales, el gran dios, señor de Abido')}
${x('𓂞𓋴𓈖𓏥𓉐𓂋𓏏𓊤𓅱𓏏𓏐𓎛𓈖𓈎𓏏𓏊𓂓𓄿𓊪𓂧𓅿','dj.sn prt-ḫrw t ḥnqt kꜣw ꜣpdw','que dan una ofrenda de invocación: pan y cerveza, bueyes y aves')}
${x('𓐍𓏏𓏛𓎟𓏏𓄤𓆑𓂋𓏏𓃂𓏏','ḫt nbt nfrt wꜥbt','toda cosa buena y pura')}
${x('𓂞𓂞𓏏𓇯𓈎𓅓𓄿𓏏𓇾𓏎𓈖𓈖𓏏𓎛𓂝𓊪𓇋𓈗𓋹𓈖𓐍𓏏𓊹𓇋𓐝','ddt pt qmꜣt tꜣ jnnt ḥꜥpj ꜥnḫt nṯr jm','que da el cielo, crea la tierra y trae la inundación, de la que vive un dios')}
${x('𓈖𓂓𓈖𓇋𓄪𓄿𓐍','n kꜣ n jmꜣḫ NN mꜣꜥ-ḫrw','para el ka del venerado NN, justificado')}
<p>Casi todas las versiones tienen <b>cuatro partes</b>:</p>
<p><b>1. La dedicatoria:</b> ${t('ḥtp-dj-nswt')}, literalmente «una ofrenda que da el rey»: ${t('ḥtp')} «ofrenda» + ${t('dj')}, forma relativa de ${t('rdj')} «que da» + ${t('nswt')} «el rey», escrito delante por transposición honorífica (${h('𓇓𓏏𓊵𓏙')}). Indica que el objeto funerario es, en teoría, un regalo autorizado por el rey. Algunas inscripciones lo dicen expresamente: «en cuanto a esta sepultura, fue el rey quien me la dio en la necrópolis como ‹ofrenda que da el rey›». Por eso suele traducirse simplemente «una ofrenda real».</p>
<p><b>2. El agente (el dios):</b> en la práctica, la ofrenda la proporcionaba el establecimiento funerario local, cuyo dios figura como agente del regalo. Su nombre y sus epítetos siguen a la dedicatoria en <b>genitivo directo</b>: ${t('ḥtp-dj-nswt jsjrt')}… «una ofrenda real de Osiris». Los dioses más frecuentes son:</p>
<ul>
<li><b>Osiris</b>: ${t('ḫntj-jmntjw')} «el primero de los occidentales», ${t('nṯr ꜥꜣ')} «el gran dios», ${t('nb ꜣbḏw')} «señor de Abido», ${t('nb ḏdw')} «señor de Busiris».</li>
<li><b>Anubis</b>: ${t('tpj ḏw.f')} «el que está sobre su montaña», ${t('jmj wt')} «el que está en el lugar de embalsamamiento», ${t('nb tꜣ ḏsr')} «señor de la tierra sagrada».</li>
<li><b>Upuaut</b> (${t('wp-wꜣwt')}), guardián de la necrópolis de Abido.</li>
</ul>
<p>Variantes: el dios puede introducirse con el genitivo indirecto (${t('ḥtp-dj-nswt n jnpw')}) o con ${t('jn')} «por» (${t('ḥtp-dj-nswt jn jsjrt')}); a veces el nombre del dios sustituye al del rey: ${t('ḥtp-dj-jnpw')} «una ofrenda que da Anubis», o se combinan las dos: ${t('ḥtp-dj-nswt ḥtp-dj-jnpw')}.</p>
<p><b>3. Las ofrendas:</b> siguen directamente al agente o se introducen con ${t('dj.f')} (plural ${t('dj.sn')}) «que da / dan». Según Allen, esta forma es un <b>imperfectivo</b> ${t('sḏm.f')} usado como relativa sin marca tras el nombre del dios («que da»), no un subjuntivo. Hay dos regalos básicos:</p>
<ul>
<li><b>La sepultura</b>, asociada sobre todo a Anubis: ${t('qrst nfrt m zmjt jmntt')} «una buena sepultura en el cementerio occidental».</li>
<li><b>La ofrenda de invocación</b>, asociada sobre todo a Osiris: ${t('prt-ḫrw')}, literalmente «la salida de la voz»: el oficiante pronunciaba en voz alta la lista y llamaba al espíritu del difunto a recibirla. La forma básica es ${t('prt-ḫrw t ḥnqt kꜣw ꜣpdw')} «una ofrenda de invocación de pan y cerveza, bueyes y aves», a la que se añaden ${t('šs mnḫt')} «alabastro y lino», ${t('snṯr')} «incienso», ${t('mrḥt')} «ungüento»… y el resumen ${t('ḫt nbt nfrt wꜥbt')} «toda cosa buena y pura», a veces ampliado con formas relativas (${t('ddt pt')} «que da el cielo», ${t('qmꜣt tꜣ')} «que crea la tierra», ${t('jnnt ḥꜥpj')} «que trae la inundación», ${t('ꜥnḫt nṯr jm')} «de la que vive un dios»).</li>
</ul>
<p>En otras versiones se piden también bienes inmateriales: ${t('ṯꜣw nḏm n ꜥnḫ')} «el dulce aliento de vida», ${t('ꜣḫ m pt wsr m tꜣ')} «ser glorioso en el cielo y poderoso en la tierra», salir y entrar en la necrópolis, beber agua del río…</p>
<p><b>4. El beneficiario:</b> la fórmula termina con el nombre del difunto, introducido por ${t('n')} «para», ${t('n jmꜣḫ')} «para el venerado» o ${t('n kꜣ n')} «para el ka de». Tras el nombre suelen ir ${t('mꜣꜥ-ḫrw')} (fem. ${t('mꜣꜥt-ḫrw')}) «justificado», ${t('nb jmꜣḫ')} (fem. ${t('nbt jmꜣḫ')}) «poseedor de veneración» y la filiación: ${t('ms.n')} + nombre de la madre «nacido de…», o ${t('jr.n')} «hecho por…».</p>
${nb('Abreviaturas: la ofrenda de invocación se escribe a menudo con el grupo '+h('𓉓')+' (pan, jarra y casa), y «mil (de)» '+tp('ḫꜣ m')+' se indica con '+h('𓆼')+' delante de cada producto: '+tp('ḫꜣ m t ḥnqt')+' «mil panes y jarras de cerveza».')}`);

add(24, 'La llamada a los vivos y otras fórmulas funerarias', `
<p>Muchas estelas añaden, tras la fórmula de ofrendas, una <b>llamada a los vivos</b>: el difunto pide a quien pase ante su monumento que recite la ofrenda, porque la palabra pronunciada bastaba para hacerla efectiva:</p>
${x('','j ꜥnḫw tpjw tꜣ','¡oh vivos que estáis sobre la tierra!')}
${x('','swꜣtj.sn ḥr wḏ pn','que pasaréis junto a esta estela')}
${x('','mrrw ꜥnḫ msḏḏw ḫpt','que amáis la vida y odiáis la muerte')}
${x('','ḏd.ṯn ḫꜣ m t ḥnqt n kꜣ n jmꜣḫ NN','decid: «mil panes y cerveza para el ka del venerado NN»')}
<p>A veces se promete una recompensa («así os favorecerán vuestros dioses») o se recuerda que recitar no cuesta nada: ${t('ṯꜣw n r pw')} «es (solo) un aliento de la boca».</p>
<p>Tras el nombre del difunto, la estela puede continuar con su autobiografía, introducida por ${t('ḏd.f')} «que dice» (un imperfectivo usado como relativa sin marca): ${t('n kꜣ n jmꜣḫ NN ḏd.f jnk')}… «para el ka del venerado NN, que dice: yo soy…».</p>`);

add(24, 'wnn y pꜣ; la negación de las formas relativas', `
<p><b>${t('wnn')}:</b> ${t('wnt.n.f')} «(lo) que él era»; ${t('wnnt.f')} «(lo) que él es». <b>${t('pꜣ')}:</b> ${t('pꜣ.n.f')} … «lo que él había hecho antes».</p>
<p><b>Negación:</b> con la forma relativa del verbo negativo ${t('tm')} + complemento negativo: ${t('tmt.f jrj')} «lo que él no hace»; ${t('tmt.n.f sḏm')} «lo que no oyó».</p>`);

/* ===================== TEMA 25 ===================== */
add(25, 'Usos no atributivos: formas relativas como sustantivos', `
<p>Las formas relativas pueden usarse <b>sin antecedente</b>, como sustantivos («lo que él dijo») o como <b>oraciones sustantivas</b> («el hecho de que él dijera»). En este segundo uso funcionan como sujeto, objeto o complemento de preposición:</p>
${x('','jj.n.j ḥr ḏd.n.f','he venido a causa de que él lo dijo')}
<p>Muchas de las formas que los gramáticos antiguos llamaban «formas enfáticas» o «sḏm.f sustantivo» son, según el análisis actual, estas formas relativas en uso sustantivo.</p>`);

add(25, 'Tema y rema; las oraciones enfáticas', `
<p>Toda oración tiene un <b>tema</b> (aquello de lo que se habla, lo conocido) y un <b>rema</b> (lo que se dice de ello, lo nuevo). Normalmente el tema es el sujeto y el rema el predicado, pero no siempre.</p>
<p>En una <b>oración enfática</b>, el verbo (en forma relativa no atributiva) es el tema, y el <b>rema</b> es un elemento adverbial: una preposición con su complemento, un adverbio o una oración subordinada. El acento informativo recae en ese elemento:</p>
${x('','jj.n.f m ḥtp','es en paz como ha venido','(se sabe que vino; lo nuevo es «en paz»)')}
${x('','mrr.f mꜣꜥt','es la verdad lo que él ama')}
<p>Para traducir, se pueden usar construcciones con «es… como / donde / porque…», o simplemente dar más peso al complemento en español.</p>`);

add(25, 'Tipos de oraciones enfáticas', `
<ul>
<li><b>Con interrogativo enfatizado:</b> la pregunta recae en el complemento: ${t('jj.n.k ḥr mj')} «¿por qué has venido?» (literalmente «tu venir es a causa de qué»).</li>
<li><b>Con adverbio o sintagma preposicional:</b> ${t('jj.n.j m njwt.j')} «es de mi ciudad de donde vengo».</li>
<li><b>Con oración adverbial enfatizada:</b> ${t('jrr.f st r sḏm.tw.f')} «lo hace para que se le oiga».</li>
<li><b>Con oración subordinada inicial:</b> una forma relativa al comienzo puede funcionar como una condicional o temporal: «cuando él hace…, …».</li>
<li><b>Oraciones equilibradas:</b> dos formas enfáticas seguidas, la segunda es el rema de la primera: ${t('mꜣꜣ.f mꜣꜣ.tw.f')} «cuando él ve, es visto»; ${t('ḏd.f jrr.tw')} «lo que él dice se hace».</li>
</ul>`);

add(25, 'Subordinación, negación e identificación de las enfáticas', `
<p><b>Subordinación:</b> una oración enfática puede subordinarse con ${t('ntt')} o ir tras ${t('jw')}, conservando su estructura de tema + rema.</p>
<p><b>Negación:</b> con ${t('n')} … ${t('js')} (negando el rema: «no es por esto por lo que…») o con ${t('tm')} en forma relativa (negando el verbo).</p>
<p><b>${t('wnn')} en uso enfático:</b> ${t('wnn.f')} permite enfatizar el complemento de una oración no verbal: ${t('wnn.f m pr')} «es en la casa donde está».</p>
<p><b>Cómo reconocerlas:</b> sospecha de una oración enfática cuando una forma verbal sin partícula inicial (o con geminación en los verbos débiles: ${t('mrr.f')}, ${t('jrr.f')}) va seguida de un complemento adverbial que parece la información principal, sobre todo en preguntas con interrogativo al final.</p>
<p><b>Énfasis sin formas relativas:</b> también hay énfasis con otras construcciones, como la anteposición con ${t('jr')} («en cuanto a…») o la oración participial.</p>
<p><b>Sujeto enfatizado:</b> para destacar el sujeto («es X quien…») se usa la oración participial con ${t('jn')} (tema 23): ${t('jn ḥm.f jrj st')}.</p>`);

/* ===================== TEMA 26 ===================== */
add(26, 'Reglas y excepciones; las categorías de palabras', `
<p>Una gramática describe regularidades, pero los textos reales siempre presentan excepciones: errores de escriba, variantes regionales, arcaísmos, rasgos del egipcio tardío. Ante una frase «imposible», considera primero si hay un error de copia o una grafía defectiva antes de inventar una construcción nueva.</p>
<p><b>Categorías de palabras</b> del egipcio medio: sustantivos (tema 4), pronombres (temas 5, 10, 15), adjetivos (tema 6), preposiciones y adverbios (tema 8), partículas (tema 16) y verbos (temas 13–25).</p>`);

add(26, 'Resumen del sistema verbal', `
${tb(['Forma','Tema','Valor básico','Negación'],[

['Pseudoverbal ('+t('ḥr/m/r')+' + inf.)',15,'progresivo / futuro',t('nn')+' (raro)'],
['Imperativo',16,'orden',t('m')+' + compl. neg.'],
['Estativo',17,'estado; pasado intransitivo',t('nn')],
[t('sḏm.n.f')+' (perfecto)',18,'acción completada',t('n sḏm.n.f')+' = «no puede»'],
['Subjuntivo',19,'deseo, finalidad, tras '+t('rdj'),t('jmj')+' / '+t('tm')],
['Perfectivo',20,'pasado (negado)',t('n sḏm.f')+' = «no hizo»'],
['Imperfectivo',20,'habitual, general',t('n sḏm.n.f')],

[t('sḏm.jn.f')+', '+t('sḏm.ḫr.f')+', '+t('sḏm.kꜣ.f'),22,'consecuencia','—'],
[t('sḏmt.f'),22,'«todavía no», «hasta que»',t('n sḏmt.f')],
['Participios',23,'adjetivo verbal','participio de '+t('tm')],
['Formas relativas',24,'«lo que X hace»','forma relativa de '+t('tm')],
['Formas relativas no atributivas',25,'oraciones enfáticas',t('n … js')+' / '+t('tm')],
])}`);

add(26, 'Rasgos de las formas verbales: acción y estado, modo, voz, tiempo y aspecto', `
<ul>
<li><b>Acción frente a estado:</b> casi todas las formas expresan acciones; el estativo (y en parte la pseudoverbal con ${t('m')}) expresa estados.</li>
<li><b>Modo:</b> indicativo (hechos: perfecto, perfectivo, imperfectivo), subjuntivo (deseos, posibilidades: subjuntivo, prospectivo) e imperativo (órdenes).</li>
<li><b>Voz:</b> activa o pasiva; el pasivo se expresa con el pasivo ${t('sḏm.f')}, con ${t('.tw')}, con el estativo de los transitivos y con los participios pasivos.</li>
<li><b>Tiempo:</b> el egipcio marca el tiempo de forma <b>relativa</b>: anterior (perfecto, perfectivo), simultáneo (imperfectivo, pseudoverbal con ${t('ḥr')}) o posterior (prospectivo, ${t('r')} + infinitivo) respecto al momento de referencia.</li>
<li><b>Aspecto:</b> perfectivo (la acción como un todo) frente a imperfectivo (acción repetida o en curso). Es la oposición principal de participios y formas relativas.</li>
</ul>`);

add(26, 'Los predicados y las oraciones: resumen', `
<p><b>Predicados:</b> nominal (A B, A pw, A pw B), adjetival (adj. + sujeto), adverbial (sujeto + adv. / prep.), pseudoverbal (sujeto + prep. + inf.) y verbal (formas conjugadas).</p>
<p><b>Oraciones subordinadas:</b></p>
${tb(['Tipo','Medios principales'],[
['Sustantivas',t('ntt')+', '+t('wnt')+', formas relativas no atributivas, subjuntivo tras verbos de voluntad, sin marca tras verbos de percepción'],
['Relativas',t('ntj')+' / '+t('jwtj')+' (antecedente determinado), formas relativas, participios, sin marca (antecedente indeterminado)'],
['Circunstanciales','sin marca o con '+t('jw')+'; '+t('jsṯ')],
['De resultado','subjuntivo o estativo sin marca'],
['De finalidad',t('r')+' + infinitivo; subjuntivo sin marca; '+t('n-mrwt')+' + subjuntivo'],
['Causales',t('ḏr ntt')+', '+t('ḥr ntt')+', '+t('n-ntt')+'; '+t('ḥr')+' + forma relativa'],
['Condicionales',t('jr')+' + verbo («si…»), con '+t('sḏm.ḫr.f')+' / '+t('sḏm.kꜣ.f')+' en la principal; condicional irreal con perfecto'],
['Concesivas',t('jsṯ')+', '+t('mj')+' + forma; «aunque…»'],
['Temporales',t('ḏr')+', '+t('m-ḫt')+', '+t('r')+' + '+t('sḏmt.f')+', '+t('ḫft')],
])}
<p><b>Relación entre oraciones:</b> el egipcio prefiere la <b>yuxtaposición</b>: muchas oraciones se encadenan sin conjunciones, y el traductor debe deducir la relación lógica (tiempo, causa, finalidad…).</p>`);

add(26, 'Teorías gramaticales y adónde ir después', `
<p><b>La teoría de Gardiner.</b> La <i>Egyptian Grammar</i> de Alan Gardiner (1927; 3.ª ed. 1957) describió las formas ${t('sḏm.f')} sobre todo por su tiempo y modo. Sigue siendo una obra de consulta imprescindible por sus ejemplos y su lista de signos.</p>
<p><b>La «teoría estándar».</b> Desde los años 40, H. J. Polotsky propuso que muchas formas verbales tienen funciones sintácticas (sustantivas, adjetivales, adverbiales) más que temporales, y describió las <b>oraciones enfáticas</b>. Esta visión dominó la egiptología durante décadas.</p>
<p><b>La teoría actual.</b> Desde los años 80 se ha matizado la teoría estándar: las formas tienen a la vez valores de aspecto, tiempo y modo y funciones sintácticas. Este curso, como la gramática de Allen, sigue esta visión de conjunto.</p>
<p><b>Para seguir aprendiendo:</b></p>
<ul>
<li><b>Gramáticas:</b> Gardiner, <i>Egyptian Grammar</i>; Allen, <i>Middle Egyptian</i>; Borghouts, <i>Egyptian</i>; Hoch, <i>Middle Egyptian Grammar</i>.</li>
<li><b>Diccionarios:</b> Faulkner, <i>A Concise Dictionary of Middle Egyptian</i>; el gran <i>Wörterbuch der ägyptischen Sprache</i> de Erman y Grapow; y el <i>Thesaurus Linguae Aegyptiae</i> en línea (base del diccionario que acompaña a este curso).</li>
<li><b>Textos:</b> las antologías de Sethe (<i>Ägyptische Lesestücke</i>), De Buck (<i>Egyptian Readingbook</i>) y Blackman (<i>Middle-Egyptian Stories</i>), y las ediciones de <i>Sinuhé</i>, <i>El náufrago</i> y <i>El campesino elocuente</i>.</li>
<li><b>Recursos:</b> el Thesaurus Linguae Aegyptiae (thesaurus-linguae-aegyptiae.de) con textos y lemas; las bases de datos de jeroglíficos Unicode; y el cuaderno de ejercicios y el diccionario de esta serie.</li>
</ul>
<p>La mejor manera de dominar el egipcio medio es <b>leer mucho</b>: empieza por estelas y fórmulas, sigue con <i>El náufrago</i> y <i>Sinuhé</i>, y consulta la gramática cada vez que una frase se te resista.</p>`);

add(22, 'Fórmulas de ofrenda de los Textos de las Pirámides y listas de ofrendas', `
<p>Además de la fórmula ${t('ḥtp-dj-nswt')} (tema 24), los textos funerarios contienen otros dos tipos de textos de ofrenda:</p>
<ul>
<li><b>Fórmulas de ofrenda</b> de los Textos de las Pirámides: textos breves que se recitaban al presentar cada ofrenda. El difunto recibe el nombre de «Osiris» y la ofrenda se llama «el Ojo de Horus»; a menudo hay un juego de palabras con el nombre del alimento. Ejemplo (TP 142): ${t('jsjrt')} N ${t('m n.k jrt ḥrw')} «Osiris N, toma para ti el Ojo de Horus…», seguido del nombre de la ofrenda y su cantidad.</li>
<li><b>El ritual de ofrendas</b> empezaba con la <b>apertura de la boca</b> (${t('wpt-r')}), que devolvía a la momia la capacidad de comer, hablar y sentir, y seguía con la presentación de cada alimento.</li>
<li><b>Listas de ofrendas</b>: en las tumbas de particulares del Reino Antiguo y Medio se pintaba una tabla con casillas que nombraba cada ofrenda (agua, incienso, ungüentos, panes de distintas clases, cerveza, vino, carnes, aves, frutas…) y su cantidad. Siguen el mismo orden que el ritual de los Textos de las Pirámides, y en ellas verás muchos nombres de panes y de aceites que no aparecen en otros textos.</li>
</ul>
<p>La palabra ${t('m')} en ${t('m n.k')} es aquí el imperativo «¡toma!» (un verbo defectivo), no la preposición.</p>`);
/* ===================== ENSAYOS 1–9 ===================== */
essay(1, 'La historia del antiguo Egipto', `
<p>La civilización egipcia duró más de tres mil años. Los historiadores la dividen en grandes <b>reinos</b> (épocas de unidad y prosperidad) separados por <b>periodos intermedios</b> (épocas de división), y agrupan a los reyes en treinta <b>dinastías</b>, siguiendo al sacerdote Manetón, que escribió una historia de Egipto en griego en el siglo III a. C.</p>
${tb(['Periodo','Fechas aproximadas','Dinastías','Rasgos'],[
['Predinástico','antes de 3100 a. C.','—','Culturas de Nagada; formación de los primeros reinos'],
['Época Tinita (Arcaica)','3100–2686','1–2','Unificación (Narmer); aparece la escritura'],
['<b>Reino Antiguo</b>','2686–2160','3–8','Era de las pirámides: Zoser, Keops, Kefrén; Textos de las Pirámides'],
['Primer Periodo Intermedio','2160–2055','9–11','División: Heracleópolis frente a Tebas'],
['<b>Reino Medio</b>','2055–1650','11–13','Reunificación (Mentuhotep II); época clásica de la lengua y la literatura'],
['Segundo Periodo Intermedio','1650–1550','14–17','Los hicsos gobiernan el norte'],
['<b>Reino Nuevo</b>','1550–1069','18–20','Imperio: Tutmosis III, Akenatón, Tutankamón, Ramsés II'],
['Tercer Periodo Intermedio','1069–664','21–25','División; reyes libios y nubios'],
['Época Baja','664–332','26–30','Restauración saíta; dominio persa'],
['Época grecorromana','332 a. C. – 395 d. C.','Ptolomeos','Alejandro Magno, Cleopatra VII, Roma'],
])}
<p>El <b>egipcio medio</b> nació como la lengua hablada del final del Primer Periodo Intermedio y del Reino Medio. Bajo la dinastía XII (los Amenemhat y los Senusret) se escribieron las grandes obras literarias: <i>Sinuhé</i>, <i>El náufrago</i>, <i>El campesino elocuente</i>, las enseñanzas. Por eso los egipcios posteriores lo consideraron la lengua clásica y siguieron usándolo en monumentos y textos religiosos durante el resto de su historia.</p>
<p>Las fechas anteriores al 664 a. C. son aproximadas: se calculan sumando los años de reinado de las listas de reyes y anclándolas con algunas observaciones astronómicas (ver el ensayo del tema 9). El margen de error es de unas décadas en el Reino Medio y mayor en épocas más antiguas.</p>`);

essay(2, 'La geografía de Egipto', `
<p>Egipto es, como dijo Heródoto, un «don del Nilo». Casi todo su territorio es desierto; la vida se concentraba en una estrecha franja de tierra fértil a ambos lados del río y en el <b>Delta</b>, el amplio abanico de brazos en que se divide antes de llegar al Mediterráneo.</p>
<p>Los egipcios distinguían dos tierras: el <b>Alto Egipto</b> (${t('šmꜥw')}), el valle estrecho del sur, desde la primera catarata en Asuán hasta cerca de Menfis, y el <b>Bajo Egipto</b> (${t('tꜣ-mḥw')}), el Delta. El rey era «señor de las Dos Tierras» (${t('nb tꜣwj')}) y llevaba la doble corona. Como el Nilo corre de sur a norte, «subir» el río (${t('ḫntj')}) significaba ir al sur, y «bajar» (${t('ḫdj')}), ir al norte. El sur era la dirección principal: los egipcios se orientaban mirando hacia las fuentes del río, con el oeste a la derecha.</p>
<p>El país se dividía en unas cuarenta provincias, los <b>nomos</b> (${t('spꜣt')}): 22 en el Alto Egipto y unos 20 en el Bajo. Cada uno tenía su capital, sus dioses y, en el Reino Medio, sus poderosos gobernadores.</p>
<p>La tierra cultivada, negra por el limo, se llamaba ${t('kmt')} «la Negra», que es el nombre de Egipto. El desierto era ${t('dšrt')} «la Roja». Más allá estaban los ${t('ḫꜣswt')} «países montañosos, extranjeros»: Nubia (${t('tꜣ-stj')}) al sur, Libia al oeste, el Sinaí y Asia (Retenu) al nordeste. Los <b>oasis</b> del desierto occidental eran puestos avanzados.</p>
<p>La <b>crecida anual</b> del Nilo, entre julio y octubre, cubría los campos y depositaba limo fértil. De ella dependía todo: una crecida baja traía hambre; una demasiado alta, destrucción. Por eso la inundación se divinizó como el dios Hapi y se midió con cuidado en los «nilómetros».</p>
<p>Ciudades clave que aparecen en los textos: <b>Menfis</b> (${t('mn-nfr')}), capital del norte; <b>Heliópolis</b> (${t('jwnw')}), centro del culto solar; <b>Tebas</b> (${t('wꜣst')}), capital del sur y ciudad de Amón; <b>Abido</b> (${t('ꜣbḏw')}), ciudad de Osiris; <b>Hermópolis</b> (${t('ḫmnw')}), ciudad de Thot.</p>`);

essay(3, 'La sociedad egipcia', `
<p>La sociedad egipcia era una pirámide. En la cima estaba el <b>rey</b>, un ser humano que encarnaba una función divina: era el intermediario entre los dioses y los hombres y el garante del orden (Maat). Debajo, una pequeña <b>élite</b> de funcionarios, sacerdotes y militares, que sabía leer y escribir (quizá un 1–5 % de la población). La gran mayoría eran <b>campesinos</b> que trabajaban la tierra del rey, de los templos o de los grandes propietarios.</p>
<p>La administración estaba encabezada por el <b>visir</b> (${t('ṯꜣtj')}), especie de primer ministro y juez supremo. Por debajo había tesoreros, mayordomos, escribas y gobernadores de provincia. Los títulos que verás en las estelas (${t('jrj-pꜥt')}, ${t('ḥꜣtj-ꜥ')}, ${t('smr wꜥtj')}…) expresan el rango en esta jerarquía.</p>
<p>El <b>escriba</b> ocupaba un lugar privilegiado. Saber escribir abría las puertas de la administración y eximía del trabajo manual; textos como la <i>Sátira de los oficios</i> lo celebran burlándose de los demás trabajos.</p>
<p>Las <b>mujeres</b> tenían una posición notable para la Antigüedad: podían poseer bienes, heredar, firmar contratos y acudir a los tribunales. Su ámbito habitual era la casa (de ahí el título ${t('nbt pr')} «señora de la casa»), y muy pocas accedían a cargos públicos, pero algunas fueron sacerdotisas, administradoras e incluso reinas con poder propio, como Hatshepsut.</p>
<p>No existía la esclavitud a la manera grecorromana; había prisioneros de guerra y personas en servidumbre por deudas, y los campesinos estaban sujetos a la <b>corvea</b>, el trabajo obligatorio en obras públicas. La familia era la base de la sociedad: los textos insisten en honrar a los padres, mantener a la esposa y cuidar de los hijos.</p>`);

essay(4, 'Los dioses', `
<p>Para los egipcios, los dioses (${t('nṯrw')}) eran las fuerzas y los elementos del mundo: el sol, el aire, la tierra, la crecida, pero también las ideas, como la verdad o la escritura. Había cientos de divinidades, y no formaban un sistema cerrado: una misma fuerza podía tener varios nombres, y varios dioses podían fundirse en uno (Amón-Ra, Ra-Horajti).</p>
<p>Los dioses se representaban de varias formas: como humanos, como animales o como humanos con cabeza de animal. Estas imágenes no pretendían ser retratos: eran maneras de expresar su naturaleza. El halcón de Horus vuela alto como el sol; el chacal de Anubis rondaba los cementerios.</p>
${tb(['Dios','Nombre','Ámbito'],[
['Ra',t('rꜥ'),'el sol, el creador'],
['Amón',t('jmn'),'«el oculto», dios de Tebas; rey de los dioses en el Reino Nuevo'],
['Osiris',t('wsjr'),'el rey muerto y resucitado; señor del más allá'],
['Isis',t('ꜣst'),'esposa de Osiris, madre de Horus; maga y protectora'],
['Horus',t('ḥrw'),'el halcón; hijo de Osiris; el rey vivo es su encarnación'],
['Seth',t('stẖ'),'fuerza del desorden y del desierto; asesino de Osiris'],
['Thot',t('ḏḥwtj'),'escritura, sabiduría y la luna'],
['Ptah',t('ptḥ'),'dios creador y artesano de Menfis'],
['Hathor',t('ḥwt-ḥr'),'amor, música, alegría; también diosa del cielo'],
['Anubis',t('jnpw'),'embalsamamiento y necrópolis'],
['Maat',t('mꜣꜥt'),'el orden justo del mundo'],
])}
<p>Los dioses se agrupaban en familias, como la <b>tríada</b> de Tebas (Amón, Mut y Jonsu) o la <b>Enéada</b> de Heliópolis (Atum y sus descendientes: Shu, Tefnut, Geb, Nut, Osiris, Isis, Seth y Neftis). El mito de Osiris, Isis, Horus y Seth explicaba la realeza, la muerte y la resurrección, y fue el más difundido de todos.</p>`);

essay(5, 'Los dioses en la tierra', `
<p>Los dioses vivían en el cielo y en el mundo invisible, pero se hacían presentes en la tierra a través de sus <b>imágenes</b>, de sus animales sagrados y del <b>rey</b>.</p>
<p>El <b>templo</b> (${t('ḥwt-nṯr')} «mansión del dios») era la casa del dios. En su parte más interior y oscura, el santuario, se guardaba la estatua de culto, en la que el dios «se posaba». Cada día los sacerdotes la despertaban, la lavaban, la vestían, la perfumaban y le ofrecían comida; luego cerraban el santuario. La gente común no entraba en los templos: se acercaba al dios en las puertas y, sobre todo, en las <b>fiestas</b>, cuando la estatua salía en procesión en su barca sagrada.</p>
<p>Los <b>sacerdotes</b> eran, en teoría, delegados del rey, que era el único sacerdote verdadero de todos los dioses. Había profetas (${t('ḥmw-nṯr')}), sacerdotes puros (${t('wꜥbw')}), lectores (${t('ẖrjw-ḥbt')}) que recitaban los textos, y muchos servían por turnos de un mes al año, compaginándolo con otros oficios.</p>
<p>El <b>rey</b> era el vínculo entre los dioses y los hombres. Como «hijo de Ra» y encarnación de Horus, recibía de los dioses la vida y el poder y, a cambio, mantenía el orden (Maat), construía templos y les hacía ofrendas. En los relieves de los templos siempre es el rey quien aparece ofreciendo a los dioses. A su muerte se identificaba con Osiris, y su sucesor tomaba el papel de Horus.</p>
<p>Algunos <b>animales</b> (el toro Apis de Menfis, los ibis de Thot, los gatos de Bastet) eran considerados manifestaciones de un dios; en época tardía se momificaron millones de ellos como ofrendas.</p>`);

essay(6, 'Los nombres del rey', `
<p>Desde la V dinastía, cada rey tenía una <b>titulatura</b> de cinco nombres, que proclamaban su programa de gobierno y su relación con los dioses. Se elegían al subir al trono (salvo el nombre de nacimiento):</p>
${tb(['Nombre','Título','Contenido'],[
['1. Nombre de <b>Horus</b>',t('ḥrw'),'El rey como encarnación de Horus. Se escribía dentro del <i>serej</i>, la fachada de un palacio con el halcón encima.'],
['2. Nombre de las <b>Dos Señoras</b>',t('nbtj'),'El rey bajo la protección de Nejbet (buitre, Alto Egipto) y Uadyet (cobra, Bajo Egipto).'],
['3. Nombre de <b>Horus de oro</b>',t('ḥrw nbw'),'De sentido discutido; relaciona al rey con el oro, la carne imperecedera de los dioses.'],
['4. Nombre de <b>trono</b>',t('nswt-bjtj'),'«El del junco y la abeja»: rey del Alto y del Bajo Egipto. Va en un cartucho y casi siempre contiene el nombre de Ra.'],
['5. Nombre de <b>nacimiento</b>',t('zꜣ-rꜥ'),'«Hijo de Ra»: el nombre personal, también en cartucho. Es el que usamos los modernos (con números: Amenemhat III).'],
])}
<p>Por ejemplo, Senusret I se llamaba como rey ${t('ḫpr-kꜣ-rꜥ')} «Jeperkara» («El ka de Ra ha llegado a existir») y como hijo de Ra ${t('z-n-wsrt')} «Senusret». Los egipcios solían referirse a un rey por su nombre de trono; los historiadores modernos usamos el de nacimiento.</p>
<p>El <b>cartucho</b> (${t('šnw')}) es una cuerda anudada que rodea el nombre: simboliza que el rey gobierna todo lo que rodea el sol. Tras el nombre se añadían deseos como ${t('ꜥnḫ ḏt')} «que viva eternamente» o ${t('ꜥnḫ wḏꜣ snb')}.</p>
<p>El rey se designaba también con otras expresiones: ${t('ḥm.f')} «su majestad» (literalmente «su persona, su cuerpo»), ${t('nṯr nfr')} «el dios perfecto», ${t('nb tꜣwj')} «señor de las Dos Tierras» y ${t('pr-ꜥꜣ')} «la Casa Grande» (el palacio), que en el Reino Nuevo pasó a designar al propio rey: de ahí nuestra palabra «faraón».</p>`);

essay(7, 'La naturaleza humana', `
<p>Los egipcios concebían a la persona como un conjunto de elementos, algunos materiales y otros espirituales, que en vida estaban unidos y que la muerte separaba:</p>
<ul>
<li><b>El cuerpo</b> (${t('ḥꜥw')}, ${t('ẖt')}): la base física, que debía conservarse mediante la momificación para que la persona siguiera existiendo.</li>
<li><b>El corazón</b> (${t('jb')}, ${t('ḥꜣtj')}): sede del pensamiento, la memoria, la voluntad y el carácter. No se extraía en la momificación porque se necesitaba en el juicio de los muertos.</li>
<li><b>El nombre</b> (${t('rn')}): parte esencial de la persona. Borrar el nombre de alguien de sus monumentos era destruir su existencia; mantenerlo vivo, pronunciándolo, le aseguraba la eternidad.</li>
<li><b>La sombra</b> (${t('šwt')}): compañera inseparable del cuerpo, con cierta independencia.</li>
<li><b>El ka</b> (${t('kꜣ')}): la fuerza vital, que se transmitía de padres a hijos y de los dioses al rey. Tras la muerte el ka permanecía en la tumba y necesitaba alimento: las ofrendas se hacían «para el ka de» (${t('n kꜣ n')}) el difunto.</li>
<li><b>El ba</b> (${t('bꜣ')}): la capacidad de manifestarse y moverse, representada como un pájaro con cabeza humana. Tras la muerte, el ba salía de la tumba de día y volvía por la noche a unirse a la momia.</li>
<li><b>El akh</b> (${t('ꜣḫ')}): la forma «efectiva», luminosa, que alcanzaba el difunto justificado al reunirse su ba con su ka. Los muertos bienaventurados eran ${t('ꜣḫw')}.</li>
</ul>
<p>Para los egipcios, el ser humano ideal era el que vivía de acuerdo con la Maat: callado y comedido (${t('gr')} «el silencioso»), frente al «acalorado» (${t('šmm')}) que se deja llevar por la pasión. Este ideal recorre las enseñanzas y las autobiografías.</p>`);

essay(8, 'La muerte y el más allá', `
<p>Para los egipcios, la muerte no era un final, sino una transición a otra forma de vida. Para lograrla había que conservar el cuerpo, superar los peligros del mundo inferior y salir airoso del juicio.</p>
<p><b>La momificación.</b> El cuerpo se vaciaba de órganos internos (que se guardaban en los vasos canopos), se secaba con natrón durante cuarenta días y se envolvía en vendas con amuletos. El rito de la <b>apertura de la boca</b> devolvía a la momia la capacidad de respirar, comer y hablar.</p>
<p><b>La tumba</b> era la «casa de eternidad». Tenía dos partes: una cámara funeraria sellada y una capilla accesible donde los vivos dejaban ofrendas ante la <b>falsa puerta</b>, por la que el ka del difunto salía a alimentarse. La fórmula de ofrendas (${t('ḥtp-dj-nswt')}) aseguraba, por la magia de la palabra, la comida eterna aunque nadie llevara ofrendas reales.</p>
<p><b>Los textos funerarios</b> guiaban al difunto: los <i>Textos de las Pirámides</i> (Reino Antiguo, solo para reyes), los <i>Textos de los Ataúdes</i> (Reino Medio, para la élite) y el <i>Libro de los Muertos</i>, cuyo nombre egipcio era «Fórmulas para salir al día» (Reino Nuevo en adelante). El difunto viajaba por la <b>Duat</b>, el mundo inferior, enfrentándose a guardianes y monstruos con la ayuda de conjuros.</p>
<p><b>El juicio.</b> El corazón del difunto se pesaba en una balanza contra la pluma de Maat, ante Osiris y 42 jueces. El difunto recitaba la «confesión negativa», declarando que no había cometido una larga lista de faltas. Si el corazón no pesaba más que la pluma, era declarado ${t('mꜣꜥ-ḫrw')} «justo de voz» y se unía a Osiris; si no, la Devoradora, mezcla de cocodrilo, león e hipopótamo, lo destruía.</p>
<p><b>El destino feliz</b> podía imaginarse de varias formas: acompañar al sol en su barca, brillar como una estrella imperecedera o vivir en el <b>Campo de Juncos</b>, una versión ideal de Egipto donde el grano crecía altísimo. Para no tener que trabajar allí, se enterraban estatuillas llamadas <b>ushebtis</b> que harían las labores en su lugar.</p>`);

essay(9, 'La cronología egipcia', `
<p>Los egipcios no tenían una era fija como nuestro «antes de Cristo» o «después de Cristo». Fechaban por <b>años de reinado</b> del rey vivo, y la cuenta volvía a empezar con cada nuevo soberano. Para reconstruir una cronología seguida hacen falta, por tanto, listas de reyes con la duración de cada reinado.</p>
<p><b>Las fuentes.</b> Disponemos de varias listas antiguas: la <i>Piedra de Palermo</i> (anales del Reino Antiguo), el <i>Canon de Turín</i> (un papiro del Reino Nuevo con cientos de reyes y sus años, por desgracia muy fragmentado), las listas reales de los templos de Abido y Karnak y la obra de Manetón, conservada solo en resúmenes de autores posteriores. Ninguna es completa y a veces se contradicen.</p>
<p><b>Las anclas astronómicas.</b> Para convertir los años de reinado en fechas absolutas, los egiptólogos usan registros de fenómenos celestes. El más importante es la <b>salida helíaca de Sirio</b>, la primera aparición anual de la estrella al amanecer, que marcaba el inicio ideal del año. Como el calendario civil de 365 días se desfasaba un día cada cuatro años respecto a ese fenómeno, una fecha del calendario en que se observó la salida de Sirio permite calcular, con cierto margen, el año real. Un papiro de Illahun registra una de estas observaciones en el año 7 de Senusret III, y otra se conoce para Amenhotep I. También se usan fechas de lunas nuevas.</p>
<p><b>Otros métodos.</b> Las fechas sincronizadas con otras civilizaciones (Mesopotamia, el mundo hitita) y, más recientemente, el <b>radiocarbono</b> sobre materiales orgánicos han permitido afinar la cronología.</p>
<p>El resultado es fiable desde el 664 a. C.; para el Reino Nuevo el margen es de unos diez o veinte años; para el Reino Medio, algo mayor; y para el Reino Antiguo puede llegar a un siglo. Por eso diferentes libros dan fechas ligeramente distintas para el mismo rey.</p>`);
/* ===================== ENSAYOS 10–17 ===================== */
essay(10, 'Maat', `
<p>${t('mꜣꜥt')}, Maat, es quizá el concepto central de la civilización egipcia. Se traduce como «verdad», «justicia» u «orden», pero abarca las tres ideas a la vez: es el <b>orden correcto del mundo</b> tal como lo estableció el creador, en la naturaleza, en la sociedad y en la conducta de cada persona.</p>
<p>Su contrario es ${t('jsft')}, el <b>desorden</b>, la injusticia, el caos que siempre amenaza con volver. El mundo no estaba garantizado: había que mantener la Maat cada día. El sol debía vencer a la serpiente Apofis en su viaje nocturno; el rey debía vencer a los enemigos y hacer justicia; cada persona debía actuar con rectitud.</p>
<p>Maat se personificaba como una <b>diosa</b> con una pluma de avestruz en la cabeza, hija de Ra. Los dioses «vivían de Maat», y el acto ritual más importante del rey era ofrecerle a los dioses una figurilla de la diosa: con ello mostraba que cumplía su misión.</p>
<p>Para el rey, mantener la Maat significaba gobernar con justicia, proteger a los débiles, construir templos y alimentar a los dioses. Para los particulares, significaba «decir la verdad y hacer la justicia» (${t('ḏd mꜣꜥt jr mꜣꜥt')}), cumplir con los superiores, ayudar a los necesitados y no abusar del poder. Las autobiografías repiten estas ideas: «di pan al hambriento, ropa al desnudo, una barca al que no tenía». En el juicio de los muertos, el corazón se pesaba precisamente contra la pluma de Maat.</p>
<p>Maat incluía también una idea de <b>reciprocidad</b>: quien actúa por los demás recibe a su vez, de los hombres y de los dioses. «Actúa para el que actúa» es uno de los consejos del <i>Campesino elocuente</i>.</p>`);

essay(11, 'El mundo antes de la creación', `
<p>Los egipcios imaginaban que, antes de la creación, solo existía un <b>océano infinito, oscuro e inmóvil</b>: el ${t('nnw')}, Nun. No era «la nada», sino una materia sin forma ni límites, sin luz, sin vida y sin diferencias: lo que existía antes de que algo «llegara a ser».</p>
<p>Los textos lo describen por negación: el tiempo en que «el cielo no había llegado a existir, la tierra no había llegado a existir, los hombres no habían nacido, los dioses no habían sido concebidos, la muerte no había llegado a existir». Este «antes» se llamaba también el ${t('zp tpj')}, «la primera vez».</p>
<p>En Hermópolis se describía este estado con ocho dioses, la <b>Ogdóada</b>: cuatro parejas que personificaban las cualidades del caos primordial: Nun y Naunet (las aguas), Heh y Hehet (la infinitud), Kek y Keket (la oscuridad) y Amón y Amaunet (lo oculto). Los varones tenían cabeza de rana y las hembras de serpiente, animales asociados con el limo fértil.</p>
<p>Para los egipcios, el mundo creado era como una <b>burbuja</b> dentro de ese océano: el cielo (Nut) arqueado sobre la tierra (Geb), con el aire (Shu) en medio. Las aguas primordiales seguían rodeando el mundo y se manifestaban en la crecida del Nilo y en las aguas subterráneas. El caos no desapareció con la creación: seguía en los márgenes, y los dioses y el rey debían contenerlo cada día.</p>`);

essay(12, 'La creación del mundo', `
<p>Hay varios relatos egipcios de la creación, y no se veían como contradictorios: cada uno explica un aspecto distinto de un mismo misterio.</p>
<p><b>Heliópolis.</b> El dios <b>Atum</b> («el completo, el que no existe todavía») surgió por sí mismo del Nun, sobre una colina primordial que emergió de las aguas como los montículos de tierra tras la crecida. Solo, creó a la primera pareja: <b>Shu</b> (el aire, el espacio vacío) y <b>Tefnut</b> (quizá la humedad o el orden). De ellos nacieron <b>Geb</b> (la tierra) y <b>Nut</b> (el cielo), y de estos, Osiris, Isis, Seth y Neftis. Estos nueve dioses forman la <b>Enéada</b>. Atum, que se identifica con el sol al amanecer, es así el origen de toda la diversidad del mundo.</p>
<p><b>Hermópolis.</b> Los ocho dioses del caos (la Ogdóada) produjeron en conjunto el primer acontecimiento: la aparición del sol, a veces imaginado como un niño en una flor de loto o como un huevo cósmico depositado en la colina primordial.</p>
<p><b>Menfis.</b> <b>Ptah</b> creó el mundo concibiéndolo en su corazón y pronunciándolo con su lengua (ver los ensayos de los temas 13 y 14).</p>
<p><b>Los seres humanos</b> tienen un origen modesto en los mitos: surgieron de las lágrimas (${t('rmjt')}) del creador, por un juego de palabras con ${t('rmṯ')} «gente». En otras tradiciones, el dios <b>Jnum</b> los modelaba en su torno de alfarero.</p>
<p>Lo importante para los egipcios era que la creación no fue un hecho único: <b>se repite</b> cada día con la salida del sol, cada año con la crecida y en cada reinado con el nuevo rey. Por eso los textos describen el amanecer con las mismas palabras que el origen del mundo.</p>`);

essay(13, 'La palabra creadora', `
<p>Para los egipcios, el pensamiento y la palabra tenían poder creador. Dos fuerzas divinas lo expresaban: <b>Sia</b> (${t('sjꜣ')}), la percepción o inteligencia, y <b>Hu</b> (${t('ḥw')}), la palabra autorizada que convierte lo pensado en realidad. Junto con <b>Heka</b> (${t('ḥkꜣ')}), la magia o fuerza eficaz, acompañaban al dios sol en su barca.</p>
<p>La idea es que el creador primero concibe las cosas en su «corazón» (la mente) y luego, al nombrarlas, les da existencia. Lo mismo hace el rey: su palabra es Hu, y lo que ordena sucede (la Enseñanza lealista dice «su boca es Hu»).</p>
<p>Esta concepción explica la importancia de la <b>escritura</b> y del <b>nombre</b> en Egipto. Lo escrito y lo pronunciado tenían una eficacia real: la fórmula de ofrendas grabada en una estela proporcionaba alimentos al difunto; los nombres de los enemigos escritos en figurillas de barro y rotos ritualmente («textos de execración») los destruían; borrar el nombre de alguien de sus monumentos lo condenaba al olvido. Los jeroglíficos, «palabras del dios», participaban de ese poder: en algunas tumbas se mutilaban los signos de animales peligrosos para que no cobraran vida.</p>
<p>Por eso el lenguaje egipcio está lleno de juegos de palabras: un parecido de sonido entre dos palabras se entendía como un vínculo real entre las cosas.</p>`);

essay(14, 'La Teología menfita', `
<p>La <b>Piedra de Shabaka</b>, hoy en el Museo Británico, conserva un texto que el rey nubio Shabaka (dinastía XXV, hacia 710 a. C.) mandó copiar de un papiro antiguo «comido por los gusanos». Durante mucho tiempo se creyó que el original era del Reino Antiguo; hoy la mayoría de los especialistas piensa que la composición es más reciente, aunque deliberadamente arcaizante. La piedra fue reutilizada más tarde como muela de molino, lo que destruyó parte del texto.</p>
<p>El texto presenta a <b>Ptah</b>, el dios de Menfis, como el creador supremo. Su originalidad está en la forma de la creación: Ptah creó a todos los dioses y a todas las cosas por medio de su <b>corazón</b> (el pensamiento) y su <b>lengua</b> (la palabra). Lo que el corazón concibe, la lengua lo ordena, y así llega a existir. Atum y la Enéada de Heliópolis quedan integrados como manifestaciones del pensamiento y la palabra de Ptah: los «dientes y labios» de Ptah son la Enéada.</p>
<p>El texto añade que este mismo principio actúa en todo ser vivo: el corazón y la lengua gobiernan todos los miembros, porque el corazón piensa lo que quiere y la lengua lo ordena. Así se crearon también las ciudades, los nomos, los templos, las estatuas de los dioses y las ofrendas.</p>
<p>La segunda parte relata el conflicto entre Horus y Seth y su resolución por Geb, que finalmente entrega todo Egipto a Horus, y sitúa en Menfis la unión de las Dos Tierras y la sepultura de Osiris. La Teología menfita es un ejemplo de cómo los centros religiosos integraban los mitos de otros lugares dando el papel principal a su propio dios.</p>`);

essay(15, 'El creador', `
<p>Aunque los egipcios veneraban a muchos dioses, todos los textos coinciden en que, en el origen, hubo <b>un único dios</b> del que procede todo lo demás. Se le llama con diferentes nombres según el lugar y la época (Atum, Ra, Ptah, Amón), pero sus rasgos son los mismos: es el que «llegó a existir por sí mismo» (${t('ḫpr ḏs.f')}), el «uno que se hizo millones».</p>
<p>Los dioses posteriores, el mundo y los seres humanos son sus <b>manifestaciones</b>, sus «miembros» o sus «formas». Esto no se vivía como una contradicción: los egipcios podían decir a la vez que hay muchos dioses y que todos son aspectos de uno solo. En el Reino Nuevo, la teología de <b>Amón-Ra</b> lo expresa con claridad: Amón es el dios oculto que está detrás de todo, Ra es su cuerpo visible (el sol) y Ptah su imagen en la tierra.</p>
<p>El creador seguía actuando: el ciclo diario del sol era una renovación continua de la creación. Por la mañana el sol nacía como <b>Jepri</b> (el escarabajo, «el que llega a ser»), al mediodía brillaba como <b>Ra</b> y al atardecer envejecía como <b>Atum</b>. Por la noche descendía a la Duat, se unía a Osiris y renacía al alba.</p>
<p>Un famoso texto de los Ataúdes (fórmula 1130) pone en boca del creador una justificación de su obra: creó los cuatro vientos para que todos pudieran respirar, la crecida para que el pobre tuviera lo mismo que el poderoso, y a cada hombre igual que a su prójimo; no les ordenó hacer el mal, sino que fueron sus corazones los que transgredieron sus palabras.</p>`);

essay(16, 'La herejía de Amarna', `
<p>A mediados del siglo XIV a. C., el rey <b>Amenhotep IV</b> (dinastía XVIII) introdujo la reforma religiosa más radical de la historia de Egipto. Promovió el culto exclusivo del <b>Atón</b> (${t('jtn')}), el disco solar visible, como único dios, y cambió su propio nombre por <b>Akenatón</b> (${t('ꜣḫ-n-jtn')}, «útil para el Atón»).</p>
<p>Hacia su año 5 fundó una nueva capital en un lugar virgen del Egipto Medio, <b>Ajetatón</b> («horizonte del Atón»), la actual Amarna. Allí construyó templos sin techo, abiertos al sol, en lugar de los santuarios oscuros tradicionales. Más tarde ordenó cerrar los templos de los otros dioses y borrar el nombre de Amón de los monumentos, e incluso la palabra «dioses» en plural.</p>
<p>La nueva religión cambiaba la imagen de la divinidad: el Atón no tenía forma humana ni animal; se representaba como un disco del que salían rayos terminados en manos que ofrecían vida al rey y a su familia. Solo Akenatón y su esposa <b>Nefertiti</b> tenían acceso directo al dios; el pueblo debía venerar a la familia real. Desaparecieron Osiris y el más allá tradicional. El arte cambió también, con figuras alargadas y escenas íntimas de la familia real. El texto más conocido de la época es el <b>Gran Himno al Atón</b>.</p>
<p>Tras la muerte de Akenatón, sus sucesores, entre ellos <b>Tutankamón</b> (que había nacido como Tutankatón), abandonaron Amarna y restauraron el culto de Amón. Los reyes posteriores condenaron a Akenatón como «el criminal de Ajetatón», desmontaron sus templos y lo borraron de las listas reales. Para los egipcios, había sido una ruptura de la Maat.</p>`);

essay(17, 'Fonología y escritura', `
<p>¿Cómo sonaba el egipcio? Es una pregunta difícil, porque la escritura no anota vocales. Los lingüistas la reconstruyen a partir de varias fuentes:</p>
<ul>
<li><b>El copto</b>, que escribe las vocales, permite reconstruir la forma tardía de las palabras.</li>
<li><b>Las transcripciones en otras lenguas</b>: nombres egipcios en textos cuneiformes acadios (como las cartas de Amarna), en hebreo y en griego.</li>
<li><b>Los préstamos</b> de otras lenguas al egipcio y del egipcio a otras lenguas.</li>
<li><b>La escritura silábica</b> del Reino Nuevo, que intentaba anotar vocales en palabras extranjeras.</li>
<li><b>Los cambios gráficos</b>: cuando los escribas confunden dos signos, suele indicar que sus sonidos se habían igualado.</li>
</ul>
<p>Con estos datos se sabe, por ejemplo, que el egipcio tenía un <b>acento</b> fuerte que reducía o eliminaba las vocales átonas; que las palabras tenían sílabas abiertas o cerradas según patrones fijos; y que con el tiempo se perdieron muchas consonantes finales (la ${t('-t')} del femenino, la ${t('r')} y la ${t('ꜣ')} en muchas posiciones). La consonante ${t('ꜣ')}, que transliteramos como un «álef», era originalmente una especie de r o l; ${t('ꜥ')} era una faríngea como la ʿayn árabe.</p>
<p>La reconstrucción de las vocales permite distinguir formas verbales que en la escritura son idénticas (por ejemplo, diferentes formas de ${t('sḏm.f')}), pero sigue siendo hipotética. Por eso los egiptólogos prefieren trabajar con la transliteración y una pronunciación convencional, sabiendo que no reproduce el sonido real de la lengua.</p>`);
/* ===================== ENSAYOS 18–25 ===================== */
essay(18, 'La literatura egipcia', `
<p>El Reino Medio fue la edad de oro de la literatura egipcia. Es entonces cuando aparecen por primera vez obras escritas para ser leídas o recitadas por su valor propio, no solo con fines religiosos o prácticos. Se conservan sobre todo en papiros y en <b>óstraca</b> (fragmentos de cerámica o caliza) copiados por escribas, muchos de ellos del Reino Nuevo, cuando estas obras se usaban como textos escolares.</p>
<p>Los géneros principales eran:</p>
<ul>
<li><b>Enseñanzas</b> (${t('sbꜣyt')}): consejos de un padre a su hijo (ensayo del tema 19).</li>
<li><b>Relatos</b>: <i>Sinuhé</i>, <i>El náufrago</i>, <i>El campesino elocuente</i>, los cuentos del papiro Westcar (ensayo del tema 20).</li>
<li><b>Lamentaciones y diálogos</b>: textos pesimistas sobre el desorden del mundo, como las <i>Admoniciones de Ipuur</i>, las <i>Lamentaciones de Jajeperraseneb</i> o el <i>Diálogo de un hombre con su ba</i>, una reflexión sobre la muerte y el suicidio.</li>
<li><b>Profecías</b>: la <i>Profecía de Neferti</i>, que «predice» la llegada de Amenemhat I.</li>
<li><b>Himnos y poesía</b> (ensayo del tema 23).</li>
</ul>
<p>La literatura egipcia es <b>poética</b>: está organizada en versos (frases de dos o tres acentos) agrupados en pareados paralelos, con juegos de palabras, repeticiones y contrastes. Los manuscritos marcaban a veces las pausas con «puntos de verso» en rojo. Muchas obras se atribuían a sabios famosos del pasado (Ptahhotep, Imhotep, Hordedef), aunque fueran escritas mucho después.</p>
<p>Los egipcios veneraban a sus grandes autores. Un texto del Reino Nuevo dice que los escritores sabios no se hicieron pirámides de bronce, pero sus libros los mantienen vivos mejor que cualquier tumba.</p>`);

essay(19, 'La literatura sapiencial', `
<p>Las <b>enseñanzas</b> (${t('sbꜣyt')}) son el género más antiguo y prestigioso de la literatura egipcia. Presentan los consejos de un padre, normalmente un alto funcionario o un rey, a su hijo y sucesor. Transmiten el ideal de vida de la élite: cómo comportarse con los superiores y con los inferiores, cómo hablar, cómo administrar justicia, cómo tratar a la esposa y a los amigos.</p>
<p>Las principales enseñanzas del egipcio medio son:</p>
<ul>
<li><b>La Enseñanza de Ptahhotep</b>, atribuida a un visir de la V dinastía: 37 máximas sobre la conducta correcta, la modestia, el valor de escuchar y el dominio de la palabra.</li>
<li><b>La Enseñanza de Kagemni</b>, de la que solo se conserva el final.</li>
<li><b>La Enseñanza para Merikara</b>, consejos de un rey de Heracleópolis a su hijo sobre el gobierno.</li>
<li><b>La Enseñanza de Amenemhat I</b>, en la que el rey asesinado advierte a su hijo Senusret I que no confíe en nadie.</li>
<li><b>La Enseñanza lealista</b>, que exhorta a venerar al rey.</li>
<li><b>La Sátira de los oficios</b> (Enseñanza de Jety), que alaba la profesión de escriba ridiculizando las demás.</li>
</ul>
<p>Sus valores giran en torno a la <b>Maat</b>: el hombre ideal es el «silencioso» (${t('gr')}), dueño de sí mismo, que habla poco y bien, frente al «acalorado» (${t('šmm')}), impulsivo y violento. Las enseñanzas aprecian la elocuencia, la discreción, la generosidad y la lealtad. Más tarde, en el Reino Nuevo, aparecen enseñanzas para un público más amplio (Ani, Amenemope).</p>`);

essay(20, 'Los relatos del egipcio medio', `
<p>El Reino Medio produjo algunos de los relatos más antiguos de la literatura universal:</p>
<ul>
<li><b>La historia de Sinuhé.</b> Un cortesano huye de Egipto al enterarse de la muerte de Amenemhat I, vive muchos años entre los asiáticos, se convierte en jefe tribal y, ya anciano, es perdonado por Senusret I y vuelve a Egipto para ser enterrado en su tierra. Los egipcios la consideraron su obra maestra; se copió durante siglos.</li>
<li><b>El náufrago.</b> Un marinero cuenta a su superior cómo naufragó y llegó a una isla habitada por una serpiente divina gigante que lo acogió y lo envió de vuelta a casa. Es un relato dentro de otro relato, con un mensaje sobre el valor de la palabra y la resistencia ante la desgracia.</li>
<li><b>El campesino elocuente.</b> Un campesino del oasis de la Sal es robado por un funcionario y presenta nueve peticiones al gran mayordomo Rensi. El rey, impresionado por su elocuencia, hace que se le retrase la justicia para seguir escuchándole. Las peticiones son una reflexión sobre la justicia y la Maat.</li>
<li><b>Los cuentos del papiro Westcar.</b> El rey Keops escucha historias de magos prodigiosos; el ciclo termina con el anuncio del nacimiento de los tres primeros reyes de la V dinastía.</li>
</ul>
<p>Estos relatos mezclan prosa narrativa y pasajes poéticos (discursos, himnos, lamentos). Comienzan con fórmulas fijas como ${t('zj pw wn')} «había un hombre» y usan con frecuencia ${t('ꜥḥꜥ.n')} y ${t('sḏm.jn.f')} para hacer avanzar la acción. Son, por eso, la mejor lectura para practicar la gramática del egipcio medio.</p>`);

essay(21, 'Los textos históricos', `
<p>Los egipcios no escribieron historia en nuestro sentido, pero dejaron muchos textos sobre acontecimientos de su época:</p>
<ul>
<li><b>Anales y listas reales</b>: la Piedra de Palermo, el Canon de Turín y las listas de Abido y Karnak (ensayo del tema 9).</li>
<li><b>Inscripciones reales</b>: estelas que narran campañas militares, construcciones o expediciones, como la estela fronteriza de Semna de Senusret III o, en el Reino Nuevo, los Anales de Tutmosis III y la batalla de Qadesh de Ramsés II.</li>
<li><b>Autobiografías</b> de funcionarios en sus tumbas y estelas: relatan su carrera, sus servicios al rey y sus virtudes. Un ejemplo célebre es la de Uni (Reino Antiguo) o la de Ijernofret (Reino Medio), que organizó las fiestas de Osiris en Abido.</li>
<li><b>Inscripciones de expediciones</b> a canteras y minas (Uadi Hammamat, Sinaí) con los nombres de los participantes y las cantidades obtenidas.</li>
</ul>
<p>Estos textos hay que leerlos con espíritu crítico: tienen una finalidad ideológica. El rey aparece siempre victorioso, como garante de la Maat frente al caos de los enemigos; los funcionarios se presentan como servidores perfectos. Aun así, ofrecen datos valiosísimos y, comparados con la arqueología y con fuentes de otros pueblos, permiten reconstruir la historia de Egipto.</p>`);

essay(22, 'Los textos religiosos', `
<p>La mayor parte de los textos egipcios conservados son religiosos. Los principales grupos son:</p>
<ul>
<li><b>Textos funerarios</b>, para asegurar la vida eterna: los <i>Textos de las Pirámides</i> (inscritos en las cámaras de las pirámides desde Unas, finales de la V dinastía), los <i>Textos de los Ataúdes</i> (pintados en los sarcófagos del Reino Medio, más de mil fórmulas) y el <i>Libro de los Muertos</i> (en papiros desde el Reino Nuevo). También los «libros del más allá» de las tumbas reales del Reino Nuevo (<i>Amduat</i>, <i>Libro de las Puertas</i>), que describen el viaje nocturno del sol.</li>
<li><b>Textos rituales</b> de los templos: los ritos del culto diario, de las fiestas y de la apertura de la boca.</li>
<li><b>Himnos y oraciones</b> a los dioses (ensayo del tema 23).</li>
<li><b>Textos mágicos</b>: conjuros contra serpientes, escorpiones y enfermedades, a menudo en papiros médicos o en estelas de Horus sobre los cocodrilos.</li>
<li><b>Textos mitológicos y teológicos</b>, como la Teología menfita o el relato de la destrucción de la humanidad.</li>
</ul>
<p>Los textos religiosos usan una lengua conservadora, con rasgos antiguos (el egipcio de los Textos de las Pirámides es más arcaico que el egipcio medio) y un estilo lleno de epítetos, juegos de palabras e identificaciones del difunto con los dioses («yo soy Atum…»). Muchos llevan instrucciones de uso en rojo (las «rúbricas»).</p>`);

essay(23, 'Himnos y poesía', `
<p>Los egipcios compusieron numerosos <b>himnos</b> a sus dioses y a sus reyes. Siguen esquemas fijos: un saludo (${t('jnḏ ḥr.k')} «¡salve a ti!»), una serie de epítetos y descripciones del dios (con muchos participios: «el que crea…», «el que da…») y peticiones finales.</p>
<p>Ejemplos importantes:</p>
<ul>
<li>Los <b>himnos al sol</b> al amanecer y al atardecer, inscritos en tumbas y estelas.</li>
<li>El <b>Himno a Hapi</b>, la inundación, que celebra los beneficios de la crecida.</li>
<li>Los <b>himnos a Senusret III</b> del papiro de Illahun, que alaban al rey como protector de Egipto.</li>
<li>El <b>gran himno a Osiris</b> de la estela de Amenmose (Reino Nuevo) y los himnos a Amón-Ra.</li>
<li>El <b>Gran Himno al Atón</b> de Akenatón.</li>
</ul>
<p>Junto a la poesía religiosa existió una <b>poesía amorosa</b> (sobre todo del Reino Nuevo), con canciones en las que los enamorados se llaman «hermano» y «hermana», y <b>cantos de arpista</b> que invitan a disfrutar de la vida ante la incertidumbre del más allá.</p>
<p>La poesía egipcia no tenía rima ni metro silábico fijo; su ritmo se basaba en el <b>paralelismo</b>: dos o tres frases seguidas que repiten la misma idea con otras palabras, o la contraponen. Al traducir, conviene respetar esas parejas de versos.</p>`);

essay(24, 'Los textos no literarios', `
<p>Además de la literatura y los textos religiosos, se conserva una gran cantidad de documentos de la vida diaria, muchos en hierático:</p>
<ul>
<li><b>Documentos administrativos</b>: cuentas, inventarios, listas de trabajadores, registros de raciones y de impuestos. Los papiros de Illahun (dinastía XII) y los de Abusir (V dinastía) son ejemplos importantes.</li>
<li><b>Textos jurídicos</b>: testamentos, contratos, actas de juicios y decretos.</li>
<li><b>Cartas</b> (ensayo del tema 25), incluidas las «cartas a los muertos».</li>
<li><b>Textos científicos</b>: papiros médicos (Ebers, Edwin Smith, que describe casos de heridas con diagnóstico y tratamiento), matemáticos (papiro Rhind y de Moscú, con problemas de fracciones, áreas y volúmenes) y astronómicos.</li>
<li><b>Textos escolares</b>: ejercicios de copia, listas de palabras («onomásticos») y modelos de cartas.</li>
<li><b>Grafitos</b> de visitantes en templos y tumbas, y marcas de canteros.</li>
</ul>
<p>Estos textos son esenciales para conocer la economía, el derecho y la vida cotidiana. Su lengua suele estar más cerca de la hablada y su estilo es conciso y técnico: verás muchos infinitivos en listas, construcciones con ${t('jr')} «si» y ${t('sḏm.ḫr.f')} en los textos médicos y matemáticos, y abreviaturas.</p>`);

essay(25, 'Las cartas', `
<p>Las cartas egipcias siguen un <b>formulario</b> muy fijo, que hay que conocer para leerlas:</p>
<ul>
<li><b>Encabezamiento</b>: quién escribe a quién, a menudo con fórmulas humildes: ${t('bꜣk-jm ḏd')} «el servidor de allí (= yo) dice».</li>
<li><b>Saludos</b> y buenos deseos: ${t('m ꜥnḫ wḏꜣ snb')} «¡en vida, prosperidad y salud!», «que los dioses te concedan el favor del rey».</li>
<li><b>Asunto</b>, introducido por ${t('r ntt')} «para comunicar que» o ${t('ky ḏd')} «otro asunto».</li>
<li><b>Fórmulas de cierre</b>: ${t('nfr sḏm.k')} «está bien que lo sepas», «es una comunicación».</li>
</ul>
<p>Entre las cartas del Reino Medio destacan las de <b>Heqanajt</b>, un agricultor de Tebas que escribe a su familia con instrucciones sobre los campos, las raciones y las disputas domésticas (en ellas se queja, por ejemplo, de cómo tratan a su nueva esposa). Son un testimonio único de la vida familiar.</p>
<p>Un tipo especial son las <b>cartas a los muertos</b>: escritas a menudo sobre cuencos de ofrendas dejados en la tumba, piden ayuda a un pariente difunto contra males o enemigos, o le reprochan los problemas que causa desde el más allá. Muestran que los muertos se consideraban todavía miembros activos de la familia.</p>
<p>El lenguaje de las cartas está más cerca de la lengua hablada que el de los monumentos, y muestra a veces rasgos que anuncian el neoegipcio.</p>`);

/* ---------- Estado y persistencia ---------- */
const LSKEY = 'medunetjer.progress.v1';
const defaultState = () => ({ v:1, updatedAt:0, lessons:{}, srs:{}, xp:0, streak:{count:0,last:''}, activity:{}, texts:{},
  settings:{ theme:'light', hg:1, unlockAll:false, newPerDay:15 } });
let S = defaultState();
const Sync = { mode:'local', db:null, ref:null, writing:false, pending:false, timer:null };

function mergeDefaults(o){ const d = defaultState(); const s = Object.assign(d, o||{}); s.settings = Object.assign(defaultState().settings, (o||{}).settings||{}); s.streak = Object.assign({count:0,last:''}, (o||{}).streak||{}); return s; }
function loadLocal(){ try { const raw = localStorage.getItem(LSKEY); if (raw) return JSON.parse(raw); } catch(e){} return null; }
function saveLocal(){ try { localStorage.setItem(LSKEY, JSON.stringify(S)); } catch(e){} }

function save(){
  S.updatedAt = Date.now();
  saveLocal();
  clearTimeout(Sync.timer);
  Sync.timer = setTimeout(pushRemote, 1200);
}
async function pushRemote(){
  if (!Sync.ref) return;
  if (Sync.writing){ Sync.pending = true; return; }
  Sync.writing = true; setSync('busy');
  try { await Sync.ref.set(JSON.parse(JSON.stringify(S))); setSync('ok'); }
  catch(e){
    if (e && e.code === 'unavailable'){ setTimeout(pushRemote, 1500 + Math.random()*1500); }
    else if (e && (e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')) { Sync.ref = null; setSync('local'); }
    else setSync('local');
  }
  Sync.writing = false;
  if (Sync.pending){ Sync.pending = false; pushRemote(); }
}
function setSync(m){ Sync.mode = m; const el = $('#syncState'); if (el) el.innerHTML = syncLabel(); }
function syncLabel(){
  return { ok:'<span class="dot ok"></span> Guardado en tu cuenta', busy:'<span class="dot busy"></span> Guardando…', local:'<span class="dot local"></span> Guardado en este dispositivo' }[Sync.mode] || '';
}
async function initRemote(){
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const db = await window.claude.use('db'); if (!db) return;
    const user = await window.claude.use('user'); if (!user) return;
    const id = await user.id(); if (!id) return;
    const ref = db.doc('data/users/' + id + '/progress');
    const timeout = new Promise((_, rej) => setTimeout(() => rej({code:'timeout'}), 10000));
    const snap = await Promise.race([ref.get(), timeout]);
    Sync.ref = ref; Sync.db = db;
    if (snap.exists){
      const remote = snap.data();
      if ((remote.updatedAt||0) > (S.updatedAt||0)){ S = mergeDefaults(JSON.parse(JSON.stringify(remote))); saveLocal(); applySettings(); render(); toast('Progreso recuperado de tu cuenta'); }
      else if ((S.updatedAt||0) > (remote.updatedAt||0)) pushRemote();
      setSync('ok');
    } else {
      if (S.updatedAt) pushRemote(); else setSync('ok');
    }
  } catch(e){ setSync('local'); }
}

/* ---------- Progreso ---------- */
const L = n => LESSONS.find(l => l.n === n);
const LS = n => (S.lessons[n] = S.lessons[n] || { read:[], best:0, done:false, attempts:0, culture:false });
function isUnlocked(n){ return S.settings.unlockAll || n === 1 || !!(S.lessons[n-1] && S.lessons[n-1].done); }
function lessonPct(n){
  const l = L(n), st = S.lessons[n]; if (!st) return 0;
  const secs = l.sections.length; const r = (st.read||[]).length;
  return Math.round(((Math.min(r,secs)/secs)*0.5 + (st.done?0.5:(st.best||0)/100*0.5))*100);
}
function currentLesson(){ for (const l of LESSONS){ if (!(S.lessons[l.n] && S.lessons[l.n].done)) return l.n; } return LESSONS.length ? LESSONS[LESSONS.length-1].n : 1; }
function addXP(x){
  S.xp += x; const t = today(); S.activity[t] = (S.activity[t]||0) + x;
  if (S.streak.last !== t){
    const y = new Date(Date.now()-DAY); const ys = y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
    S.streak.count = (S.streak.last === ys) ? S.streak.count + 1 : 1; S.streak.last = t;
  }
  save();
}

/* ---------- Transliteración ---------- */
document.addEventListener('focusin', ev => { const el = ev.target; if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) { el.setAttribute('autocapitalize', 'none'); el.setAttribute('autocorrect', 'off'); } });
const TR_KEYS = ['ꜣ','j','y','ꜥ','w','b','p','f','m','n','r','h','ḥ','ḫ','ẖ','z','s','š','q','k','g','t','ṯ','d','ḏ','.','-','='];
const CANON = {'ꜣ':'A','Ꜣ':'A','3':'A','ȝ':'A','ʒ':'A','ꜥ':'a','Ꜥ':'a','ʿ':'a','ʽ':'a','‘':'a','j':'i','i':'i','ỉ':'i','ı':'i','í':'i','y':'y','ï':'y',
  'ḥ':'H','Ḥ':'H','ḫ':'x','Ḫ':'x','ẖ':'X','h̭':'X','š':'S','Š':'S','ṯ':'T','Ṯ':'T','ḏ':'D','Ḏ':'D','ḳ':'q','ḳ':'q','z':'s','c':'S','č':'T'};
function canonTr(s, ascii){
  s = String(s||'').normalize('NFC');
  let out = '';
  for (const ch of s){
    if (CANON[ch] !== undefined){ out += CANON[ch]; continue; }
    if (/[A-Za-z]/.test(ch)){
      if (ascii){ // convención MdC: A=ꜣ a=ꜥ H=ḥ x=ḫ X=ẖ S=š T=ṯ D=ḏ
        if ('AaHxXSTD'.includes(ch)) { out += ch; continue; }
        if (ch==='i'||ch==='I'||ch==='j'||ch==='J') { out += 'i'; continue; }
        if (ch==='z'||ch==='Z') { out += 's'; continue; }
        out += ch.toLowerCase(); continue;
      }
      if (ch==='J'||ch==='I') { out+='i'; continue; }
      out += ch.toLowerCase(); continue;
    }
    // ignorar separadores y signos
  }
  return out;
}
function trMatch(given, answers){
  const g = canonTr(given, true), g2 = canonTr(given, false);
  if (!g) return false;
  const fold = s => s.replace(/[Aa]/g,'a').replace(/[HxXh]/g,'h').replace(/S/g,'s').replace(/T/g,'t').replace(/D/g,'d').replace(/q/g,'k').replace(/y/g,'i').replace(/u/g,'w').replace(/[eo]/g,'');
  const dig = String(given||'').toLowerCase().replace(/sh/g,'š').replace(/kh/g,'ḫ').replace(/dj/g,'ḏ').replace(/tch|ch/g,'ṯ');
  const cand = [g, g2, canonTr(dig, false)];
  return [].concat(answers).some(a => { const e = canonTr(a, false); return cand.some(c => c === e) || cand.some(c => c && fold(c) === fold(e)); });
}
/* ---------- Español ---------- */
const normEs = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9ñ ]+/g,' ').replace(/\s+/g,' ').trim();
function keyCheck(given, groups){
  const g = ' ' + normEs(given) + ' ';
  const miss = [];
  (groups||[]).forEach(grp => { if (!grp.some(k => g.includes(normEs(k)))) miss.push(grp[0]); });
  return miss;
}

/* ---------- SRS ---------- */
const BOX_DAYS = [0, 1, 2, 4, 8, 16, 32, 64, 120];
function allCards(){
  const cards = [];
  const maxL = S.settings.unlockAll ? 99 : Math.max(1, ...LESSONS.filter(l => S.lessons[l.n] && (S.lessons[l.n].read||[]).length).map(l=>l.n));
  SIGNS.forEach(sg => { if ((sg.l||2) <= maxL && (['uni','bi','tri'].includes(sg.k) || sg.srs)) cards.push({ id:'s:'+sg.c, kind:'sign', sg, n:(sg.l||2) }); });
  LESSONS.forEach(l => { if (l.n <= maxL && S.lessons[l.n] && (S.lessons[l.n].read||[]).length){
    (l.vocab||[]).forEach((v,i) => cards.push({ id:'v:'+l.n+':'+i, kind:'vocab', v, n:l.n }));
    (l.ex||[]).forEach((e,i) => {
      if (e.t === 'tr' && e.h && e.a) cards.push({ id:'e:'+l.n+':'+i, kind:'frase', e, n:l.n });
      else if (e.t === 'mc' && e.q && e.o) cards.push({ id:'e:'+l.n+':'+i, kind:'preg', e, n:l.n });
    });
  } });
  return cards;
}
function dueCards(){
  const now = Date.now(); const all = allCards();
  const due = all.filter(c => S.srs[c.id] && S.srs[c.id].due <= now);
  const t = today();
  const introducedToday = Object.values(S.srs).filter(x => x.intro === t).length;
  const room = Math.max(0, (S.settings.newPerDay||15) - introducedToday);
  const un = all.filter(c => !S.srs[c.id]);
  const curL = Math.max(1, ...LESSONS.filter(l => S.lessons[l.n] && (S.lessons[l.n].read||[]).length).map(l => l.n));
  const ord = (a, b) => ((b.n === curL) - (a.n === curL)) || (b.n - a.n);
  const qs = [un.filter(c => c.kind === 'vocab').sort(ord), un.filter(c => c.kind === 'frase' || c.kind === 'preg').sort(ord), un.filter(c => c.kind === 'sign').sort((a, b) => a.n - b.n)];
  const fresh = []; let qi = 0;
  while (fresh.length < room && qs.some(q => q.length)){ const q = qs[qi % 3]; if (q.length) fresh.push(q.shift()); qi++; }
  return { due, fresh, total: all.length };
}
function grade(id, g){ // 0 otra vez, 1 difícil, 2 bien, 3 fácil
  const c = S.srs[id] || { box:0, due:0, reps:0, lapses:0, intro: today() };
  if (g === 0){ c.box = 0; c.lapses++; c.due = Date.now() + 60*1000; }
  else {
    if (g === 1) c.box = Math.max(1, c.box);
    if (g === 2) c.box = Math.min(BOX_DAYS.length-1, c.box + 1);
    if (g === 3) c.box = Math.min(BOX_DAYS.length-1, c.box + 2);
    const days = BOX_DAYS[c.box] * (g === 1 ? 0.6 : 1);
    c.due = Date.now() + Math.max(days, 0.5) * DAY - 3600*1000;
  }
  c.reps++; S.srs[id] = c; save();
}

function toast(msg){ const t = document.createElement('div'); t.className='toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2400); }
function modal(html, onMount){
  const bg = document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML = '<div class="card modal fadein">'+html+'</div>';
  bg.addEventListener('click', e => { if (e.target === bg) bg.remove(); });
  document.body.appendChild(bg); if (onMount) onMount(bg, () => bg.remove()); return bg;
}

}

function tabTheory(body, l, st){
  let i = Math.min(st.lastSec || 0, l.sections.length-1);
  const draw = () => {

function expandExercises(l){
  const out = [];
  l.ex.forEach(e => {
    if (e.t === 'signs'){
      const pool = SIGNS.filter(s => (e.kinds||['uni']).includes(s.k) && (s.l||2) <= l.n && s.s);
      shuffle(pool).slice(0, e.count||8).forEach(sg => {
        const wrong = shuffle(pool.filter(x => x.s !== sg.s)).slice(0,3).map(x => x.s);
        const opts = shuffle([sg.s, ...wrong]);
        out.push({ t:'mc', q:'¿Qué valor fonético tiene este signo?', h:sg.ch, o:opts.map(o=>'<span class="tr">'+esc(o)+'</span>'), a:opts.indexOf(sg.s), e:`${sg.ch} (${sg.c}): ${sg.m}.`, auto:true });
      });
    } else out.push(e);
  });
  return out;
}

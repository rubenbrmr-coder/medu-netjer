<p>Un mismo signo puede ser fonograma en unas palabras e ideograma en otras. Por ejemplo, ${h('𓂋')} es el unilítero ${tp('r')}, pero con un trazo ${h('𓂋𓏤')} es la palabra ${tp('r')} «boca». El trazo vertical ${h('𓏤')} indica precisamente eso: «este signo se lee como la palabra que dibuja».</p>
${tb(['Escritura','Como fonograma','Como ideograma'],[
[h('𓉐'),tp('pr')+' en '+tp('prj')+' «salir»',h('𓉐𓏤')+' '+tp('pr')+' «casa»'],
[h('𓁹'),tp('jr')+' en '+tp('jrj')+' «hacer»',h('𓁹𓏤')+' '+tp('jrt')+' «ojo»'],
[h('𓁷'),tp('ḥr')+' preposición «sobre»',h('𓁷𓏤')+' '+tp('ḥr')+' «cara»'],
[h('𓇳'),tp('rꜥ')+' en nombres',h('𓇳𓏤')+' '+tp('rꜥ')+' «sol», «día»'],
])}
<p>El trazo no siempre aparece, y a veces aparece en palabras en que el signo es fonético. Es una ayuda, no una regla absoluta.</p>`);

add(3, 'Resumen de los tipos de signos', `
${tb(['Tipo','Función','Ejemplo'],[
['Unilítero','Vale una consonante',h('𓅓')+' '+tp('m')],
['Bilítero','Vale dos consonantes',h('𓉐')+' '+tp('pr')],
['Trilítero','Vale tres consonantes',h('𓄤')+' '+tp('nfr')],
['Complemento fonético','Repite un sonido del signo anterior; no se translitera aparte',t('ḫpr')+' = '+h('𓆣𓂋')],
['Ideograma','Representa la palabra que dibuja (a menudo con trazo)',h('𓉐𓏤')+' «casa»'],
['Determinativo','Clasifica el significado; no se lee',h('𓂻')+' movimiento'],
])}
<p>Muchos signos tienen <b>varias funciones</b>. El ojo ${h('𓁹')} es bilítero ${tp('jr')}, ideograma de «ojo» y, en otra forma (${h('𓁻')}), determinativo de «ver». La lista de signos de este curso indica los usos principales de cada uno.</p>`);

add(3, 'Grafías no habituales: abreviaturas, grafías defectivas y juegos', `
<p>No todas las palabras se escriben de forma «completa». Hay varias desviaciones de la norma:</p>
<ul>
<li><b>Abreviaturas fijas.</b> Palabras muy frecuentes se reducen a uno o dos signos: ${h('𓋹𓍑𓋴')} ${tp('ꜥnḫ wḏꜣ snb')} «¡vida, prosperidad, salud!» se escribe solo con los signos iniciales de cada palabra; ${h('𓉓')} es la abreviatura de ${t('prt-ḫrw')} «ofrenda de invocación».</li>
<li><b>Grafías defectivas.</b> Se omiten consonantes débiles (${t('j')}, ${t('w')}) o terminaciones. ${t('mrj')} «amar» suele escribirse solo con ${h('𓌸')}.</li>
<li><b>Grafías «históricas».</b> Se conserva la escritura antigua aunque la pronunciación haya cambiado (como en español «hacer» con h muda).</li>
<li><b>Ortografía de grupo o silábica.</b> Para palabras y nombres extranjeros (sobre todo desde el Reino Nuevo) se usan combinaciones de signos que intentan representar sílabas: es la llamada «escritura silábica».</li>
<li><b>Escritura criptográfica o lúdica.</b> En algunos textos religiosos y en época tardía, los escribas jugaban con valores raros de los signos. No la necesitarás para el egipcio medio clásico.</li>
</ul>`);

add(3, 'Cómo se translitera una palabra', `
<p>Al transliterar se anotan <b>solo los sonidos que pertenecen a la palabra</b>, en el orden en que se pronuncian:</p>
<ol>
<li>Identifica el <b>determinativo</b> (o los determinativos) del final y apártalo: no se translitera.</li>
<li>Busca los <b>multilíteros</b> y anota su valor.</li>
<li>Comprueba qué unilíteros son <b>complementos</b> (repiten un sonido) y cuáles añaden sonidos nuevos.</li>
<li>Añade las terminaciones (como ${t('-t')} o ${t('-w')}) y los sufijos separados por punto.</li>
<li>Si falta una consonante que sabes que existe (escritura defectiva), puedes ponerla entre paréntesis: ${t('mr(j)')}.</li>
</ol>
${x('𓂋𓈖𓆑','rn.f','su nombre','rn + sufijo .f')}
${x('𓈖𓊹𓀭','n nṯr','para el dios','𓀭 es determinativo')}
${x('𓊵𓏏𓊪','ḥtp','ofrenda; estar en paz','𓏏 y 𓊪 complementan')}`);

/* ===================== TEMA 4 ===================== */
add(4, 'Partes del sustantivo y raíces', `
<p>Un sustantivo egipcio consta de una <b>base</b> (o tema) y, a veces, de una <b>terminación</b> que marca género y número: ${t('sn')} «hermano», ${t('sn-t')} «hermana», ${t('sn-w')} «hermanos». En la transliteración normal no se separa la terminación: ${t('snt')}, ${t('snw')}.</p>
<p>La base procede de una <b>raíz</b> consonántica, que lleva el significado básico, como en las lenguas semíticas. Una raíz como ${t('mꜣꜣ')} «ver» o ${t('ꜥnḫ')} «vivir» puede dar lugar a verbos, sustantivos y adjetivos que se distinguían por las vocales (que no vemos) y por prefijos o sufijos (que sí vemos):</p>
${tb(['Raíz','Derivado','Significado'],[
[t('ꜥnḫ'),t('ꜥnḫ'),'vida; vivir'],
[t('ꜥnḫ'),t('sꜥnḫ'),'hacer vivir (causativo con s-)'],
[t('ꜥḥꜥ')+' «estar de pie»',t('mꜥḥꜥt'),'cenotafio, capilla («lugar donde uno se yergue»): con prefijo m-'],
[t('mr'),t('mrwt'),'amor'],
[t('nfr'),t('nfrw'),'belleza, perfección'],
])}
<p>El prefijo <b>${t('m-')}</b> forma con frecuencia nombres de instrumento o de lugar (${t('mḫnt')} «barca de pasaje», de ${t('ḫnj')} «remar»); las terminaciones ${t('-w')} y ${t('-wt')} forman sustantivos abstractos.</p>`);

add(4, 'Género: casos especiales', `
<p>Todo sustantivo es <b>masculino o femenino</b>; no hay neutro. El femenino se marca casi siempre con ${t('-t')} ${h('𓏏')}. Pero hay matices:</p>
<ul>
<li>Algunos sustantivos femeninos <b>no llevan -t visible</b> porque la terminación se perdió o se omite en la escritura.</li>
<li>Algunos masculinos <b>terminan en -t</b> que forma parte de la raíz (${t('ḫt')} «madera, árbol» en su sentido masculino; ${t('mt')} «vena»).</li>
<li>Los abstractos y los colectivos suelen ser femeninos: ${t('mꜣꜥt')} «Maat, verdad», ${t('jsft')} «desorden», ${t('ḏwt')} «el mal».</li>
<li>El <b>femenino se usa como neutro</b>: para hablar de «algo», «la cosa», «eso» se usa la forma femenina (${t('nfrt')} «lo bueno», ${t('ḏwt')} «lo malo»). Lo verás con adjetivos y pronombres.</li>
<li>Los nombres de países y de ciudades suelen ser femeninos (${t('kmt')} «Egipto», ${t('wꜣst')} «Tebas»).</li>
</ul>`);

add(4, 'Número: plural, colectivos y su escritura', `
<p>El egipcio tiene <b>singular, plural y dual</b>. El plural masculino termina en ${t('-w')} y el femenino en ${t('-wt')} (aunque esta ${t('w')} rara vez se escribe en el femenino: ${t('snwt')} suele aparecer como ${t('snt')} + plural).</p>
<p><b>Cómo se escribe el plural.</b> La terminación casi nunca se escribe por completo. Hay tres formas de indicarlo:</p>
<ol>
<li>Con los <b>trazos de plural</b> ${h('𓏥')} o ${h('𓏪')} detrás de la palabra: ${h('𓊹𓀭𓏥')} ${tp('nṯrw')} «dioses».</li>
<li><b>Repitiendo tres veces</b> el ideograma o el determinativo: ${h('𓊹𓊹𓊹')} ${tp('nṯrw')}. Es la forma más antigua y solemne.</li>
<li>Con la ${h('𓅱')} de la terminación más los trazos: ${h('𓌢𓈖𓅱𓀀𓏥')} ${tp('snw')}.</li>
</ol>
<p><b>Colectivos.</b> Algunas palabras son gramaticalmente singulares pero designan un grupo: ${t('rmṯ')} «gente», ${t('mšꜥ')} «ejército», ${t('smdt')} «personal». Llevan a menudo el trazo de plural aunque concuerden en singular.</p>
<p>A veces el plural se escribe con los trazos aunque el sentido sea singular (por ejemplo, en sustantivos abstractos): los trazos indican más bien «idea de pluralidad o de cosa abstracta».</p>`);

add(4, 'El dual', `
<p>El <b>dual</b> se usa para pares, sobre todo de cosas que van de dos en dos por naturaleza: partes del cuerpo, las Dos Tierras, las dos diosas…</p>
${tb(['Género','Terminación','Ejemplo'],[
['Masculino',t('-wj'),t('snwj')+' «los dos hermanos»; '+t('rdwj')+' «las dos piernas»'],
['Femenino',t('-tj'),t('sntj')+' «las dos hermanas»; '+t('jrtj')+' «los dos ojos»'],
])}
<p>Se escribe <b>duplicando</b> el ideograma o el determinativo (${h('𓁹𓁹')} ${tp('jrtj')}), o añadiendo los dos trazos ${h('𓏭')} o ${h('𓏤𓏤')}. ${tp('tꜣwj')} «las Dos Tierras» (Alto y Bajo Egipto) se escribe ${h('𓇾𓇾')}.</p>
<p>En egipcio medio el dual ya no era productivo: se usa con palabras que lo tenían tradicionalmente, y para el número «dos» de otras cosas se prefiere el plural con el numeral 2.</p>`);

add(4, 'Sustantivos determinados e indeterminados', `
<p>El egipcio medio <b>no tiene artículos</b>. ${t('zj')} puede significar «un hombre» o «el hombre», según el contexto, y ${t('nṯr')} «un dios», «el dios» o simplemente «dios». Al traducir al español tendrás que decidir tú el artículo.</p>
<p>Algunas pistas: los nombres de personas, los títulos únicos (${t('nswt')} «el rey») y lo ya mencionado suelen ser determinados; lo que se introduce por primera vez («había un hombre…») suele ser indeterminado.</p>
<p>El demostrativo ${t('pꜣ')} (con sus formas ${t('tꜣ')}, ${t('nꜣ')}) empieza en egipcio medio a usarse en la lengua hablada como un artículo determinado; en neoegipcio se convierte en el artículo normal y en copto en <i>p-</i>, <i>t-</i>, <i>n-</i>. En los textos clásicos aún es raro.</p>`);

add(4, 'Sintagmas nominales: aposición, coordinación y posesión', `
<p>Un <b>sintagma nominal</b> es un grupo de palabras que funciona como un sustantivo. El egipcio los forma de varias maneras:</p>
<p><b>Aposición:</b> dos sustantivos seguidos que se refieren a la misma cosa. Es muy frecuente con títulos y nombres: ${t('zꜣ.f ḥm-nṯr jnj')} «su hijo, el sacerdote Ini». Los nombres con filiación también son aposiciones: «Fulano, hijo de Mengana».</p>
<p><b>Coordinación («y», «o»):</b> el egipcio suele <b>yuxtaponer</b> sin conjunción: ${t('t ḥnqt')} «pan y cerveza». Para insistir en «y además, junto con» se usa ${t('ḥnꜥ')}; para «o» se usa ${t('r-pw')} detrás del segundo elemento: ${t('zj r-pw ḥmt')} «un hombre o una mujer».</p>
<p><b>Posesión (genitivo):</b></p>
<ul>
<li><b>Directo:</b> poseído + poseedor, sin nada en medio, formando una unidad estrecha: ${t('pr nswt')} «la casa del rey». No puede intercalarse ningún adjetivo entre los dos.</li>
<li><b>Indirecto:</b> con el adjetivo genitival ${t('n')}, que concuerda con el poseído: ${t('n')} (masc.), ${t('nt')} (fem.), ${t('nw')} (pl.). ${t('pr n nswt')}, ${t('ḥmt nt sš')}, ${t('ḫt nw pr')} «las cosas de la casa». El genitivo indirecto se prefiere cuando la relación es más suelta o cuando el poseído ya va acompañado de otra palabra.</li>
</ul>
<p>Cuando hay adjetivo, este se coloca detrás de todo el grupo de genitivo directo y concuerda con el sustantivo que modifica: ${t('pr nswt ꜥꜣ')} «la gran casa del rey».</p>`);

add(4, 'Resumen de los sintagmas nominales', `
${tb(['Construcción','Fórmula','Ejemplo'],[
['Aposición','sust. + sust. (la misma cosa)',t('sn.f sš')+' «su hermano, el escriba»'],
['Coordinación','sust. + sust.',t('t ḥnqt')+' «pan y cerveza»'],
['Disyunción','sust. + sust. + '+t('r-pw'),t('zj ḥmt r-pw')+' «hombre o mujer»'],
['Genitivo directo','poseído + poseedor',t('pr nswt')],
['Genitivo indirecto','poseído + '+t('n/nt/nw')+' + poseedor',t('pr n nswt')],
['Con sufijo','sust. + .sufijo',t('pr.f')+' «su casa»'],
])}`);

add(4, 'Transposición honorífica en detalle', `
<p>En el genitivo directo el poseedor va siempre <b>segundo en la lengua hablada</b>. Pero en la escritura, cuando el poseedor es ${t('nṯr')} «dios», ${t('nswt')} «rey» o el nombre de un dios, se suele <b>escribir primero por respeto</b>. Se translitera en el orden de lectura, normalmente con guion:</p>
${tb(['Se escribe','Se lee','Significado'],[
['dios + casa',t('ḥwt-nṯr'),'templo («mansión del dios»)'],
['dios + siervo',t('ḥm-nṯr'),'sacerdote («siervo del dios»)'],
['dios + palabras',t('mdw-nṯr'),'jeroglíficos («palabras del dios»)'],
['rey + hijo',t('zꜣ-nswt'),'príncipe'],
['rey + esposa',t('ḥmt-nswt'),'reina'],
['rey + escriba',t('sš-nswt'),'escriba real'],
])}
<p>La transposición es muy frecuente en <b>nombres propios</b> que incluyen el nombre de un dios: «Hijo de Ptah» se escribe con Ptah delante (${t('zꜣ-ptḥ')}), y lo mismo en nombres reales como ${t('z-n-wsrt')} «Senusret» («el hombre de la diosa Useret»). A veces no sabemos si el nombre del dios también se pronunciaba primero (${t('ptḥ-wr')} «Ptah es grande» sí empieza por el dios).</p>
<p>La propia palabra ${t('nswt')} «rey» parece contener una transposición: probablemente venía de ${t('n(j)-swt')} «el que pertenece al junco» (la planta del Alto Egipto), escrita con el junco delante para formar un grupo compacto.</p>`);
/* ===================== TEMA 5 ===================== */
add(5, 'Los tres juegos de pronombres personales, completos', `
<p>El egipcio tiene tres series de pronombres personales que se usan en lugares distintos de la frase:</p>
${tb(['Persona','Sufijo','Dependiente','Independiente'],[
['1.ª sing.',t('.j'),t('wj'),t('jnk')],
['2.ª masc. sing.',t('.k'),t('ṯw')+' / '+t('tw'),t('ntk')],
['2.ª fem. sing.',t('.ṯ'),t('ṯn')+' / '+t('tn'),t('ntṯ')],
['3.ª masc. sing.',t('.f'),t('sw'),t('ntf')],
['3.ª fem. sing.',t('.s'),t('sj')+' / '+t('st'),t('nts')],
['3.ª común «ello»',t('.s')+' / '+t('.st'),t('st'),'—'],
['1.ª pl.',t('.n'),t('n'),t('jnn')],
['2.ª pl.',t('.ṯn'),t('ṯn'),t('ntṯn')],
['3.ª pl.',t('.sn'),t('sn')+' / '+t('st'),t('ntsn')],
['Dual (raro)',t('.nj')+', '+t('.ṯnj')+', '+t('.snj'),'—','—'],
])}
<ul>
<li><b>Sufijos:</b> se pegan a sustantivos (posesivo: ${t('pr.f')} «su casa»), a preposiciones (${t('ḥnꜥ.f')} «con él») y a formas verbales (sujeto: ${t('sḏm.f')} «él oye»).</li>
<li><b>Dependientes:</b> son objeto directo de verbos (${t('mꜣ.n.f sw')} «lo vio»), sujeto de oraciones adjetivales (${t('nfr sw')} «él es bueno») y sujeto tras ciertas partículas (${t('mk sw')} «mira, él…»). Nunca van al principio de la frase.</li>
<li><b>Independientes:</b> se usan sobre todo como sujeto o predicado de oraciones nominales (${t('jnk sš')} «yo soy escriba») y para enfatizar.</li>
</ul>
<p>El sufijo de 1.ª persona ${t('.j')} a menudo <b>no se escribe</b>, o se escribe con el determinativo de quien habla: ${h('𓀀')} (hombre), ${h('𓁐')} (mujer), ${h('𓀭')} (dios o rey). Por eso, cuando un texto en primera persona parece no tener sujeto, hay que suplir el «yo».</p>
<p>Las variantes ${t('ṯw/tw')}, ${t('ṯn/tn')} reflejan el cambio de ${t('ṯ')} a ${t('t')} (tema 2). La forma ${t('st')} se usa para «ella» y, cada vez más, para «ellos» y para «ello» (algo neutro).</p>`);

add(5, 'Los sufijos con sustantivos: detalles', `
<p>El sufijo se añade al final del sustantivo, <b>después</b> de la terminación de género y número y antes de cualquier adjetivo:</p>
${x('𓌢𓈖𓏏𓁐𓆑','snt.f','su hermana')}
${x('𓊹𓀭𓏥𓋴𓈖𓏥','nṯrw.sn','sus dioses (de ellos)')}
<ul>
<li>Si el sustantivo lleva adjetivo, el sufijo se pega al sustantivo y el adjetivo va después: ${t('pr.f ꜥꜣ')} «su gran casa».</li>
<li>Con un genitivo directo, el sufijo va al final del grupo: ${t('pr nb.f')} «la casa de su señor».</li>
<li>En el dual, el sufijo sigue a la terminación: ${t('jrtj.fj')} «sus dos ojos» (con una -j adicional que a veces se escribe con ${h('𓏭')}).</li>
<li>Algunas palabras que designan partes del cuerpo o relaciones de parentesco casi siempre llevan sufijo: ${t('jt.f')} «su padre», ${t('ḥꜣt.f')} «su frente».</li>
</ul>`);

add(5, 'Demostrativos: todas las formas y peculiaridades', `
<p>Hay cuatro series de demostrativos. Siguen al sustantivo, salvo ${t('pꜣ')}, que va delante:</p>
${tb(['Serie','Masc.','Fem.','Plural','Sentido'],[
['p-n',t('pn'),t('tn'),t('nn'),'«este, esta, estos» (lo cercano)'],
['p-f',t('pf')+' / '+t('pfꜣ'),t('tf'),t('nf'),'«aquel» (lo lejano)'],
['p-w',t('pw'),t('tw'),t('nw'),'«este» (forma antigua); '+t('pw')+' sirve de cópula «es»'],
['p-ꜣ',t('pꜣ'),t('tꜣ'),t('nꜣ'),'«este, el» (va delante; lengua hablada)'],
])}
<p><b>Peculiaridades:</b></p>
<ul>
<li>Los plurales ${t('nn')}, ${t('nf')}, ${t('nꜣ')} no van detrás, sino <b>delante del sustantivo, unidos por ${t('n')}</b>: ${t('nn n zjw')} «estos hombres», ${t('nꜣ n rmṯ')} «esta gente». Gramaticalmente son como «el conjunto de…».</li>
<li>Los demostrativos pueden funcionar como <b>pronombres</b> por sí solos: ${t('nn')} «esto», ${t('pf')} «aquel».</li>
<li>${t('nn')} y ${t('nf')} con sentido neutro significan «esto», «eso»: ${t('jr.n.j nn')} «hice esto».</li>
<li>Si el sustantivo lleva sufijo, el demostrativo no se usa: no se dice «esta su casa».</li>
<li>${t('pw')} tiene un uso especialísimo como «es» en las oraciones nominales (tema 7).</li>
</ul>`);

add(5, 'Pronombres interrogativos', `
<p>Para preguntar «¿quién?», «¿qué?», «¿cuál?», el egipcio medio tiene varios pronombres. Ninguno cambia de forma:</p>
${tb(['Pronombre','Significado','Ejemplo'],[
[t('m'),'¿quién?, ¿qué? (enclítico o tras preposición)',t('m pw')+' «¿quién es?»; '+t('ḥr m')+' «¿por qué?»'],
[t('jn-m'),'¿quién? (al principio de la frase)',t('jn-m rḫ st')+' «¿quién lo sabe?»'],
[t('ptr')+' / '+t('pty'),'¿quién?, ¿qué?',t('ptr rn.k')+' «¿cuál es tu nombre?»'],
[t('jšst')+' / '+t('jš')+'','¿qué?',t('jšst pw')+' «¿qué es (eso)?»'],
[t('zj'),'¿cuál?, ¿qué? (adjetivo, va delante)',t('zj wꜣt')+' «¿qué camino?»'],
])}
<p>Los interrogativos suelen ir donde iría la respuesta (como en «¿has venido por qué?»). Con preposición forman preguntas útiles: ${t('ḥr m')} o ${t('ḥr jšst')} «¿por qué?», ${t('r m')} «¿para qué?», ${t('mj m')} «¿cómo?». Volveremos a ellos en las oraciones nominales (tema 7), adverbiales (tema 10) y verbales.</p>`);

/* ===================== TEMA 6 ===================== */
add(6, 'El orden de los modificadores', `
<p>Cuando un sustantivo va acompañado de varios elementos, el orden habitual es:</p>
<p style="text-align:center"><b>sustantivo + sufijo + demostrativo + adjetivo(s) + genitivo indirecto / sintagma preposicional</b></p>
${x('𓉐𓏤𓊪𓈖𓄤𓆑𓂋','pr pn nfr','esta casa buena')}
<ul>
<li>El adjetivo sigue al sustantivo y concuerda en género y número: ${t('snt nfrt')}, ${t('snw nfrw')}.</li>
<li>Con el genitivo directo, el adjetivo va al final y concuerda con el sustantivo al que se refiere: ${t('ḥmt nswt wrt')} «la gran esposa del rey» (wrt concuerda con ḥmt).</li>
<li>${t('nb')} «todo, cada» va el último entre los adjetivos: ${t('ḫt nbt nfrt')} … o también ${t('ḫt nfrt nbt')}; las dos órdenes aparecen.</li>
</ul>`);

add(6, 'Adjetivos usados como sustantivos', `
<p>Cualquier adjetivo puede funcionar como sustantivo, como en español «los buenos», «lo bello»:</p>
${tb(['Forma','Significado'],[
[t('nfr'),'el bueno, el hermoso (una persona)'],
[t('nfrt'),'lo bueno, el bien (neutro = femenino)'],
[t('ḏwt'),'el mal, lo malo'],
[t('wrw'),'los grandes (los magnates)'],
[t('šrjw'),'los pequeños, los niños'],
[t('ꜥꜣw'),'los grandes, los nobles'],
])}
<p>El femenino singular se usa para las ideas abstractas o neutras: ${t('jr.n.j nfrt')} «hice el bien».</p>`);

add(6, 'La construcción nfr ḥr «hermoso de cara»', `
<p>El egipcio forma adjetivos compuestos con un adjetivo seguido de un sustantivo que precisa en qué aspecto se aplica. Es como el español «ancho de espaldas» o «largo de brazos»:</p>
${x('𓄤𓆑𓂋𓁷𓏤','nfr ḥr','hermoso de rostro','epíteto de Ptah y de otros dioses')}
${x('𓅨𓂋𓄖𓏏𓏭','wr pḥtj','grande de fuerza, muy fuerte')}
${x('𓂝𓄿𓄣','ꜥꜣ jb','grande de corazón, arrogante')}
<p>El sustantivo puede llevar sufijo que remite al sujeto: ${t('nfr ḥr.f')} «hermoso de su rostro». La construcción es muy frecuente en epítetos de dioses y reyes y en las autobiografías.</p>`);

add(6, 'El adjetivo interrogativo y los «falsos adjetivos»', `
<p><b>${t('zj')} «¿cuál?»</b> funciona como adjetivo interrogativo, pero <b>va delante</b> del sustantivo: ${t('zj njwt')} «¿qué ciudad?».</p>
<p>Hay palabras que parecen adjetivos pero tienen comportamientos propios:</p>
<ul>
<li><b>${t('nb')} «todo, cada»</b>: va detrás y concuerda (${t('nb')}, ${t('nbt')}, ${t('nbw')}), pero en singular significa «cualquier, cada» y en plural «todos».</li>
<li><b>${t('ky')} «otro»</b> (fem. ${t('kt')}, pl. ${t('kjwj')}): va <b>delante</b> del sustantivo: ${t('ky zj')} «otro hombre». Solo también puede significar «otro, alguien más».</li>
<li><b>${t('wꜥ')} «uno, único»</b>: tras el sustantivo puede significar «único, solo»; delante con ${t('m')} forma partitivos: ${t('wꜥ m nn n zjw')} «uno de estos hombres».</li>
<li><b>${t('ṯnw')} «cada»</b>: se usa sobre todo con unidades de tiempo: ${t('rnpt ṯnt')} «cada año».</li>
<li><b>${t('ḏs')} «mismo»</b>: lleva sufijo y va detrás: ${t('nswt ḏs.f')} «el rey mismo, el propio rey».</li>
</ul>`);

add(6, 'Comparativo y superlativo', `
<p>El egipcio no tiene formas especiales («más grande», «el más grande») para los adjetivos. Usa construcciones:</p>
<ul>
<li><b>Comparativo con ${t('r')}:</b> adjetivo + ${t('r')} «más que»: ${t('ꜥꜣ r nṯrw')} «más grande que los dioses». Literalmente, «grande con respecto a».</li>
<li><b>Superlativo con genitivo:</b> ${t('wr n wrw')} «el grande de los grandes» = «el más grande»; ${t('nṯr ꜥꜣ')} puede significar «el dios más grande».</li>
<li><b>Superlativo con ${t('m')}:</b> ${t('nfr m ḫt nbt')} «el mejor de todo».</li>
<li><b>Con nisbes:</b> ${t('ḥrj-tp')} «el que está a la cabeza» = «el principal»; ${t('tpj')} «el primero».</li>
</ul>`);

add(6, 'Cómo se dice «tener» en egipcio', `
<p>El egipcio no tiene un verbo «tener». Expresa la posesión de varias maneras:</p>
${tb(['Construcción','Sentido','Ejemplo'],[
[t('jw')+' + cosa + '+t('n')+' + poseedor','«X es para Y» = «Y tiene X»',t('jw pr n.f')+' «él tiene una casa»'],
[t('n')+' + poseedor + cosa (oración adjetival de posesión)','«de Y es X»',t('n.k pt')+' «tuyo es el cielo»'],
[t('n(j)')+' + poseedor (nisbe de '+t('n')+')','«perteneciente a»',t('nj sw nb.f')+' «él pertenece a su señor»'],
[t('ẖr')+' / '+t('m-ꜥ'),'«en posesión de, con»',t('jw ḫt m-ꜥ.f')+' «las cosas están en su mano», «él tiene las cosas»'],
[t('nb')+' + sustantivo','«señor de» = «poseedor de»',t('nb ꜥꜣw')+' «dueño de asnos» = «el que tiene asnos»'],
[t('nfr ḥr')+' y similares','la cualidad se atribuye al poseedor',t('ꜥšꜣ zrw')+' «numeroso de ovejas» = «que tiene muchas ovejas»'],
])}
<p>Estas construcciones se estudian con más detalle en los temas 7, 8, 10 y 11.</p>`);

/* ===================== TEMA 7 ===================== */
add(7, 'Oraciones adjetivales: el sujeto y los añadidos', `
<p>En la oración adjetival el predicado (el adjetivo) va <b>primero</b> y <b>no concuerda</b> con el sujeto; aparece siempre en la forma masculina singular, aunque el sujeto sea femenino o plural: ${t('nfr ḥmt.f')} «su esposa es hermosa» (no *nfrt).</p>
<p><b>El sujeto</b> puede ser:</p>
<ul>
<li>un sustantivo: ${t('wr ḥm.f')} «su majestad es grande»;</li>
<li>un pronombre dependiente: ${t('nfr sw')} «él es bueno», ${t('nfr sj')} «ella es buena», ${t('nfr tw')} «tú eres bueno»;</li>
<li>un demostrativo: ${t('nfr nn')} «esto es bueno».</li>
</ul>
<p><b>Exclamación con ${t('wj')}:</b> el adjetivo seguido de ${t('wj')} expresa admiración: ${t('nfr wj')} … «¡qué bueno es…!», ${t('nfr wj pr pn')} «¡qué hermosa es esta casa!». No confundas este ${t('wj')} con el pronombre de 1.ª persona.</p>
<p><b>Añadidos:</b> detrás del sujeto pueden ir sintagmas preposicionales: ${t('nḏm jb.j r.s')} «mi corazón está más contento que eso»; ${t('nfr n.k')} «es bueno para ti».</p>`);

add(7, 'Oraciones adjetivales de posesión', `
<p>Con la preposición ${t('n')} + sufijo al comienzo se forma una oración que expresa a quién pertenece algo:</p>
${x('𓈖𓎡𓊪𓏏𓇯','n.k pt','tuyo es el cielo')}
${x('𓈖𓆑𓏏𓇾','n.f tꜣ','suya es la tierra')}
<p>El sintagma ${t('n.k')} funciona aquí como un predicado adjetival («perteneciente a ti»), y el sujeto va detrás. Con un poseedor nominal se usa la nisbe ${t('nj')}: ${t('nj sw rꜥ')} «él pertenece a Ra». Esta construcción es frecuente en textos religiosos y en fórmulas reales.</p>`);

add(7, 'Oraciones nominales: todos los tipos', `
<p>Las oraciones nominales unen dos sustantivos o pronombres sin verbo («A es B»). El egipcio medio tiene tres modelos:</p>
${tb(['Modelo','Uso','Ejemplo'],[
['<b>A B</b>','Sobre todo con pronombre independiente de 1.ª o 2.ª persona',t('jnk sš')+' «yo soy escriba»; '+t('ntk nb.j')+' «tú eres mi señor»'],
['<b>A pw</b>','«Es A», «se trata de A»',t('sš pw')+' «es un escriba»'],
['<b>A pw B</b>','Con dos sustantivos o con 3.ª persona',t('rꜥ pw jt.j')+' «Ra es mi padre»'],
])}
<p><b>Con pronombres.</b> La 1.ª y la 2.ª persona usan el modelo A B: ${t('jnk')} / ${t('ntk')} + predicado. La 3.ª persona puede usar ${t('ntf')} / ${t('nts')} + B, pero lo más común es A ${t('pw')}: ${t('zꜣ.j pw')} «él es mi hijo» (literalmente «mi hijo es esto»).</p>
<p><b>Con dos sustantivos.</b> El modelo A B sin ${t('pw')} existe, pero es raro y suele aparecer en títulos, nombres y frases hechas (${t('ḫw-n-jnpw rn.f')} «Junanup es su nombre»). Lo normal es A ${t('pw')} B.</p>
<p><b>A pw B.</b> ${t('pw')} es un demostrativo invariable («esto») que actúa como cópula. Va <b>detrás del primer sustantivo</b> (o del primer grupo). En A pw B, el primer elemento suele ser el <b>predicado</b> (lo nuevo) y B el sujeto: ${t('rꜥ pw jt.j')} = «mi padre es Ra». Sin embargo, en español muchas veces es mejor traducir en el orden «B es A» o como resulte natural.</p>`);

add(7, 'Sujeto y predicado; interrogativos en oraciones nominales', `
<p>Distinguir sujeto y predicado no siempre es fácil, porque los dos son sustantivos. La regla general: el <b>predicado</b> es la información nueva; el <b>sujeto</b>, lo ya conocido. En ${t('jnk sš')}, «yo» es el tema conocido y «escriba» lo nuevo. Con ${t('pw')}, lo que va delante es normalmente el predicado.</p>
<p><b>Preguntas.</b> Los interrogativos ocupan el lugar del predicado:</p>
${x('𓅓𓊪𓅱','m pw','¿quién es?')}
${x('𓊪𓏏𓂋𓁻𓂋𓈖𓎡','ptr rn.k','¿cuál es tu nombre?')}
<p>Para convertir una oración nominal en pregunta de «sí o no» se pone ${t('jn')} delante: ${t('jn ntk zꜣ.f')} «¿eres tú su hijo?».</p>`);

add(7, 'La primera persona en oraciones adjetivales', `
<p>Con la 1.ª persona del singular, el pronombre dependiente ${t('wj')} es el sujeto normal: ${t('nfr wj')} puede significar «yo soy bueno». Esto coincide en la forma con la exclamación «¡qué bueno!» (${t('nfr wj')} + sujeto). El contexto decide:</p>
<ul>
<li>${t('nfr wj')} solo, en un texto en primera persona: «soy bueno».</li>
<li>${t('nfr wj')} + sustantivo: «¡qué bueno es…!».</li>
</ul>
<p>En el plural se usa ${t('n')}: ${t('nfr n')} «somos buenos».</p>`);

add(7, 'Oración nominal o adjetival; el tiempo; frases y oraciones', `
<p><b>¿Cuándo se usa cada una?</b> La oración adjetival describe una <b>cualidad</b> («es bueno»); la nominal identifica o clasifica («es un escriba», «es Ra»). Un adjetivo usado como sustantivo puede aparecer en una nominal con matiz distinto: ${t('nfr pw')} «es algo bueno» frente a ${t('nfr sw')} «es bueno».</p>
<p><b>Tiempo.</b> Las oraciones no verbales <b>no marcan el tiempo</b>: ${t('jnk sš')} puede significar «soy escriba», «era escriba» o «seré escriba». Se traduce según el contexto: en una autobiografía de un difunto, normalmente en pasado.</p>
<p><b>Frase y oración.</b> No confundas un <b>sintagma</b> (${t('pr nfr')} «una casa buena») con una <b>oración</b> (${t('nfr pr')} «la casa es buena»). La diferencia está en el orden: adjetivo detrás = modificador; adjetivo delante = predicado.</p>`);

/* ===================== TEMA 8 ===================== */
add(8, 'Las preposiciones primarias: todos sus sentidos', `
<p>Las preposiciones egipcias tienen sentidos muy amplios; el verbo o el contexto determinan cuál conviene. Repaso detallado de las principales:</p>
${tb(['Prep.','Sentidos'],[
[t('m'),'en, dentro de (lugar y tiempo); con (instrumento); de, desde (origen); como, en calidad de («m de predicación»); consistente en'],
[t('n'),'a, para (destinatario, beneficiario); a causa de; de (posesión, en sentido «perteneciente a»)'],
[t('r'),'hacia, a (dirección); contra (hostilidad); en cuanto a; más que (comparación); para, con el fin de (finalidad); en (tiempo futuro)'],
[t('ḥr'),'sobre, encima de; a causa de, por; junto a; en (con verbos); ocupado en (pseudoverbal, tema 15)'],
[t('ḫr'),'junto a, ante (personas importantes: el rey, los dioses); de parte de'],
[t('ẖr'),'debajo de; con, en posesión de; bajo (la autoridad de): '+t('ẖr ḥm n')+' «bajo la majestad de»'],
[t('ḥnꜥ'),'con, junto con (compañía); y (enlazando sustantivos)'],
[t('mj'),'como, igual que; según'],
[t('jn'),'por (agente, tras pasivos e infinitivos); también marca de pregunta y de foco'],
[t('ḏr'),'desde (tiempo)'],
[t('ḫft'),'frente a, ante; de acuerdo con; cuando'],
[t('ḥꜣ'),'detrás de, alrededor de'],
[t('tp'),'sobre, en la cima de'],
[t('ḫnt'),'delante de, al frente de'],
])}`);

add(8, 'Más preposiciones compuestas', `
<p>Además de las vistas, son frecuentes:</p>
${tb(['Compuesta','Sentido literal','Uso'],[
[t('m-bꜣḥ'),'en presencia de','ante (alguien), en tiempos de'],
[t('m-ḥꜣt'),'en el frente de','delante de, antes de'],
[t('m-sꜣ'),'en la espalda de','detrás de, tras; tras (perseguir)'],
[t('ḥr-sꜣ'),'sobre la espalda de','después de, detrás de'],
[t('r-ḥꜣt'),'hacia el frente de','delante de'],
[t('m-ẖnw'),'en el interior de','dentro de'],
[t('r-ẖnw'),'hacia el interior de','hacia dentro'],
[t('m-qꜣb'),'en el medio de','entre'],
[t('r-ꜥ'),'junto al brazo de','junto a, al lado de'],
[t('ḥr-ꜥ'),'sobre el brazo de','enseguida, inmediatamente'],
[t('r-mn-m'),'hasta','hasta (lugar)'],
[t('r-jwd'),'hacia la separación de','entre (dos cosas)'],
])}
<p>Muchas proceden de partes del cuerpo: ${t('ḥꜣt')} «frente», ${t('sꜣ')} «espalda», ${t('ꜥ')} «brazo», ${t('ḥr')} «cara», ${t('tp')} «cabeza», ${t('ẖnw')} «interior».</p>`);

add(8, 'El complemento de las preposiciones', `
<p>Una preposición puede llevar como complemento:</p>
<ul>
<li>un <b>sustantivo</b> o sintagma: ${t('m pr nswt')};</li>
<li>un <b>pronombre sufijo</b>: ${t('ḥr.s')} «sobre ella»;</li>
<li>un <b>infinitivo</b> (tema 14): ${t('r mꜣꜣ')} «para ver»;</li>
<li>una <b>oración</b> (temas 12, 19 y siguientes): ${t('ḏr ntt')} «puesto que».</li>
</ul>
<p>Algunas preposiciones cambian de forma ante sufijo: ${t('m')} → ${t('jm')}, ${t('r')} → ${t('jr')}, y ${t('n')} conserva su forma (${t('n.f')}). Las compuestas llevan el sufijo en el sustantivo final: ${t('m-bꜣḥ.f')} «ante él», ${t('m-sꜣ.sn')} «tras ellos».</p>`);

add(8, 'La preposición n con predicados adjetivales', `
<p>Con ${t('n')} se forma un tipo especial de oración adjetival <b>sin sujeto</b>, equivalente a las frases españolas con sujeto impersonal: ${t('nfr n.ṯn')} «(es) bueno para vosotros», «os conviene»; ${t('bjn wj n.j')} «¡qué malo es para mí!». En español no expresamos ningún sujeto («es bueno»), y el egipcio tampoco lo pone: el adjetivo-predicado va seguido directamente de ${t('n')} + la persona afectada.</p>`);

add(8, 'Las nisbes preposicionales y sus usos especiales', `
<p>De casi cada preposición sale una <b>nisbe</b> (adjetivo en ${t('-j')}) que significa «el que está (en relación) con…». Concuerdan en género y número:</p>
${tb(['Preposición','Nisbe','Femenino / plural','Sentido'],[
[t('m'),t('jmj'),t('jmjt')+' / '+t('jmjw'),'que está en'],
[t('ḥr'),t('ḥrj'),t('ḥrt')+' / '+t('ḥrjw'),'que está sobre, superior; jefe'],
[t('ẖr'),t('ẖrj'),t('ẖrt')+' / '+t('ẖrjw'),'que está debajo; que lleva, que posee'],
[t('tp'),t('tpj'),t('tpt')+' / '+t('tpjw'),'que está encima; primero'],
[t('ḫnt'),t('ḫntj'),t('ḫntt')+' / '+t('ḫntjw'),'que está delante; principal'],
[t('n'),t('nj'),t('nt')+' / '+t('nw'),'perteneciente a (es el genitivo indirecto)'],
[t('jr')+' (=r)',t('jrj'),t('jrt')+' / '+t('jrjw'),'relativo a, perteneciente; '+t('jrj')+' «su (de ello)»'],
])}
<p><b>Usos:</b> como adjetivos (${t('nṯrw jmjw pt')} «los dioses que están en el cielo»), como sustantivos (${t('jmjw dwꜣt')} «los que están en la Duat»), y en innumerables <b>títulos</b>: ${t('jmj-r pr')} «el que está en la boca (= al mando) de la casa» = mayordomo; ${t('ḥrj-tp')} «jefe»; ${t('ẖrj-ḥbt')} «el que lleva el libro ritual» = sacerdote lector.</p>
<p><b>Usos especiales:</b> ${t('jrj')} se usa como posesivo «de ello»: ${t('nb jrj')} «su señor (de ello)»; la nisbe ${t('jmj')} con sufijo aparece en expresiones como ${t('jmj.f')} «el que está en él». Una nisbe puede tener a su vez complemento: ${t('jmj-ḫt nswt')} «el que está tras el rey» = «seguidor del rey».</p>`);

add(8, 'Sintagmas preposicionales como modificadores', `
<p>Un sintagma preposicional puede modificar a un sustantivo directamente, sin relativo: ${t('zj m njwt')} «un hombre (que está) en la ciudad». Sin embargo, es más frecuente usar una nisbe (${t('zj jmj njwt')}) o una relativa con ${t('ntj')} (tema 12) cuando el sustantivo es determinado.</p>`);

add(8, 'Los adverbios en detalle', `
<p>El egipcio tiene pocos adverbios «puros». Los principales:</p>
${tb(['Adverbio','Sentido'],[
[t('jm'),'allí, en ello (forma de '+t('m')+')'],
[t('ꜥꜣ'),'aquí'],
[t('ṯnj')+' / '+t('tnj'),'¿dónde? (interrogativo)'],
[t('ḏy')+' / '+t('dj'),'aquí (más tardío)'],
[t('mjtt'),'igualmente, del mismo modo'],
[t('wrt'),'muy, mucho'],
[t('r-sj'),'muchísimo, en extremo'],
[t('ḏt')+', '+t('nḥḥ'),'para siempre'],
[t('grt')+', '+t('swt'),'además, pero (partículas, tema 16)'],
])}
<p><b>Adverbios preposicionales:</b> muchas preposiciones se usan sin complemento como adverbios: ${t('ḥr-sꜣ')} «después», ${t('m-ḫt')} «después, más tarde», ${t('ḥnꜥ')} «también, juntos», ${t('ḥꜣ')} «detrás», ${t('r-ḏr')} «por completo».</p>
<p><b>Sustantivos y adjetivos como adverbios:</b> ${t('rꜥ nb')} «cada día», ${t('ḏt')} «eternamente», ${t('nfr')} «bien». Muchas expresiones adverbiales se forman con ${t('m')} + sustantivo: ${t('m ḥtp')} «en paz», ${t('m mꜣꜥt')} «verdaderamente».</p>
<p><b>Posición:</b> los adverbios van normalmente al final de la oración. Los <b>comparativos</b> se forman como con los adjetivos, con ${t('r')}: ${t('r ḫt nbt')} «más que todo».</p>`);

/* ===================== TEMA 9 ===================== */
add(9, 'Los números cardinales: nombres y escritura', `
<p>En los textos los números casi siempre se escriben con <b>cifras</b>, pero cada número tenía su nombre:</p>
${tb(['Número','Nombre','Número','Nombre'],[
['1',t('wꜥ'),'10',t('mḏ')],
['2',t('snwj'),'20',t('ḏwtj')],
['3',t('ḫmtw'),'30',t('mꜥbꜣ')],
['4',t('fdw'),'100',t('št')],
['5',t('djw'),'1000',t('ḫꜣ')],
['6',t('sjsw'),'10 000',t('ḏbꜥ')],
['7',t('sfḫw'),'100 000',t('ḥfn')],
['8',t('ḫmnw'),'1 000 000',t('ḥḥ')],
['9',t('psḏw'),'',''],
])}
<p>Las cifras se repiten tantas veces como haga falta y se ordenan de mayor a menor: 342 = tres rollos de cuerda ${h('𓍢')}, cuatro asas ${h('𓎆')} y dos trazos ${h('𓏤')}. Los signos se agrupan en cuadratines de forma compacta.</p>`);

add(9, 'Uso de los números con los sustantivos', `
<ul>
<li>El número va <b>detrás</b> del sustantivo: ${t('rnpt 5')} «cinco años».</li>
<li>El sustantivo puede ir en <b>singular</b> aunque el número sea mayor que uno (en la escritura, muchas veces sin trazos de plural): ${t('t 100')} «cien panes».</li>
<li>Con 2 se puede usar el dual: ${t('sntj')} «dos hermanas».</li>
<li>El número 1, ${t('wꜥ')}, va detrás del sustantivo y significa también «único, solo»; puede usarse como artículo indeterminado en textos tardíos.</li>
<li>Cuando el número se escribe con palabras, a veces va <b>delante</b> con ${t('n')}: ${t('ḫmt n zjw')} «tres hombres» (literalmente «un trío de hombres»).</li>
</ul>`);

add(9, 'Los ordinales', `
<p>Para «primero», «segundo»… hay varias construcciones:</p>
<ul>
<li><b>${t('tpj')}</b> «primero» (nisbe de ${t('tp')} «cabeza»): ${t('ꜣbd tpj')} «el primer mes».</li>
<li><b>Sufijo ${t('-nw')}</b> para 2 a 9: ${t('snnw')} «segundo», ${t('ḫmtnw')} «tercero», ${t('fdnw')} «cuarto»… (fem. ${t('-nwt')}).</li>
<li><b>${t('mḥ')} + número</b> «que completa N», a partir de 10 y también para cifras pequeñas: ${t('mḥ-20')} «vigésimo».</li>
</ul>
<p>${t('snnw')} «segundo» se usa también como sustantivo: «compañero, igual» (literalmente «el que hace de segundo»).</p>`);

add(9, 'zp 2 «dos veces» y otras expresiones', `
<p>El sustantivo ${t('zp')} «vez, ocasión» con un número indica repetición: ${t('zp 2')} «dos veces». En los textos se usa para indicar que una palabra o frase debe <b>repetirse</b> al leer: ${t('nfr zp 2')} se lee «¡bien, bien!». Es como nuestras comillas de repetición.</p>
<p>Otras expresiones con ${t('zp')}: ${t('zp tpj')} «la primera vez» (y ${t('zp tpj')} «el tiempo primordial» de la creación), ${t('m zp wꜥ')} «de una sola vez, a la vez».</p>`);

add(9, 'Fracciones', `
<p>Los egipcios expresaban las fracciones como <b>partes unitarias</b> (1/n), escritas con la boca ${h('𓂋')} (${tp('r')} «parte») sobre el número: ${h('𓂋')} + 4 = 1/4. Las fracciones no unitarias se descomponían en sumas: 3/4 = 1/2 + 1/4.</p>
${tb(['Fracción','Escritura / nombre'],[
['1/2',t('gs')+' «mitad» (signo '+h('𓐛')+')'],
['2/3',t('rwj')+' «las dos partes» (signo especial)'],
['1/3, 1/4, 1/5…',t('r')+' + número'],
])}
<p>Para medir grano se usaban las llamadas «fracciones del ojo de Horus»: cada parte del ojo ${h('𓂀')} representaba 1/2, 1/4, 1/8, 1/16, 1/32 y 1/64 de un ${t('ḥqꜣt')}.</p>`);

add(9, 'Pesos y medidas', `
${tb(['Medida','Valor aproximado','Uso'],[
[t('mḥ')+' «codo»','52,5 cm (codo real)','Longitud; se dividía en 7 palmos ('+t('šzp')+') de 4 dedos ('+t('ḏbꜥ')+')'],
[t('jtrw')+' «río»','unos 10,5 km','Distancias largas'],
[t('stꜣt')+' «aroura»','unos 2735 m²','Superficie de campos (100 × 100 codos)'],
[t('ḥqꜣt')+' «fanega»','unos 4,8 litros','Grano; 10 '+t('ḥqꜣt')+' = 1 '+t('ẖꜣr')+' «saco»'],
[t('hnw')+' «jarra»','0,48 litros','Líquidos'],
[t('dbn')+' «deben»','unos 91 g','Peso de metales; 10 '+t('qdt')+' (quites) = 1 deben'],
])}
<p>Al leer cuentas, recuerda que el valor (sobre todo del deben y del codo) varió según la época. El deben se usaba también como unidad de cuenta para fijar el precio de las cosas en trueque.</p>`);

add(9, 'Fechas y calendarios', `
<p><b>Día y mes.</b> Una fecha completa da el año de reinado, el mes, la estación y el día: ${t('ḥꜣt-zp 5 ꜣbd 2 ꜣḫt sw 10')} «año 5, segundo mes de la inundación, día 10».</p>
<p><b>Estaciones.</b> El año civil tenía tres estaciones de cuatro meses de 30 días:</p>
${tb(['Estación','Sentido','Época real (en origen)'],[
[t('ꜣḫt'),'inundación','verano–otoño'],
[t('prt'),'salida (de la tierra), siembra','invierno'],
[t('šmw'),'calor, cosecha','primavera–verano'],
])}
<p>A los 360 días se sumaban <b>cinco días epagómenos</b>, ${t('ḥrjw-rnpt')} «los que están sobre el año», dedicados al nacimiento de Osiris, Horus, Seth, Isis y Neftis. Total: 365 días.</p>
<p><b>Años.</b> En el Reino Antiguo los años se contaban por los censos de ganado (${t('zp')} «ocasión»); en el Reino Medio y después, por años de reinado: ${t('ḥꜣt-zp')} (o ${t('rnpt-zp')}) «año de reinado». Cada rey reiniciaba la cuenta.</p>
<p><b>Calendarios.</b> Junto al calendario civil de 365 días existía uno <b>lunar</b> para las fiestas religiosas. Como al civil le faltaba un cuarto de día por año, se iba desfasando respecto a las estaciones reales: cada 1460 años aproximadamente volvía a coincidir con la salida helíaca de la estrella Sirio (${t('spdt')}), que anunciaba la crecida. Algunas fechas de esa salida registradas en documentos son la base de la cronología absoluta de Egipto.</p>`);
/* ===================== TEMA 10 ===================== */
add(10, 'Patrones básicos y el valor de jw', `
<p>La oración adverbial tiene la forma <b>sujeto + predicado adverbial</b>. El predicado puede ser un adverbio (${t('jm')} «allí»), un sintagma preposicional (${t('m pr')} «en la casa») o, como veremos en el tema 15, una preposición con infinitivo.</p>
<p><b>La partícula ${t('jw')}</b> introduce muchas oraciones adverbiales independientes. No se traduce: indica que la oración es una <b>afirmación</b> de algo que el hablante presenta como un hecho, normalmente en relación con la situación del momento. Por eso es típica del discurso, de las cartas y de las autobiografías. Rasgos importantes:</p>
<ul>
<li>${t('jw')} encabeza una oración <b>principal</b> (aunque también se usa en las circunstanciales, ver más abajo).</li>
<li>Tras ${t('jw')}, un sujeto pronominal es un <b>sufijo</b>: ${t('jw.f m pr')} «él está en la casa».</li>
<li>Una oración adverbial también puede ir <b>sin partícula</b>, sobre todo en oraciones subordinadas, títulos y textos poéticos: ${t('nṯr m pt')} «el dios está en el cielo».</li>
</ul>`);

add(10, 'Otras partículas iniciales y los sujetos pronominales', `
<p>Además de ${t('jw')}, otras partículas pueden encabezar una oración adverbial:</p>
${tb(['Partícula','Sentido','Sujeto pronominal'],[
[t('mk')+' / '+t('mṯ')+' / '+t('mṯn'),'«mira» (a un hombre / mujer / varios): llama la atención sobre algo presente','pronombre <b>dependiente</b>: '+t('mk wj m-ꜥ.k')+' «mira, estoy en tus manos»'],
[t('jsṯ')+' / '+t('sṯ'),'«mientras, cuando» (circunstancia)','dependiente: '+t('jsṯ sw ḥr wꜣt')],
[t('ꜥḥꜥ.n')+' / '+t('wn.jn'),'«entonces» (narración, temas 15 y 18)','sufijo'],
[t('nn')+' (negación, tema 11)','«no»','dependiente: '+t('nn sw m pr')],
])}
<p><b>Resumen de los sujetos pronominales</b> en oraciones adverbiales:</p>
<ul>
<li>Tras ${t('jw')} (y tras las formas verbales): <b>sufijo</b> — ${t('jw.j')}, ${t('jw.k')}, ${t('jw.f')}…</li>
<li>Tras ${t('mk')}, ${t('jsṯ')}, ${t('nn')} y similares: <b>dependiente</b> — ${t('mk sw')}, ${t('jsṯ sj')}…</li>
<li>Sin partícula: también puede ir el <b>dependiente</b> al comienzo: ${t('sw mj jḫ')} «¿cómo es?» (literalmente «él es como qué»).</li>
</ul>`);

add(10, 'Oraciones adverbiales de identidad, de posesión y con r', `
<p><b>Identidad: «m de predicación».</b> Con ${t('m')} «como, en calidad de», la oración adverbial expresa lo que alguien es o el papel que desempeña: ${t('jw.k m jt n nmḥ')} «tú eres un padre para el huérfano» (literalmente «estás como padre»). Se prefiere a la oración nominal cuando se trata de una condición o un papel, no de una identidad permanente.</p>
<p><b>Posesión.</b> Con ${t('n')} + poseedor: ${t('jw pr n.f')} «él tiene una casa» (literalmente «hay una casa para él»). Con ${t('m-ꜥ')} o ${t('ẖr')}: ${t('jw jḫt m-ꜥ.j')} «tengo bienes (en mi mano)».</p>
<p><b>Con ${t('r')}: destino o futuro.</b> ${t('r')} + sustantivo en el predicado expresa lo que alguien va a ser o aquello a lo que está destinado: ${t('jw.k r jmꜣḫw')} «serás un venerado»; ${t('jw pr pn r zꜣ.f')} «esta casa será para su hijo». Es el antecedente del futuro pseudoverbal con ${t('r')} + infinitivo (tema 15).</p>`);

add(10, 'Oraciones adverbiales sin sujeto e interrogativas', `
<p><b>Sin sujeto.</b> Igual que en las adjetivales, a veces el sujeto se omite porque no se refiere a nada concreto (español «es como…»). Estas oraciones siempre empiezan con una partícula:</p>
${x('','jw mj sḫr nṯr','es como el designio de un dios','Sinuhé')}
<p><b>Preguntas.</b> El adverbio interrogativo ${t('tnj')} / ${t('ṯnj')} «¿dónde?» funciona como predicado: ${t('jw.k tnj')} «¿dónde estás?». También un interrogativo con preposición: ${t('sw mj jḫ')} «¿cómo es?» (literalmente «es como qué»). Para preguntas de sí o no se usa ${t('jn jw')}: ${t('jn jw.k m pr')} «¿estás en casa?».</p>`);

/* ===================== TEMA 11 ===================== */
add(11, 'Oraciones marcadas y no marcadas', `
<p>Las oraciones no verbales (adjetivales, nominales y adverbiales) pueden ir <b>marcadas</b> con una partícula inicial (${t('jw')}, ${t('mk')}, ${t('jsṯ')}…) o <b>sin marcar</b>. La partícula no cambia el significado básico, pero aporta matices:</p>
<ul>
<li>${t('jw')}: afirmación de un hecho en relación con el momento (típico del discurso).</li>
<li>${t('mk')}: presenta algo como evidente o actual («mira…»).</li>
<li>Sin partícula: enunciado general, atemporal, o subordinado a otro (circunstancial).</li>
</ul>
<p>Las adjetivales y nominales rara vez llevan ${t('jw')}; las adverbiales, muy a menudo.</p>`);

add(11, 'Todas las negaciones no verbales', `
${tb(['Tipo de oración','Negación','Ejemplo'],[
['Existencia («no hay»)',t('nn')+' + sustantivo',t('nn mw')+' «no hay agua»'],
['Adverbial',t('nn')+' + sujeto + predicado',t('nn sw m pr')+' «no está en casa»'],
['Nominal',tneg()+' … '+t('js'),t('n sš js pw')+' «no es escriba»; '+t('n ntk js')+' «no eres tú»'],
['Adjetival',tneg()+' + adjetivo + '+t('js')+' (raro)',t('n ꜥꜣ js sw')+' «no es grande»'],
['Posesión',t('nn')+' + cosa + '+t('n')+' + poseedor',t('nn ḫt n.f')+' «no tiene bienes»'],
['«No existe»',t('nn wn'),t('nn wn ḏwt')+' «no existe el mal»'],
])}
<p><b>La partícula ${t('js')}</b> acompaña a la negación ${tneg()} en las oraciones nominales: se coloca detrás del primer elemento negado. Sin ${tneg()}, ${t('js')} sirve para subordinar (tema 12).</p>
<p><b>Otras negaciones:</b> ${t('jwtj')} «que no tiene» (tema 12), ${t('nfr n')} en expresiones tardías, y el verbo negativo ${t('tm')} (tema 14). En los textos verás también ${t('nj')} como variante gráfica de ${tneg()}.</p>`);

add(11, 'Posesión, oraciones sin sujeto y preguntas no verbales', `
<p><b>Posesión.</b> Además de ${t('jw')} + cosa + ${t('n')} + poseedor (tema 10) y ${t('n.k')} + cosa (tema 7), la negación ${t('nn')} da «no tener»: ${t('nn zꜣ.f')} «no tiene hijo» (literalmente «no existe su hijo»).</p>
<p><b>Sin sujeto.</b> Las negaciones admiten también oraciones sin sujeto: ${t('nn m jwms')} «no es una exageración».</p>
<p><b>Preguntas.</b> Una oración no verbal se convierte en pregunta de sí o no:</p>
<ul>
<li>con ${t('jn')} delante: ${t('jn ntk zꜣ.j')} «¿eres tú mi hijo?»;</li>
<li>con ${t('jn jw')} en las adverbiales: ${t('jn jw.k ḥnꜥ.j')} «¿estás conmigo?»;</li>
<li>con el enclítico ${t('tr')} (o ${t('tj')}) detrás de la primera palabra, que da un matiz de «pues», «acaso».</li>
</ul>
<p>Las preguntas de «quién / qué / dónde» usan los interrogativos en el lugar de la respuesta (temas 5, 7 y 10).</p>`);

/* ===================== TEMA 12 ===================== */
add(12, 'El adjetivo relativo ntj: formas y usos', `
<p>${t('ntj')} es la <b>nisbe de la preposición ${t('n')}</b> y significa «que (está, es)…». Concuerda con su antecedente:</p>
${tb(['','Singular','Plural'],[
['Masculino',t('ntj'),t('ntjw')],
['Femenino / neutro',t('ntt'),t('ntt')],
])}
<p><b>Relativas directas:</b> el antecedente es el sujeto de la relativa. Detrás de ${t('ntj')} va directamente el predicado: ${t('sš ntj m pr')} «el escriba que está en la casa».</p>
<p><b>Relativas indirectas:</b> el antecedente cumple otra función dentro de la relativa, y un <b>pronombre de retorno</b> (resumptivo) lo recuerda: ${t('pr ntj sš jm.f')} «la casa en la que está el escriba» (literalmente «la casa que el escriba está en ella»). El pronombre de retorno concuerda con el antecedente.</p>
<p><b>Con sujeto pronominal:</b> tras ${t('ntj')} un sujeto pronominal es un <b>pronombre dependiente</b>: ${t('ntj sw m pr')} «el que (él) está en la casa».</p>`);

add(12, 'ntj como sustantivo y relativas negativas', `
<p><b>${t('ntj')} sin antecedente</b> funciona como sustantivo: ${t('ntj m pr')} «el que está en la casa»; ${t('ntjw m tꜣ')} «los que están en la tierra»; ${t('ntt')} (neutro) «lo que…». Expresiones frecuentes:</p>
<ul>
<li>${t('ntt nbt')} / ${t('ntj nb')} «todo lo que existe»;</li>
<li>${t('ntt jwtt')} «lo que existe y lo que no» = «todo».</li>
</ul>
<p><b>Relativas negativas.</b> Se forman con ${t('ntj')} + negación: ${t('ntj nn')}… «que no…»: ${t('ntj nn sw m pr')} «que no está en la casa». Pero lo más común para «que no tiene» es ${t('jwtj')}.</p>`);

add(12, 'jwtj, nisbes y relativas sin ntj', `
<p><b>${t('jwtj')}</b> es el «negativo» de ${t('ntj')}: «que no (hay), que no tiene». Concuerda igual (fem. ${t('jwtt')}, pl. ${t('jwtjw')}):</p>
${x('','jwtj zꜣ.f','el que no tiene hijo')}
${x('','jwtj sw','el que no existe, el que no tiene nada')}
<p><b>Nisbe o relativa.</b> Una nisbe preposicional (${t('jmj')}, ${t('ḥrj')}…) es una relativa abreviada: ${t('nṯrw jmjw pt')} = ${t('nṯrw ntjw m pt')}. Las dos construcciones son casi equivalentes; la nisbe se prefiere en títulos y epítetos.</p>
<p><b>Relativas sin ntj.</b> Cuando el antecedente es <b>indeterminado</b> («un hombre que…»), el egipcio no usa ${t('ntj')}: la relativa va directamente detrás, sin marca, como una oración circunstancial: ${t('zj pw wn')}… «había un hombre (que existía)…»; ${t('ḫt nb nfr wꜥb')} … Esta regla es importante: con antecedente determinado (o con «todo») se usa ${t('ntj')}; con indeterminado, la relativa no marcada.</p>`);

add(12, 'Oraciones sustantivas', `
<p>Una <b>oración sustantiva</b> funciona como un sustantivo (sujeto, objeto o complemento de preposición): «sé <i>que</i> eres mi señor».</p>
<p><b>Marcadas con ${t('ntt')} o ${t('wnt')}:</b> ${t('ntt')} (forma femenina/neutra de ${t('ntj')}) significa «que, el hecho de que». Se usa sobre todo tras preposiciones y verbos de conocimiento:</p>
${x('','rḫ.n.j ntt ntk nb.j','sé que tú eres mi señor')}
${x('','ḏr ntt ḥm.f m pr-ꜥꜣ','puesto que su majestad está en palacio')}
<p>Tras ${t('ntt')} un sujeto pronominal es dependiente (${t('ntt sw')}) o se usa ${t('ntt jw.f')}. En lugar de ${t('ntt')} se usa a veces ${t('wnt')}, sobre todo tras verbos.</p>
<p><b>No marcadas:</b> en algunos casos una oración entera funciona como objeto o sujeto sin ninguna marca, sobre todo tras verbos como ${t('rḫ')} «saber», ${t('mꜣꜣ')} «ver», ${t('gmj')} «encontrar», ${t('ḏd')} «decir»: ${t('gm.n.j sw m pr')} «lo encontré (estando) en casa».</p>
<p>En las cartas, ${t('r ntt')} «en cuanto a que» introduce el asunto: «para comunicar que…».</p>`);

add(12, 'Oraciones adverbiales (subordinadas)', `
<p>Una <b>oración adverbial subordinada</b> indica tiempo, causa, finalidad, condición, etc.</p>
<p><b>Marcadas:</b> con una partícula o una preposición + ${t('ntt')}:</p>
${tb(['Introductor','Sentido'],[
[t('jsṯ')+' / '+t('sṯ'),'mientras, cuando'],
[t('ḏr ntt'),'puesto que, ya que'],
[t('ḥr ntt'),'porque'],
[t('mj ntt'),'como, ya que'],
[t('r ntt'),'en cuanto a que'],
[t('n-ntt'),'porque'],
[t('jr')+' (tema 19 y siguientes)','si'],
])}
<p><b>No marcadas (circunstanciales).</b> Muy a menudo una oración adverbial se añade a otra <b>sin ninguna conjunción</b> y expresa la circunstancia en que ocurre la principal. Se traduce con «mientras», «cuando», «estando», «y»… según el sentido:</p>
${x('','jnk sš jw ḥm.f m pr-ꜥꜣ','yo era escriba cuando su majestad estaba en palacio')}
<p>Estas circunstanciales llevan a veces ${t('jw')} y a veces nada. Tras un verbo de percepción, describen el estado del objeto: ${t('gm.n.f sw ḥr wꜣt')} «lo encontró en el camino».</p>
<p><b>Posición:</b> las subordinadas adverbiales van normalmente <b>detrás</b> de la principal. Si van delante, suelen llevar una marca (${t('jr')} «si / en cuanto a», ${t('jsṯ')}) y tienen valor de tema o de condición.</p>`);

/* ===================== TEMA 13 ===================== */
add(13, 'Clases de verbos y sus rasgos', `
<p><b>Tipos de verbos según su significado y su construcción:</b></p>
<ul>
<li><b>Transitivos:</b> llevan objeto directo (${t('mꜣꜣ')} «ver algo»).</li>
<li><b>Intransitivos:</b> no lo llevan (${t('ꜥnḫ')} «vivir»). Los <b>verbos de movimiento</b> (${t('šm')} «ir», ${t('jwj')} «venir», ${t('ꜥq')} «entrar») son un grupo intransitivo con construcciones propias (por ejemplo, ${t('m')} + infinitivo en lugar de ${t('ḥr')}).</li>
<li><b>Verbos adjetivales:</b> los adjetivos son en realidad formas de verbos de cualidad (${t('nfr')} «ser bueno»); pueden conjugarse y tener estativo (${t('nfr.w')} «estar bien»).</li>
</ul>
<p><b>Rasgos que expresan las formas verbales:</b> el <b>aspecto</b> (acción completa o en curso), el <b>tiempo</b> (relativo, no siempre explícito), el <b>modo</b> (indicativo, subjuntivo, imperativo), la <b>voz</b> (activa o pasiva) y la <b>persona</b>.</p>
<p><b>Partes del sistema verbal:</b> la <b>conjugación de sufijos</b> (formas con el sujeto pegado: ${t('sḏm.f')}, ${t('sḏm.n.f')}…), el <b>estativo</b> (con terminaciones propias), las formas <b>no finitas</b> (infinitivo, participios, formas relativas) y el <b>imperativo</b>.</p>`);

add(13, 'Las clases de raíces', `
<p>Los verbos se agrupan según el número y el tipo de consonantes de su raíz. Esto importa porque cada clase forma sus tiempos de manera algo distinta:</p>
${tb(['Clase','Descripción','Ejemplos'],[
['2-lit.','dos consonantes',t('šm')+' «ir», '+t('ḏd')+' «decir», '+t('rḫ')+' «saber»'],
['3-lit.','tres consonantes (la clase «fuerte»)',t('sḏm')+' «oír», '+t('ꜥnḫ')+' «vivir», '+t('wnm')+' «comer»'],
['4-lit.','cuatro consonantes, a veces por repetición',t('ndnd')+' «consultar», '+t('gmgm')+' «quebrar»'],
['2ae gem. (segunda geminada)','la 2.ª consonante se duplica en algunas formas',t('mꜣꜣ')+' «ver» ('+t('mꜣ')+' / '+t('mꜣꜣ')+'), '+t('wnn')+' «existir», '+t('qbb')+' «estar fresco»'],
['3ae inf. (tercera débil)','la 3.ª consonante es una '+t('j')+' débil que suele desaparecer',t('jrj')+' «hacer», '+t('mrj')+' «amar», '+t('ḥzj')+' «favorecer», '+t('gmj')+' «encontrar»'],
['4ae inf.','cuatro consonantes, la última débil',t('ḥmsj')+' «sentarse», '+t('msdj')+' «odiar»'],
['Causativos','prefijo '+t('s-')+' + raíz',t('sꜥnḫ')+' «hacer vivir», '+t('smn')+' «establecer», '+t('sḫpr')+' «crear»'],
])}
<p>Los verbos <b>3ae inf.</b> son los más frecuentes y los más irregulares en apariencia: su ${t('j')} final aparece o desaparece, y forman el infinitivo con ${t('-t')} (${t('jrt')}, ${t('mrt')}). Los <b>2ae gem.</b> duplican la consonante en las formas imperfectivas y en el infinitivo (${t('mꜣꜣ')}), pero no en el perfecto (${t('mꜣ.n.f')}).</p>`);

add(13, 'Verbos anómalos y defectivos', `
<p><b>Anómalos:</b> unos pocos verbos muy frecuentes tienen formas irregulares:</p>
${tb(['Verbo','Particularidades'],[
[t('rdj')+' «dar, poner, hacer que»','Formas con '+t('rdj')+' y con '+t('dj')+' (subjuntivo, algunos participios); imperfectivo '+t('dd')+'; imperativo '+t('jmj')+'; infinitivo '+t('rdjt')],
[t('jwj')+' / '+t('jj')+' «venir»','Formas de dos raíces: '+t('jw')+' y '+t('jj')+'; infinitivo '+t('jjt')+'; imperativo '+t('mj')],
[t('jnj')+' «traer»','3ae inf. con alguna forma propia; imperativo '+t('jn')+' / '+t('jnj')],
[t('wnn')+' «ser, existir»','Sustituye a los predicados no verbales cuando hace falta una forma verbal (subjuntivo, imperfectivo…)'],
])}
<p><b>Defectivos:</b> verbos de los que solo existen algunas formas:</p>
<ul>
<li>${t('jn')} / ${t('j')} «dice, dijo» (solo en citas: ${t('jn.f')} «dice él»).</li>
<li>${t('jmj')} «no hagas» (verbo negativo, solo en imperativo y subjuntivo: tema 16 y 19).</li>
<li>${t('tm')} «no hacer» (verbo negativo con muchas formas: temas 14 y siguientes).</li>
<li>${t('mj')} «¡ven!» (solo imperativo).</li>
<li>${t('ḥꜣ')}, ${t('ḥwj')} «¡ojalá!» (partículas de origen verbal).</li>
</ul>`);

/* ===================== TEMA 14 ===================== */
add(14, 'La forma del infinitivo según la clase de verbo', `
${tb(['Clase','Infinitivo','Ejemplo'],[
['2-lit., 3-lit., 4-lit.','igual a la raíz',t('ḏd')+' «decir», '+t('sḏm')+' «oír»'],
['2ae gem.','raíz con la consonante duplicada',t('mꜣꜣ')+' «ver», '+t('wnn')+' «existir»'],
['3ae inf. y 4ae inf.','raíz (sin la j) + '+t('-t'),t('jrt')+' «hacer», '+t('mrt')+' «amar», '+t('ḥmst')+' «sentarse»'],
['Causativos 2-lit.','raíz + '+t('-t'),t('smnt')+' / '+t('smn')+' «establecer» (varía)'],
['Anómalos','formas propias',t('rdjt')+' «dar», '+t('jjt')+' «venir», '+t('jnt')+' «traer»'],
])}
<p>El infinitivo es <b>masculino</b> salvo cuando lleva la ${t('-t')}; en todo caso funciona como un sustantivo.</p>`);

add(14, 'Sujeto, objeto y orden de palabras con el infinitivo', `
<p>El infinitivo es un <b>sustantivo verbal</b>, así que su sujeto y su objeto se expresan como complementos de un sustantivo:</p>
<ul>
<li><b>Sujeto nominal:</b> en genitivo directo (${t('wbn rꜥ')} «la salida de Ra», «que Ra sale») o introducido por ${t('jn')} «por» (${t('jjt jn ḥm.f')} «la llegada de su majestad»).</li>
<li><b>Sujeto pronominal:</b> un sufijo (${t('msjt.f')} «su nacimiento»).</li>
<li><b>Objeto nominal:</b> en genitivo directo (${t('jrt mꜣꜥt')} «hacer la Maat»).</li>
<li><b>Objeto pronominal:</b> un sufijo con verbos transitivos (${t('mꜣꜣ.f')} «verlo») o un dependiente.</li>
</ul>
<p>Como un sufijo puede ser sujeto u objeto, ${t('mꜣꜣ.f')} puede significar «que él ve» o «verlo»: decide el contexto. Si hay sujeto y objeto, el orden es <b>infinitivo + objeto + ${t('jn')} + sujeto</b>, o infinitivo + sujeto (sufijo) + objeto.</p>`);

add(14, 'Los usos del infinitivo', `
<p>Como sustantivo, el infinitivo aparece en casi todas las funciones de un sustantivo:</p>
<ul>
<li><b>Sustantivo pleno:</b> sujeto u objeto de una oración (${t('nfr sḏm')} «es bueno escuchar»).</li>
<li><b>Títulos y encabezamientos:</b> textos rituales, escenas de tumbas y fórmulas: ${t('ḏd mdw')} «recitación», ${t('dwꜣ rꜥ')} «adorar a Ra» (como título de una escena), ${t('rꜣ n prt m hrw')} «fórmula para salir de día».</li>
<li><b>Tras genitivo indirecto:</b> ${t('rꜣ n ꜥq')} «fórmula para entrar».</li>
<li><b>Tras preposición:</b> ${t('r')} + infinitivo = finalidad («para»); ${t('ḥr')} + infinitivo = acción en curso (tema 15); ${t('m')} + infinitivo = movimiento en curso; ${t('ḫft')} + infinitivo = «cuando»; ${t('m-ḫt')} + infinitivo = «después de».</li>
<li><b>Objeto de verbos:</b> ${t('rḫ')} + infinitivo «saber hacer»; ${t('wḏ')} «ordenar hacer»; ${t('ꜥḥꜥ.n.f ḥr')}… (tema 15).</li>
<li><b>En oraciones no verbales:</b> como sujeto de adjetivales (${t('nfr sḏm')}) o en nominales.</li>
<li><b>En la narración:</b> en listas de acontecimientos, diarios y anales, un infinitivo puede funcionar como verbo principal: ${t('jjt jn ḥm.f')}… «llegada de su majestad» = «su majestad llegó».</li>
</ul>`);

add(14, 'El infinitivo negativo y el complemento negativo', `
<p>El infinitivo se niega con el verbo negativo <b>${t('tm')}</b> «no hacer», que va en infinitivo, seguido del verbo negado en una forma especial: el <b>complemento negativo</b>.</p>
<p><b>Forma del complemento negativo:</b> parece la raíz del verbo, a veces con una terminación ${t('-w')} que casi nunca se escribe: ${t('tm sḏm(w)')} «no oír». En los verbos 3ae inf. aparece a veces con ${t('-w')} o ${t('-y')}: ${t('tm jrj')}.</p>
${x('','rꜣ n tm mwt m wḥm','fórmula para no morir otra vez','Libro de los Muertos 44')}
<p>${t('tm')} + complemento negativo funciona exactamente como un infinitivo positivo: puede ir tras preposición (${t('r tm rdjt')} «para no dar»), llevar sujeto (${t('tm.f sḏm')} «que él no oiga»), etc. El mismo complemento negativo aparece tras el verbo negativo ${t('jmj')} (${t('m sḏm')} «¡no oigas!», tema 16) y tras otras formas de ${t('tm')} (temas 19 y siguientes).</p>`);

add(14, 'El infinitivo complementario', `
<p>Existe una construcción especial en la que un verbo va seguido de un <b>sustantivo verbal del mismo verbo</b>, usado como complemento adverbial, algo así como el español «vivir la vida» o «brillar con brillo». Los egiptólogos lo llaman <b>infinitivo complementario</b>:</p>
${x('','wbn.k wbnt ḫpr.k ḫprt','sales saliendo, te transformas transformándote','himno al sol, Textos de los Ataúdes')}
<p>Siempre termina en ${t('-t')} (${t('wbnt')}, ${t('wnnt')}, ${t('jwt')}, ${t('mst')}…). Es <b>raro</b> en egipcio medio y aparece casi solo en textos religiosos antiguos. Al traducir, se puede usar un gerundio o un adverbio intensivo.</p>`);

/* ===================== TEMA 15 ===================== */
add(15, 'Formas y significados de la construcción pseudoverbal', `
<p>La construcción pseudoverbal es una oración adverbial cuyo predicado es <b>preposición + infinitivo</b>:</p>
${tb(['Forma','Sentido','Ejemplo'],[
[t('ḥr')+' + infinitivo','acción en curso («está haciendo»); con verbos transitivos y la mayoría de intransitivos',t('jw.f ḥr sḏm')+' «está oyendo»'],
[t('m')+' + infinitivo','movimiento en curso; con verbos de movimiento',t('jw.f m jjt')+' «está viniendo»'],
[t('r')+' + infinitivo','futuro, intención, destino',t('jw.f r šmt')+' «irá, va a ir»'],
])}
<p>Equivale a nuestros tiempos progresivos («estaba haciendo», «está haciendo») y al futuro perifrástico («va a hacer»). Como toda oración adverbial, no marca el tiempo: hay que deducir si es presente o pasado por el contexto.</p>`);

add(15, 'Sujetos, tw impersonal y ꜥḥꜥ.n / wn.jn', `
<p><b>Sujetos pronominales:</b> como en las adverbiales, sufijo tras ${t('jw')} (${t('jw.j ḥr jrt')}) y dependiente tras ${t('mk')} y otras partículas (${t('mk wj ḥr sḏr')}).</p>
<p><b>${t('tw')} impersonal:</b> el sufijo ${t('.tw')} significa «uno, se» y funciona como sujeto indeterminado: ${t('jw.tw ḥr ḏd')} «se dice, dicen»; ${t('jw.tw r rdjt n.k')} «se te dará».</p>
<p><b>Tras ${t('ꜥḥꜥ.n')} y ${t('wn.jn')}:</b> en la narración, estas formas de «entonces» seguidas de sujeto + ${t('ḥr')} + infinitivo indican el <b>comienzo de una acción</b> en el pasado: ${t('ꜥḥꜥ.n.f ḥr rmt')} «entonces se puso a llorar». ${t('wn.jn.f ḥr')}… es parecido: «entonces él estaba / se puso a…».</p>`);

add(15, 'Casos especiales: sin infinitivo, negada, subordinada y en preguntas', `
<p><b>Sin infinitivo.</b> ${t('ḥr')} puede introducir directamente una cita, con el «decir» sobrentendido: ${t('ḥr-nb ḥr nb.n pw')} «todo el mundo (decía): ‹Él es nuestro señor›».</p>
<p><b>Negada.</b> Se niega con ${t('nn')} como otras adverbiales: ${t('nn wj ḥr sḏm st')} «no lo estaba oyendo». La negación con ${t('r')} + infinitivo es rara (${t('nn sw r ḫpr')} «no ha de suceder»). Normalmente, para negar estas ideas se usan formas verbales (temas 18–21).</p>
<p><b>En subordinadas:</b></p>
<ul>
<li><b>Adverbiales:</b> tras ${t('jsṯ')} o como circunstancial sin marca: ${t('gm.n.j sw ḥr wnm')} «lo encontré comiendo».</li>
<li><b>Relativas:</b> con ${t('ntj')}: ${t('ntjw ḥr jrt')}… «los que están haciendo…».</li>
<li><b>Sustantivas:</b> con ${t('ntt')}: ${t('rḫ.n.j ntt sw ḥr ḏd')}… «sé que él está diciendo…».</li>
</ul>
<p><b>En preguntas:</b> con ${t('jn jw')}: ${t('jn jw.k ḥr sḏm')} «¿estás escuchando?».</p>`);
/* ===================== TEMA 16 ===================== */
add(16, 'Formas del imperativo', `
<p><b>Formas regulares.</b> El imperativo es la raíz del verbo, sin sujeto:</p>
${tb(['Clase','Imperativo','Ejemplo'],[
['3-lit., 2-lit.','raíz',t('sḏm')+' «¡escucha!», '+t('ḏd')+' «¡di!»'],
['3ae inf.','raíz sin la j débil',t('jr')+' «¡haz!», '+t('mr')+' (raro)'],
['2ae gem.','sin geminar',t('mꜣ')+' «¡mira!»'],
['Causativos','con s-',t('sꜥnḫ')+' «¡haz vivir!»'],
])}
<p><b>Plural.</b> Cuando se dirige a varias personas puede llevar una terminación ${t('-w')} o ${t('-y')} (pocas veces escrita) o los trazos de plural: ${t('sḏmw')} / ${t('sḏm')} «¡escuchad!».</p>
<p><b>Formas especiales:</b></p>
${tb(['Verbo','Imperativo'],[
[t('rdj')+' «dar»',t('jmj')+' «¡da!, ¡haz que!» (también '+t('mj')+' en algunos textos)'],
[t('jwj')+' «venir»',t('mj')+' «¡ven!» (fem. '+t('mj')+', pl. '+t('mj.n')+' o '+t('mjw')+')'],
[t('jnj')+' «traer»',t('jn')+' / '+t('jnj')+' «¡trae!»'],
])}`);

add(16, 'Objeto, sujeto y refuerzo del imperativo; la negación', `
<p><b>Objeto:</b> sigue al imperativo. Si es pronominal, se usa el pronombre <b>dependiente</b>: ${t('sḏm sw')} «¡escúchalo!»; ${t('jmj sw')} «¡ponlo!».</p>
<p><b>Sujeto expreso o refuerzo:</b> el imperativo puede ir seguido de un pronombre dependiente de 2.ª persona como sujeto enfático o reflexivo (${t('jr tw')} «¡actúa tú!», «¡ponte!»), o de la preposición ${t('r')} / ${t('n')} con sufijo, que refuerza la orden: ${t('sḏm r.k')} «¡escucha tú, pues!», ${t('šm n.k')} «¡vete!».</p>
<p><b>Negación:</b> se usa el imperativo del verbo negativo ${t('jmj')}, que tiene la forma ${t('m')}, seguido del <b>complemento negativo</b> del verbo:</p>
${x('','m ḏd grg','¡no digas mentiras!')}
${x('','m snḏ','¡no temas!')}
<p>En plural aparece como ${t('m.n')} o ${t('mjn')}: ${t('m.n snḏ')} «¡no temáis!». Recuerda que esta ${t('m')} no es la preposición ni el interrogativo: se distingue por el contexto (va al comienzo, seguida de un verbo).</p>`);

add(16, 'Las partículas proclíticas', `
<p>Las <b>proclíticas</b> van al comienzo de la oración y la introducen. Las más importantes:</p>
${tb(['Partícula','Sentido','Notas'],[
[t('jw'),'(afirmación)','Tema 10; con sufijo: '+t('jw.f')],
[t('mk')+' / '+t('mṯ')+' / '+t('mṯn'),'mira, he aquí','Varía según el oyente; pron. dependiente'],
[t('jsṯ')+' / '+t('sṯ'),'mientras, cuando','Circunstancial'],
[t('ḥꜣ')+' / '+t('ḥwj'),'¡ojalá!','Deseos irreales o difíciles'],
[t('jn'),'¿acaso?; (también foco: «es X quien…»)','Preguntas y oraciones participiales'],
[t('jr'),'en cuanto a; si','Tematiza: '+t('jr sꜣ.j')+' … «en cuanto a mi hijo…»'],
[t('jḫ'),'entonces, así pues','Con subjuntivo: consecuencia o exhortación'],
[t('ꜥḥꜥ.n')+', '+t('wn.jn'),'entonces','Narración'],
[t('ḫr')+', '+t('kꜣ'),'entonces','Consecuencia; dan origen a '+t('sḏm.ḫr.f')+' y '+t('sḏm.kꜣ.f')],
[t('nḥmn'),'ciertamente','Raro'],
])}`);

add(16, 'Las partículas enclíticas', `
<p>Las <b>enclíticas</b> nunca abren la oración: se colocan detrás de la primera palabra (o del primer grupo). Matizan el sentido, como nuestros «pues», «sin embargo», «en verdad»:</p>
${tb(['Partícula','Sentido aproximado'],[
[t('js'),'(con '+t('n')+': negación nominal; sola: subordinación, «como si», «porque»)'],
[t('jr.f')+' / '+t('r.f'),'pues, entonces, así que (refuerza; muy frecuente en preguntas)'],
[t('grt'),'además, por otra parte, ahora bien'],
[t('swt'),'pero, sin embargo'],
[t('ḥm'),'en verdad, ciertamente; (en preguntas) ¿acaso…?'],
[t('ms'),'en verdad, seguramente'],
[t('tr')+' / '+t('tj'),'(en preguntas) pues, acaso'],
[t('ꜣ'),'(refuerzo) pues, entonces'],
[t('rf'),'(variante de '+t('r.f')+')'],
])}
${x('','jnk swt sš','yo, sin embargo, soy escriba')}
${x('','ptr r.f st','¿qué es eso, pues?')}
<p>Las enclíticas son difíciles de traducir con exactitud; muchas veces basta con un matiz de entonación o con dejarlas sin traducir.</p>`);

add(16, 'Las interjecciones', `
<p>Las interjecciones expresan emociones o llamadas:</p>
${tb(['Interjección','Sentido'],[
[t('j'),'¡oh! (vocativo: '+t('j nṯrw')+' «¡oh dioses!»)'],
[t('ḥꜣ'),'¡ay!, ¡ojalá!'],
[t('jhy')+' / '+t('jhj'),'¡ay! (lamento), ¡hurra! (alegría)'],
[t('wj'),'¡qué…! (detrás de adjetivos, tema 7)'],
[t('jnḏ ḥr.k'),'¡salve! (saludo a dioses y reyes)'],
[t('mj r.k'),'¡ea!, ¡vamos!'],
])}
<p>El vocativo puede ir también sin interjección: ${t('nb.j')} «¡mi señor!».</p>`);

/* ===================== TEMA 17 ===================== */
add(17, 'Las terminaciones del estativo y su raíz', `
${tb(['Persona','Terminación','Ejemplo con '+t('ꜥnḫ')],[
['1.ª sing.',t('-kw')+' (a veces '+t('-kj')+', '+t('-k')+')',t('ꜥnḫ.kw')],
['2.ª sing. (m. y f.)',t('-tj')+' / '+t('-tw'),t('ꜥnḫ.tj')],
['3.ª masc. sing.',t('-w')+' (casi nunca escrita) o nada',t('ꜥnḫ')+' / '+t('ꜥnḫ.w')],
['3.ª fem. sing.',t('-tj')+' / '+t('-t'),t('ꜥnḫ.tj')],
['1.ª pl.',t('-wjn')+' / '+t('-wn'),t('ꜥnḫ.wjn')],
['2.ª pl.',t('-tjwn'),t('ꜥnḫ.tjwn')],
['3.ª pl. (m. y f.)',t('-w')+' (o nada); fem. a veces '+t('-tj'),t('ꜥnḫ.w')],
['Dual (raro)',t('-wj')+' / '+t('-tj'),'—'],
])}
<p>Estas terminaciones no son pronombres sufijos: forman parte de la forma verbal y concuerdan con el sujeto. El estativo de 2.ª y 3.ª femenina coinciden (${t('-tj')}).</p>
<p><b>La raíz:</b> el estativo usa la raíz básica, <b>sin geminar</b> y, en los 3ae inf., sin la j débil (aunque a veces se escribe): ${t('mꜣ.kw')} «visto», ${t('jr.w')} «hecho». Los verbos de movimiento y de estado son los que más lo usan.</p>`);

add(17, 'El sujeto y el significado del estativo', `
<p>El estativo expresa un <b>estado</b>. Su sujeto va <b>delante</b> (un sustantivo o un pronombre según la partícula: ${t('jw.f ꜥnḫ')}, ${t('mk sw ꜥnḫ')}, ${t('zj ꜥnḫ')}):</p>
<ul>
<li>Con verbos <b>intransitivos</b>, el estado en que se encuentra el sujeto: ${t('jw.f ḥms')} «está sentado», ${t('jw.j jj.kw')} «he venido» (= «estoy aquí»).</li>
<li>Con verbos <b>transitivos</b>, el estado que resulta de la acción, con sentido <b>pasivo</b>: ${t('jw pr pn jr.w')} «esta casa está hecha»; ${t('rwtj ḫtm.w')} «la puerta está sellada».</li>
<li>Con <b>verbos adjetivales</b>, una cualidad presentada como estado transitorio: ${t('jw.f nfr.w')} «está bien»; ${t('nfr sw')} (adjetival) «es bueno» frente a ${t('jw.f nfr.w')} «se encuentra bien».</li>
<li>${t('rḫ.kw')} «sé» (literalmente «estoy enterado»): el estativo de ${t('rḫ')} equivale a nuestro presente «saber».</li>
</ul>`);

add(17, 'SUJETO + estativo: pasado, cláusulas y negación', `
<p><b>Como tiempo pasado.</b> Con verbos intransitivos, sobre todo de movimiento, SUJETO + estativo funciona como un pasado o un perfecto: ${t('jw.f jj')} «ha venido, vino». Es la forma normal del pasado intransitivo; los transitivos usan el perfecto ${t('sḏm.n.f')} (tema 18).</p>
<p><b>En oraciones principales:</b> con ${t('jw')}, ${t('mk')} o ${t('ꜥḥꜥ.n')}: ${t('ꜥḥꜥ.n.j rdj.kw r jw')} «entonces fui arrojado a una isla».</p>
<p><b>En subordinadas:</b></p>
<ul>
<li><b>Relativas:</b> con ${t('ntj')}: ${t('ntj jj')} «el que ha venido».</li>
<li><b>Sustantivas:</b> con ${t('ntt')}: ${t('rḫ.n.j ntt sw jj')} «sé que ha venido».</li>
<li><b>Adverbiales y de resultado:</b> circunstanciales sin marca: ${t('gm.n.j sw sḏr')} «lo encontré acostado»; ${t('ḏꜥ pr.w jw.n m wꜣḏ-wr')} «se levantó una tormenta estando nosotros en el mar».</li>
<li><b>En preguntas:</b> con ${t('jn jw')}: ${t('jn jw.k jj.tj')} «¿has venido?».</li>
</ul>
<p><b>Negación:</b> con ${t('nn')} + sujeto + estativo, poco frecuente.</p>`);

add(17, 'El estativo sin sujeto delante', `
<p>A veces el estativo aparece <b>sin sujeto expreso</b> delante:</p>
<ul>
<li><b>Narración en 1.ª persona:</b> ${t('šm.kw r bjꜣ')} «fui a las minas» (El náufrago). La terminación ${t('-kw')} indica el sujeto.</li>
<li><b>Deseos</b> (sobre todo de 2.ª persona): ${t('ꜥnḫ.tj')} «¡que vivas!»; tras el nombre del rey: ${t('ꜥnḫ wḏꜣ snb')} «¡vida, prosperidad, salud!» (estativos: «vivo, próspero, sano»).</li>
<li><b>Relativas sin ${t('ntj')}</b> tras un antecedente indeterminado: ${t('zj jj')} «un hombre que ha venido».</li>
<li><b>Circunstanciales</b> que se refieren al objeto o al sujeto de la principal: ${t('jr.n.j hrw 3 wꜥ.kw')} «pasé tres días solo».</li>
<li><b>Epítetos:</b> ${t('mꜣꜥ-ḫrw')} «justo de voz, justificado» tras el nombre de un difunto; ${t('dj ꜥnḫ')} «dotado de vida».</li>
</ul>`);

add(17, 'Resumen del estativo', `
${tb(['Uso','Ejemplo','Traducción'],[
['Estado (intransitivo)',t('jw.f ḥms')+'','está sentado'],
['Estado pasivo (transitivo)',t('jw pr jr.w'),'la casa está hecha'],
['Pasado intransitivo',t('jw.j jj.kw'),'he venido'],
['Narración 1.ª persona',t('šm.kw'),'fui'],
['Deseo',t('ꜥnḫ.tj'),'¡que vivas!'],
['Circunstancial',t('gm.n.j sw sḏr'),'lo encontré acostado'],
['Epíteto',t('mꜣꜥ-ḫrw'),'justificado'],
])}`);

/* ===================== TEMA 18 ===================== */
add(18, 'Forma y orden de palabras del perfecto', `
<p><b>Forma:</b> raíz + ${t('n')} + sujeto. La raíz es la básica: sin geminar (${t('mꜣ.n.f')}) y sin la j débil en los 3ae inf. (${t('jr.n.f')}, ${t('mr.n.f')}). ${t('rdj')} conserva la forma completa (${t('rdj.n.f')}).</p>
<p><b>Sujeto nominal:</b> va detrás de ${t('n')}: ${t('sḏm.n zj')} «el hombre oyó».</p>
<p><b>Orden de palabras:</b> verbo + sujeto + objeto + complementos. Pero un pronombre <b>dependiente objeto</b> se coloca <b>antes</b> de un sujeto nominal: ${t('rdj.n sw ḥm.f')} «su majestad lo colocó». Y un dativo pronominal (${t('n.f')}) también tiende a adelantarse: ${t('rdj.n n.j ḥm.f pr')} «su majestad me dio una casa».</p>
<p><b>Sujeto omitido:</b> el sufijo ${t('.j')} «yo» a menudo no se escribe: ${t('jr.n(.j)')} «hice».</p>
<p><b>Con ${t('.tw')}:</b> ${t('sḏm.n.tw')} «se oyó», «uno oyó» (impersonal / pasivo).</p>`);

add(18, 'Los significados del perfecto', `
<ul>
<li><b>Acción completada</b> respecto al momento de hablar (pretérito perfecto español): ${t('jw jr.n.j mꜣꜥt')} «he hecho la justicia».</li>
<li><b>Pasado narrativo</b> (pretérito indefinido): con ${t('jw')} o ${t('ꜥḥꜥ.n')}: ${t('ꜥḥꜥ.n ḏd.n.f')} «entonces dijo».</li>
<li><b>Hecho contrario a la realidad</b> («habría…»), sobre todo en oraciones condicionales irreales: ${t('jr ḫpr.n.f')}… «si hubiera sucedido…».</li>
<li><b>${t('rḫ.n.f')}</b> «sabe» (literalmente «ha llegado a saber»): presente de estado.</li>
</ul>`);

add(18, 'El perfecto en oraciones subordinadas', `
<ul>
<li><b>Adverbiales:</b> sin marca (circunstanciales) expresa una acción anterior: «habiendo hecho», «después de hacer»: ${t('jj.n.f')}… ${t('ḏd.n.f')}… «habiendo llegado, dijo». También tras ${t('jsṯ')} o preposiciones.</li>
<li><b>Relativas:</b> sin ${t('ntj')} tras antecedente indeterminado: ${t('zj jr.n.f')}… «un hombre que hizo…». (Con antecedente determinado se usan las formas relativas, tema 24.)</li>
<li><b>Sustantivas:</b> con ${t('ntt')} o sin marca tras verbos: ${t('rḫ.n.j ntt jr.n.k st')}… «sé que lo has hecho».</li>
<li><b>Preguntas:</b> ${t('jn jw jr.n.k')} «¿lo has hecho?».</li>
</ul>`);

add(18, 'El perfecto negado: n sḏm.n.f', `
<p>Al negar el perfecto con ${t('n')}, cambia el sentido: ${t('n sḏm.n.f')} <b>no</b> significa «no oyó», sino «<b>no oye</b>, no puede oír», «nunca oye». Expresa una incapacidad o una negación general. (El pasado negativo «no oyó» es ${t('n sḏm.f')}, tema 20.)</p>
${x('','n rḫ.n.j sw','no lo conozco')}
${x('','n ꜥr.n.j jr.f','no puedo llegar hasta él')}
<p>También se usa en subordinadas: <b>adverbiales</b> (${t('n sḏm.n.f')} «sin que él oiga»), <b>sustantivas</b> y <b>relativas</b> (tras antecedente indeterminado: «un hombre que no puede…»).</p>`);

/* ===================== TEMA 19 ===================== */
add(19, 'Forma y orden de palabras del subjuntivo', `
<p><b>Forma:</b> raíz básica + sujeto, sin geminar. Algunos verbos tienen formas propias:</p>
${tb(['Verbo','Subjuntivo'],[
['3-lit.',t('sḏm.f')],
['3ae inf.',t('jrj.f')+' (con la j a veces escrita '+t('jry.f')+'), '+t('mrj.f')],
['2ae gem.',t('mꜣ.f')+' (sin geminar)'],
[t('rdj'),t('dj.f')],
[t('jwj'),t('jw.f')+' / '+t('jj.f')],
[t('jnj'),t('jn.f')],
])}
<p><b>Orden:</b> como el perfecto: verbo + sujeto + objeto + complementos, con los pronombres dependientes y dativos adelantados. Con ${t('.tw')}: ${t('sḏm.tw.f')} «que se le oiga».</p>`);

add(19, 'Usos del subjuntivo', `
<p>El subjuntivo expresa una acción <b>deseada, ordenada, posible o futura</b>, no un hecho:</p>
<ul>
<li><b>Oración principal:</b> deseo, mandato suave o exhortación: ${t('dj.k n.j t')} «¡que me des pan!»; ${t('ꜥnḫ.k')} «¡que vivas!».</li>
<li><b>Tras partículas:</b> ${t('ḥꜣ')} «¡ojalá!» (${t('ḥꜣ mꜣ.j sw')}), ${t('jḫ')} «así pues, que…», ${t('kꜣ')} «entonces».</li>
<li><b>Oraciones condicionales:</b> a veces la apódosis va en subjuntivo; y en ciertos textos el subjuntivo sin marca expresa una condición: «(si) dices…».</li>
<li><b>Adverbiales de finalidad:</b> sin marca, «para que»: ${t('jj.n.j sbꜣ.j sw')} «vine para enseñarle»; también tras preposiciones como ${t('r')}, ${t('n-mrwt')} «a fin de que».</li>
<li><b>Sustantivas:</b> tras verbos de voluntad, orden o permiso: ${t('wḏ.n ḥm.j jrj.k')}… «mi majestad ordenó que hicieras…».</li>
<li><b>Tras ${t('rdj')}:</b> la construcción causativa más común: ${t('rdj.n.f ꜥq.j')} «hizo que yo entrara»; ${t('jmj jj.f')} «¡haz que venga!».</li>
<li><b>Preguntas deliberativas:</b> ${t('jn jrj.j')}… «¿he de hacer…?».</li>
</ul>`);

add(19, 'El subjuntivo negado y el subjuntivo de wnn', `
<p><b>Negación:</b></p>
<ul>
<li>Con el verbo negativo ${t('jmj')} en subjuntivo + complemento negativo: ${t('jm.k sḏm')} «¡que no oigas!, no oigas».</li>
<li>Con ${t('tm')} en subjuntivo + complemento negativo, sobre todo en subordinadas: ${t('r tm.f sḏm')}… «para que no oiga».</li>
</ul>
<p><b>El subjuntivo de ${t('wnn')}:</b> ${t('wn.f')}. Permite poner en subjuntivo una oración no verbal: ${t('wn.k m nb')}… «que seas un señor…»; ${t('rdj.n.f wn.j m sš')} «hizo que yo fuera escriba».</p>`);

/* ===================== TEMA 20 ===================== */
add(20, 'Formas del perfectivo y del imperfectivo', `
<p>Ambos son formas ${t('sḏm.f')}, pero se distinguen en los verbos débiles:</p>
${tb(['Clase','Perfectivo','Imperfectivo'],[
['3-lit.',t('sḏm.f'),t('sḏm.f')+' (iguales en la escritura)'],
['2ae gem.',t('mꜣ.f'),t('mꜣꜣ.f')+' (geminado)'],
['3ae inf.',t('jr.f'),t('jrr.f')+' (geminado)'],
[t('rdj'),t('rdj.f'),t('dd.f')],
[t('jwj'),t('jw.f')+' / '+t('jj.f'),t('jw.f')],
])}
<p>El <b>perfectivo</b> ve la acción como un todo, normalmente pasada; el <b>imperfectivo</b>, como algo repetido, habitual, general o en curso.</p>`);

add(20, 'Usos del perfectivo', `
<ul>
<li><b>Oraciones principales:</b> en egipcio medio es poco frecuente como pasado afirmativo (se prefiere el perfecto), salvo en algunos textos arcaizantes y en ${t('ꜥr nṯr r ꜣḫt.f')} y frases similares.</li>
<li><b>Negado: ${t('n sḏm.f')}</b> es el <b>pasado negativo</b> normal: ${t('n mꜣ.j sw')} «no lo vi»; ${t('n jr.j jsft')} «no hice el mal».</li>
<li><b>Subordinadas:</b> tras preposiciones de tiempo: ${t('ḏr sḏm.f')} «desde que oyó», ${t('m-ḫt sḏm.f')} «después de que oyó».</li>
<li><b>Perfectivo de ${t('wnn')}:</b> ${t('wn.f')} «él era, existía» (pasado de una oración no verbal).</li>
</ul>`);

add(20, 'Usos del imperfectivo', `
<ul>
<li><b>Oraciones principales:</b> afirmaciones generales o habituales, a menudo en textos de enseñanza y en himnos: ${t('mrr.f mꜣꜥt')} «él ama la verdad».</li>
<li><b>SUJETO + imperfectivo:</b> un sujeto nominal delante y el verbo con sufijo que lo repite: ${t('rꜥ wbn.f m pt')} «Ra sale en el cielo». Muy común con partículas: ${t('mk')}, ${t('jsṯ')}, ${t('jw')} + sujeto + ${t('sḏm.f')}.</li>
<li><b>Adverbiales:</b> circunstanciales de acción simultánea o habitual: «mientras hace», «haciendo».</li>
<li><b>Leyendas de escenas:</b> el imperfectivo describe lo que hacen los personajes: ${t('mꜣꜣ jḫt')}… «contemplando las cosas…» (a menudo en infinitivo o participio también).</li>
<li><b>Sustantivas</b> tras verbos y preposiciones.</li>
<li><b>Relativas</b> sin ${t('ntj')} tras antecedente indeterminado: «un hombre que hace (habitualmente)…».</li>
<li><b>Negado:</b> ${t('n sḏm.n.f')} sustituye normalmente al imperfectivo negativo; ${t('nn')} + imperfectivo es raro.</li>
<li><b>Imperfectivo de ${t('wnn')}:</b> ${t('wnn.f')} «él es, suele estar; estará»: se usa cuando una oración no verbal necesita una forma verbal (en subordinadas, en oraciones enfáticas, con valor de futuro o habitual).</li>
<li><b>Preguntas:</b> «¿qué hace?» con interrogativo (a menudo enfáticas, tema 25).</li>
</ul>`);

add(20, 'wnn: perfectivo e imperfectivo, resumen', `
${tb(['Forma','Sentido','Ejemplo'],[
[t('wn.f')+' (perfectivo)','era, existía, estuvo',t('wn.f m sš')+' «era escriba»'],
[t('wnn.f')+' (imperfectivo)','es, suele ser, será',t('wnn.f m pr.f')+' «estará en su casa»'],
[t('wn.f')+' (subjuntivo)','que sea',t('rdj wn.f')+' «hacer que sea»'],
])}`);

/* ===================== TEMA 21 ===================== */
add(21, 'El prospectivo: forma y sentido', `
<p><b>Forma:</b> raíz básica + sujeto; en algunos verbos lleva una terminación ${t('-y')} o ${t('-w')} (${t('jry.f')}, ${t('sḏmw.f')}) que suele omitirse. A diferencia del subjuntivo, ${t('rdj')} conserva la ${t('r')} (${t('rdj.f')}) y ${t('mꜣꜣ')} puede aparecer geminado.</p>
<p><b>Sentido:</b> una acción <b>futura</b> («hará»), también con matiz de deseo o de intención. Se usa:</p>
<ul>
<li>en oraciones principales: ${t('ḏd.j n.k')} «te diré»;</li>
<li><b>negado con ${t('nn')}:</b> ${t('nn sḏm.f')} «no oirá» (la negación normal del futuro): ${t('nn mwt.k')} «no morirás»;</li>
<li>en subordinadas sustantivas y tras preposiciones como ${t('r')} «hasta que»;</li>
<li>el prospectivo de ${t('wnn')}: ${t('wnn.f')} / ${t('wn.f')} «será».</li>
</ul>
<p>En la escritura, el prospectivo y el subjuntivo suelen ser idénticos en los verbos fuertes; se distinguen por el contexto y por los verbos débiles.</p>`);

add(21, 'El pasivo sḏm.f: forma, sujeto y sentido', `
<p><b>Forma:</b> raíz básica sin sufijo de agente; algunos verbos muestran una terminación ${t('-w')} o ${t('-y')}: ${t('jrj')} / ${t('jry')} «fue hecho», ${t('rdj')} «fue dado», ${t('gm')} / ${t('gmy')} «fue encontrado».</p>
<p><b>Sujeto:</b> el sujeto (lo que recibe la acción) va detrás: ${t('rdj n.j pr')} «se me dio una casa» (el dativo pronominal se adelanta). Si es pronominal, puede ser un sufijo (${t('rdj.f')} «él fue puesto») o, más raramente, un dependiente.</p>
<p><b>Sentido:</b> pasado pasivo «fue hecho». Para un pasivo de otros tiempos se usan formas con ${t('.tw')} (${t('sḏm.tw.f')} «es oído, será oído»).</p>

/* ---------- Ejercicios ---------- */
function expandExercises(l){
  const out = [];
  l.ex.forEach(e => {
    if (e.t === 'signs'){
      const pool = SIGNS.filter(s => (e.kinds||['uni']).includes(s.k) && (s.l||2) <= l.n && s.s);
      shuffle(pool).slice(0, e.count||8).forEach(sg => {
        const wrong = shuffle(pool.filter(x => x.s !== sg.s)).slice(0,3).map(x => x.s);
        const opts = shuffle([sg.s, ...wrong]);
        out.push({ t:'mc', q:'¿Qué valor fonético tiene este signo?', h:sg.ch, o:opts.map(o=>'<span class="tr">'+esc(o)+'</span>'), a:opts.indexOf(sg.s), e:`${sg.ch} (${sg.c}): ${sg.m}.`, auto:true });
      });
    } else out.push(e);
  });
  return out;
}
function tabExercises(body, l, st){
  const intro = () => {
    body.innerHTML = `<div class="card" style="text-align:center;padding:34px">
      <div class="hg big">𓏞𓏛</div>
      <h2>Ejercicios de la lección ${l.n}</h2>
      <p>${l.ex.length} bloques de ejercicios. Necesitas un <b>70 %</b> para superar la lección${l.n<LESSONS.length?' y desbloquear la siguiente':''}.</p>
      ${st.attempts?`<p class="muted">Mejor resultado: <b>${st.best}%</b> · intentos: ${st.attempts}</p>`:''}
      <p class="muted" style="font-size:15px">En la transliteración puedes usar el teclado especial o la convención ASCII: <kbd>A</kbd>=ꜣ <kbd>a</kbd>=ꜥ <kbd>i</kbd>=j <kbd>H</kbd>=ḥ <kbd>x</kbd>=ḫ <kbd>X</kbd>=ẖ <kbd>S</kbd>=š <kbd>T</kbd>=ṯ <kbd>D</kbd>=ḏ. Los espacios, puntos y guiones no cuentan.</p>
      <button class="btn gold" id="start">${st.attempts?'Repetir ejercicios':'Empezar'}</button></div>`;
    $('#start', body).onclick = () => runQuiz(body, expandExercises(l), res => finish(res));
  };
  const finish = ({ score, total, wrongs }) => {
    const pct = Math.round(score/total*100);
    st.attempts = (st.attempts||0) + 1;
    const first = !st.done && pct/100 >= PASS;
    if (pct > (st.best||0)) st.best = pct;
    if (pct/100 >= PASS) st.done = true;
    addXP(Math.round(score*2) + (first ? 30 : 0));
    const passed = pct/100 >= PASS;
    body.innerHTML = `<div class="card result fadein">
      <div class="eyebrow">${passed?'¡Lección superada!':'Sigue practicando'}</div>
      <div class="score">${pct}%</div><p>${Math.round(score*10)/10} de ${total} correctas</p>
      ${passed ? `<div class="hg big" style="color:var(--gold)">𓋹𓊽𓋴</div><p>ꜥnḫ wḏꜣ snb — «¡vida, prosperidad, salud!»</p>` : `<p>Necesitas un 70 %. Repasa la teoría de los puntos que fallaste y vuelve a intentarlo.</p>`}
      ${wrongs.length?`<details style="text-align:left;margin:16px 0"><summary><b>Revisar los ${wrongs.length} fallos</b></summary>${wrongs.map(w=>`<div class="ex">${w}</div>`).join('')}</details>`:''}
      <div class="row" style="justify-content:center">
        <button class="btn ghost" id="again">Repetir</button>
        ${passed && l.n < LESSONS.length ? `<a class="btn gold" href="#leccion-${l.n+1}">Lección ${l.n+1} →</a>` : `<a class="btn" href="#leccion-${l.n}-teoria">Repasar teoría</a>`}
      </div></div>`;
    $('#again', body).onclick = intro;
    renderNav(route());
  };
  intro();
}
function kbHTML(){ return `<div class="kb">${TR_KEYS.map(k=>`<button type="button" data-k="${k}">${k}</button>`).join('')}</div>`; }
function wireKb(root, input){
  $$('.kb button', root).forEach(b => b.onclick = () => {
    const k = b.dataset.k; const s = input.selectionStart ?? input.value.length, e = input.selectionEnd ?? input.value.length;
    input.value = input.value.slice(0,s) + k + input.value.slice(e); input.focus(); input.setSelectionRange(s+k.length, s+k.length);
  });
}
function glossHTML(g){
  if (!g) return '';
  return `<div class="gloss">${g.split('|').map(p => { const [a,b] = p.split('=').map(x=>x.trim()); return `<span><span class="tr">${esc(a)}</span>${esc(b||'')}</span>`; }).join('')}</div>`;
}
function runQuiz(body, items, done){
  let idx = 0, score = 0; const wrongs = [];
  const order = items; // orden pedagógico
  const total = order.length;
  const head = () => `<div class="qhead"><span class="muted" style="font-weight:600">${idx+1} / ${total}</span><div class="bar" style="flex:1"><i style="width:${idx/total*100}%"></i></div><span class="pill">${Math.round(score*10)/10} ✓</span></div>`;
  const next = () => { idx++; if (idx >= total) done({ score, total, wrongs }); else draw(); };
  const draw = () => {
    const e = order[idx];
    window.__meduCur = e;
    let html = `<div class="quiz fadein">${head()}<div class="card qbox">`;
    if (e.t === 'mc'){
      html += `<div class="qprompt">${e.q}</div>${e.h?`<div class="qhg hg big">${e.h}</div>`:''}<div class="opts">${e.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>`;
    } else if (e.t === 'tl'){
      html += `<div class="qprompt">${e.q || 'Translitera:'}</div><div class="qhg hg big">${e.h}</div>
        <input class="inp" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escribe la transliteración…">${kbHTML()}
        <div class="row" style="justify-content:center;margin-top:8px"><button class="btn ghost" id="skip">No lo sé</button><button class="btn" id="chk">Comprobar</button></div>`;
    } else if (e.t === 'tr'){
      html += `<div class="qprompt">${e.q || 'Traduce al español:'}</div><div class="qhg hg big">${e.h}</div>
        <button class="btn ghost sm" id="showtl" style="margin-bottom:10px">Ver transliteración</button><div id="tlhint" class="tr" style="display:none;font-size:20px;margin-bottom:10px">${esc(e.l||'')}</div>
        <textarea class="inp" id="ans" placeholder="Escribe tu traducción…"></textarea>
        <div class="row" style="justify-content:center;margin-top:10px"><button class="btn ghost" id="skip">No lo sé</button><button class="btn" id="chk">Comprobar</button></div>`;
    }
    html += `<div id="fb"></div></div></div>`;
    body.innerHTML = html;
    const fb = $('#fb', body);
    const after = (ok, inner, partial) => {
      const credit = ok ? 1 : (partial || 0);
      score += credit;
      if (credit < 1) wrongs.push(inner);
      fb.innerHTML = `<div class="feedback ${ok?'ok':partial?'mid':'bad'} fadein">${inner}<div class="row" style="justify-content:flex-end;margin-top:12px">
        ${!ok && e.t!=='mc' ? `<button class="btn ghost sm" id="override">Yo lo tenía bien</button>`:''}<button class="btn" id="nx">${idx+1<total?'Siguiente →':'Ver resultado'}</button></div></div>`;
      $('#nx', body).onclick = next; $('#nx', body).focus();
      const ov = $('#override', body);
      if (ov) ov.onclick = () => { score += (1 - credit); wrongs.pop(); ov.remove(); toast('Anotado como correcto'); };
    };
    if (e.t === 'mc'){
      $$('.opt', body).forEach(b => b.onclick = () => {
        const i = +b.dataset.i; const ok = i === e.a;
        $$('.opt', body).forEach(x => { x.disabled = true; if (+x.dataset.i === e.a) x.classList.add('right'); });
        if (!ok) b.classList.add('wrong');
        after(ok, `<b class="t">${ok?'¡Correcto!':'No exactamente'}</b>${e.h?`<span class="hg">${e.h}</span> → `:''}${e.o[e.a]}${e.e?`<p style="margin:.4em 0 0">${e.e}</p>`:''}`);
      });
    } else {
      const inp = $('#ans', body); inp.focus();
      if (e.t === 'tl') wireKb(body, inp);
      const sh = $('#showtl', body); if (sh) sh.onclick = () => { $('#tlhint', body).style.display = 'block'; sh.remove(); };
      const check = (skip) => {
        $('#chk', body).disabled = true; $('#skip', body).disabled = true; inp.disabled = true;
        if (e.t === 'tl'){
          const ok = !skip && trMatch(inp.value, e.a);
          const main = [].concat(e.a)[0];
          after(ok, `<b class="t">${ok?'¡Correcto!':'Respuesta:'}</b><span class="tr" style="font-size:22px">${esc(main)}</span>${e.m?` — <span class="es">«${esc(e.m)}»</span>`:''}${e.e?`<p style="margin:.4em 0 0">${e.e}</p>`:''}`);
        } else {
          const miss = skip ? (e.k||[]).map(g=>g[0]) : keyCheck(inp.value, e.k);
          const nk = (e.k||[]).length;
          const ok = !skip && miss.length === 0 && inp.value.trim().length > 0;
          const partial = (!ok && !skip && nk) ? Math.max(0, (nk - miss.length) / nk) * 0.5 : 0;
          after(ok, `<b class="t">${ok?'¡Muy bien!':partial?'Casi':'Traducción propuesta'}</b>
            <div class="tr" style="font-size:19px">${esc(e.l||'')}</div><div style="font-size:18px;margin:4px 0">«${esc(e.a)}»</div>
            ${glossHTML(e.g)}${!ok && !skip && miss.length ? `<p class="muted" style="margin:.5em 0 0;font-size:14px">Faltaba en tu respuesta alguna idea como: ${miss.map(x=>'«'+esc(x)+'»').join(', ')}</p>`:''}${e.e?`<p style="margin:.4em 0 0">${e.e}</p>`:''}`, partial);
        }
      };
      $('#chk', body).onclick = () => check(false);
      $('#skip', body).onclick = () => check(true);
      inp.addEventListener('keydown', ev => { if (ev.key === 'Enter' && (e.t === 'tl' || ev.ctrlKey || ev.metaKey)){ ev.preventDefault(); if (!$('#chk', body).disabled) check(false); else { const nx = $('#nx', body); if (nx) nx.click(); } } });
    }
  };
  draw();
}

function viewReview(m){
  const { due, fresh, total } = dueCards();
  const queue = shuffle(due).concat(fresh);
  const learned = Object.keys(S.srs).length;
  if (!total){
    m.innerHTML = `<div class="eyebrow">Repaso espaciado</div><h1>Repaso</h1><div class="card"><p>Aún no tienes fichas. Abre la <a href="#leccion-1">lección 1</a>: en cuanto empieces a leerla, sus signos y su vocabulario aparecerán aquí.</p></div>`; return;
  }
  m.innerHTML = `<div class="eyebrow">Repaso espaciado</div><h1>Repaso</h1>
   <p class="lead">Las fichas vuelven justo cuando estás a punto de olvidarlas. ${learned} de ${total} fichas iniciadas.</p>
   <div class="row"><span class="pill">${due.length} pendientes</span><span class="pill cur">${fresh.length} nuevas hoy</span><span class="spacer"></span><a class="btn ghost sm" href="#practica">Práctica libre de signos</a></div>
   <div id="fl" style="margin-top:20px"></div>`;
  const fl = $('#fl');
  let k = 0;
  let keyHandler = null;
  const setKey = fn => { if (keyHandler) document.removeEventListener('keydown', keyHandler); keyHandler = fn; if (fn) document.addEventListener('keydown', fn); };
  cleanup = () => setKey(null);
  const finishView = () => { setKey(null); fl.innerHTML = `<div class="card" style="text-align:center;padding:40px"><div class="hg huge" style="color:var(--gold)">𓇳</div><h2>¡Repaso del día completado!</h2><p>Vuelve mañana para mantener la racha. Mientras tanto, puedes seguir con la práctica libre.</p><div class="row" style="justify-content:center"><a class="btn" href="#practica">Práctica libre</a><a class="btn gold" href="#leccion-${currentLesson()}">Seguir con la lección ${currentLesson()}</a></div></div>`; renderNav(route()); };
  if (!queue.length){ finishView(); return; }
  const draw = () => {
    if (k >= queue.length){ finishView(); return; }
    const c = queue[k]; let flipped = false;
    let front, back;
    if (c.kind === 'sign'){
      front = `<div class="eyebrow">Signo · ¿qué valor tiene?</div><div class="hg huge">${c.sg.ch}</div>`;
      back = `<div class="hg big">${c.sg.ch}</div>${c.sg.s?`<div class="tr" style="font-size:28px">${esc(c.sg.s)}</div>`:''}<div><span class="pill">${KIND[c.sg.k]||''}</span> <span class="pill">${c.sg.c}</span></div><div class="es">${esc(c.sg.m)}</div>`;
    } else {
      front = `<div class="eyebrow">Vocabulario · lección ${c.n}</div><div class="hg huge" style="font-size:calc(4em * var(--hg-scale))">${c.v[0]}</div>`;
      back = `<div class="hg big">${c.v[0]}</div><div class="tr" style="font-size:28px">${esc(c.v[1])}</div><div class="es" style="font-size:20px">${esc(c.v[2])}</div>`;
    }
    const isNew = !S.srs[c.id];
    fl.innerHTML = `<div class="flash fadein"><div class="row" style="margin-bottom:8px"><span class="muted">${k+1} / ${queue.length}</span><span class="spacer"></span>${isNew?'<span class="pill cur">nueva</span>':''}</div>
      <div class="card fcard" id="fc">${front}<div class="hint">Pulsa la ficha o la barra espaciadora para darle la vuelta</div></div><div id="gr"></div></div>`;
    const flip = () => {
      if (flipped) return; flipped = true;
      $('#fc').innerHTML = back;
      const box = (S.srs[c.id]||{box:0}).box;
      const lab = b => { const d = BOX_DAYS[Math.min(BOX_DAYS.length-1,b)]; return d<1?'<1 día':d+' d'; };
      $('#gr').innerHTML = `<div class="grades">
        <button style="background:var(--red)" data-g="0">Otra vez<small>1 min</small></button>
        <button style="background:#b9762a" data-g="1">Difícil<small>${lab(Math.max(1,box))}</small></button>
        <button style="background:var(--green)" data-g="2">Bien<small>${lab(box+1)}</small></button>
        <button style="background:var(--lapis-2)" data-g="3">Fácil<small>${lab(box+2)}</small></button></div>`;
      $$('#gr button').forEach(b => b.onclick = () => rate(+b.dataset.g));
    };
    const rate = g => { grade(c.id, g); addXP(1); if (g === 0) queue.push(c); k++; draw(); };
    $('#fc').onclick = flip;
    const key = ev => { if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'TEXTAREA') return; if (ev.key === ' '){ ev.preventDefault(); flip(); } else if (flipped && ['1','2','3','4'].includes(ev.key)) rate(+ev.key - 1); };
    setKey(key);
  };
  draw();
}

  };
  $('#rst').onclick = () => confirmBox('Se borrará todo tu progreso, también el guardado en tu cuenta. No se puede deshacer.', 'Borrar todo', () => { const th = S.settings; S = defaultState(); S.settings.theme = th.theme; save(); applySettings(); toast('Progreso borrado'); go('inicio'); });
}

/* ---------- Arranque ---------- */
const local = loadLocal();
if (local) S = mergeDefaults(local);
applySettings();
render();
initRemote();
window.__medu = { get state(){ return S; }, canonTr, trMatch, keyCheck };
})();
</script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medu Netjer · Curso de egipcio medio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Sans+Egyptian+Hieroglyphs&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --papyrus:#f4ecdb; --papyrus-2:#ebe0c8; --card:#fffaf0; --ink:#2a2118; --ink-2:#5b4d3d; --muted:#8a7a66;
  --lapis:#1f3b6f; --lapis-2:#2c5096; --gold:#b8862b; --gold-2:#d9a944; --red:#a3402a; --green:#3f7a4a; --turq:#2f8a8a;
  --line:#dccfb4; --shadow:0 1px 2px rgba(60,40,10,.06),0 6px 20px rgba(60,40,10,.07);
  --radius:14px; --hg-scale:1;
  --f-head:'Cormorant Garamond',Georgia,serif; --f-body:'Source Sans 3',system-ui,sans-serif;
  --f-tr:'Gentium Book Plus','Gentium Plus','Noto Serif','Times New Roman',serif;
  --f-hg:'Noto Sans Egyptian Hieroglyphs','Segoe UI Historic','Aegyptus','NewGardiner',sans-serif;
}
[data-theme=dark]{
  --papyrus:#17140f; --papyrus-2:#211c15; --card:#221d16; --ink:#efe5d2; --ink-2:#cdbfa6; --muted:#9a8b74;
  --lapis:#8fb0ec; --lapis-2:#a9c3f3; --gold:#e0b456; --gold-2:#f0c96e; --red:#e4876f; --green:#7fc28b; --turq:#6cc7c7;
  --line:#3a3226; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--papyrus);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;
  background-image:radial-gradient(rgba(184,134,43,.06) 1px,transparent 1px);background-size:22px 22px;min-height:100vh}
a{color:var(--lapis-2)}
button{font-family:inherit;font-size:inherit;cursor:pointer}
.hg{font-family:var(--f-hg);font-size:calc(1.7em * var(--hg-scale));line-height:1.25;letter-spacing:.02em;color:var(--ink);font-weight:400;white-space:normal;word-break:break-all}
.hg.big{font-size:calc(3.2em * var(--hg-scale))}
.hg.huge{font-size:calc(5.2em * var(--hg-scale));line-height:1.1}
.tr{font-family:var(--f-tr);font-style:italic;color:var(--red);letter-spacing:.01em}
.es{color:var(--ink-2)}
/* layout */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,var(--lapis) 0%,#162b52 100%);color:#f2e8d2;padding:22px 16px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
[data-theme=dark] .side{background:linear-gradient(180deg,#14223d,#0e1729)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:10px}
.brand .hg{color:var(--gold-2);font-size:34px}
.brand b{font-family:var(--f-head);font-size:26px;letter-spacing:.02em;display:block;line-height:1}
.brand small{font-size:12px;opacity:.75;letter-spacing:.08em;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#e9dfc8;text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.on{background:rgba(217,169,68,.2);color:#fff;box-shadow:inset 3px 0 0 var(--gold-2)}
.nav .ico{font-family:var(--f-hg);font-size:22px;width:28px;text-align:center;color:var(--gold-2)}
.nav .badge{margin-left:auto;background:var(--gold);color:#1b1307;border-radius:20px;font-size:12px;padding:0 8px;font-weight:700}
.side .foot{margin-top:auto;font-size:12px;opacity:.75;padding:10px 8px;border-top:1px solid rgba(255,255,255,.14)}
.sync{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#aaa;display:inline-block}
.dot.ok{background:#6fd08a}.dot.local{background:#e6b54b}.dot.busy{background:#7fb1ff}
main{padding:34px clamp(16px,4vw,56px) 110px;max-width:1080px;width:100%;min-width:0}
.mobilebar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--lapis);justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.2)}
  [data-theme=dark] .mobilebar{background:#14223d}
  .mobilebar a{color:#e9dfc8;text-decoration:none;display:flex;flex-direction:column;align-items:center;font-size:11px;padding:2px 6px;border-radius:8px;position:relative}
  .mobilebar a.on{color:#fff;background:rgba(217,169,68,.25)}
  .mobilebar .ico{font-family:var(--f-hg);font-size:22px;color:var(--gold-2);line-height:1.2}
  main{padding:20px 14px 100px}
  body{font-size:16px}
}
/* typographic */
h1,h2,h3{font-family:var(--f-head);color:var(--ink);line-height:1.15;margin:.2em 0 .5em}
h1{font-size:clamp(32px,4.4vw,46px);font-weight:700}
h2{font-size:30px;font-weight:600}
h3{font-size:23px;font-weight:600;color:var(--lapis)}
.eyebrow{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.lead{font-size:19px;color:var(--ink-2)}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:none;border-radius:10px;padding:11px 18px;font-weight:600;background:var(--lapis);color:#fff;display:inline-flex;align-items:center;gap:8px;text-decoration:none;transition:transform .08s, filter .15s}
[data-theme=dark] .btn{color:#0f1a2e}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px)}
.btn.gold{background:var(--gold);color:#1d1406}
.btn.ghost{background:transparent;color:var(--lapis);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--lapis)}
.btn.red{background:var(--red);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:30px;font-size:13px;font-weight:600;background:var(--papyrus-2);color:var(--ink-2)}
.pill.ok{background:rgba(63,122,74,.15);color:var(--green)}
.pill.lock{background:rgba(138,122,102,.15);color:var(--muted)}
.pill.cur{background:rgba(184,134,43,.18);color:var(--gold)}
.bar{height:8px;background:var(--papyrus-2);border-radius:20px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));border-radius:20px;transition:width .4s}
/* hero */
.hero{position:relative;max-width:100%;overflow:hidden;border-radius:20px;padding:30px;background:linear-gradient(120deg,var(--lapis) 0%,#2c5096 60%,#3d6aa8 100%);color:#f6eedc;box-shadow:var(--shadow)}
[data-theme=dark] .hero{background:linear-gradient(120deg,#16284a,#223e70)}
.hero h1{color:#fff;margin:.1em 0 .2em}
.hero .lead{color:#dfe7f5}
.hero .deco{position:absolute;right:-10px;top:-14px;font-family:var(--f-hg);font-size:150px;opacity:.13;color:#fff;line-height:1;pointer-events:none;white-space:nowrap}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-head);font-size:36px;line-height:1;color:var(--lapis)}
.stat span{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.border-cartouche{border:2px solid var(--gold);border-radius:60px;padding:6px 22px;display:inline-block}
/* lesson list */
.lesson-item{display:flex;gap:16px;align-items:center;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);text-decoration:none;color:inherit;transition:transform .1s,border-color .15s}
.lesson-item:hover{transform:translateY(-1px);border-color:var(--gold)}
.lesson-item.locked{opacity:.55}
.lesson-num{flex:0 0 46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-head);font-weight:700;font-size:22px;background:var(--papyrus-2);color:var(--ink-2);border:2px solid var(--line)}
.lesson-item.done .lesson-num{background:var(--green);color:#fff;border-color:var(--green)}
.lesson-item.current .lesson-num{background:var(--gold);color:#1d1406;border-color:var(--gold)}
.lesson-item .t{font-weight:600}
.lesson-item .s{font-size:14px;color:var(--muted)}
.part-title{font-family:var(--f-head);font-size:22px;color:var(--gold);margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.part-title:after{content:"";flex:1;height:1px;background:var(--line)}
/* tabs */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:18px 0 22px;overflow-x:auto}
.tabs a{padding:10px 16px;text-decoration:none;color:var(--ink-2);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--lapis);border-color:var(--gold)}
/* theory */
.theory h3{margin-top:0}
.theory p{margin:.6em 0}
.theory table{border-collapse:collapse;width:100%;margin:12px 0;font-size:15.5px}
.theory th,.theory td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle}
.theory th{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.theory td .hg{font-size:calc(1.6em * var(--hg-scale))}
.ex{background:var(--papyrus-2);border-left:4px solid var(--gold);border-radius:8px;padding:12px 16px;margin:12px 0;display:flex;flex-direction:column;gap:2px}
.ex .hg{font-size:calc(1.9em * var(--hg-scale))}
.note{background:rgba(31,59,111,.07);border:1px solid rgba(31,59,111,.18);border-radius:10px;padding:12px 16px;margin:14px 0}
[data-theme=dark] .note{background:rgba(143,176,236,.08);border-color:rgba(143,176,236,.2)}
.note:before{content:"Nota · ";font-weight:700;color:var(--lapis)}
.tip:before{content:"Truco · "}
.sec-nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px;flex-wrap:wrap}
.sec-dots{display:flex;gap:6px;flex-wrap:wrap}
.sec-dots button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink-2);font-size:13px;font-weight:700}
.sec-dots button.read{background:rgba(63,122,74,.15);border-color:var(--green);color:var(--green)}
.sec-dots button.on{background:var(--lapis);color:#fff;border-color:var(--lapis)}
/* vocab */
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
.vcard .hg{font-size:calc(2em * var(--hg-scale))}
/* exercises */
.quiz{max-width:760px;margin:0 auto}
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.qbox{text-align:center;padding:30px 22px}
.qprompt{font-size:18px;color:var(--ink-2);margin-bottom:14px}
.qhg{margin:8px 0 18px}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;transition:border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--lapis)}
.opt.right{border-color:var(--green);background:rgba(63,122,74,.12)}
.opt.wrong{border-color:var(--red);background:rgba(163,64,42,.1)}
.opt .hg{font-size:calc(1.6em * var(--hg-scale))}
.inp{width:100%;padding:13px 15px;font-size:19px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-family:var(--f-tr)}
.inp:focus{outline:none;border-color:var(--lapis);box-shadow:0 0 0 3px rgba(31,59,111,.12)}
textarea.inp{font-family:var(--f-body);font-size:17px;min-height:90px;resize:vertical}
.kb{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:10px 0}
.kb button{min-width:36px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--papyrus-2);color:var(--red);font-family:var(--f-tr);font-style:italic;font-size:18px}
.kb button:hover{border-color:var(--lapis)}
.feedback{margin-top:18px;padding:16px;border-radius:12px;text-align:left}
.feedback.ok{background:rgba(63,122,74,.12);border:1px solid rgba(63,122,74,.35)}
.feedback.bad{background:rgba(163,64,42,.09);border:1px solid rgba(163,64,42,.3)}
.feedback.mid{background:rgba(184,134,43,.12);border:1px solid rgba(184,134,43,.35)}
.feedback b.t{display:block;font-size:18px;margin-bottom:4px}
.gloss{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:8px;justify-content:flex-start}
.gloss span{display:flex;flex-direction:column;align-items:center;font-size:14px;color:var(--ink-2)}
.gloss span .tr{font-size:16px}
.result{text-align:center;padding:36px}
.result .score{font-family:var(--f-head);font-size:72px;line-height:1;color:var(--lapis)}
/* flashcards */
.flash{perspective:1200px;max-width:520px;margin:0 auto}
.fcard{min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;padding:30px;cursor:pointer;user-select:none}
.fcard .hint{font-size:13px;color:var(--muted);margin-top:auto}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.grades button{padding:12px 6px;border-radius:10px;border:none;font-weight:700;color:#fff;font-size:15px}
.grades small{display:block;font-weight:500;font-size:11.5px;opacity:.9}
/* signs */
.sign-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.sign{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px 8px;text-align:center;cursor:pointer;transition:border-color .15s,transform .1s}
.sign:hover{border-color:var(--gold);transform:translateY(-1px)}
.sign .hg{font-size:calc(2.3em * var(--hg-scale));display:block;line-height:1.2;min-height:1.3em}
.sign .code{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.05em}
.sign .tr{font-size:15px;display:block;min-height:1.3em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:30px;border:1.5px solid var(--line);background:var(--card);color:var(--ink-2);font-size:14px;font-weight:600}
.chip.on{background:var(--lapis);border-color:var(--lapis);color:#fff}
[data-theme=dark] .chip.on{color:#0f1a2e}
.search{padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;min-width:240px;flex:1}
/* dictionary */
.dict-row{display:grid;grid-template-columns:minmax(110px,170px) minmax(90px,150px) 1fr auto;gap:14px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.dict-row:last-child{border:none}
.dict-row .hg{font-size:calc(1.7em * var(--hg-scale))}
@media (max-width:600px){.dict-row{grid-template-columns:1fr 1fr}.dict-row .es{grid-column:1/-1}.dict-row .pill{display:none}}
/* texts */
.tline{padding:16px 0;border-bottom:1px dashed var(--line)}
.tline:last-child{border:none}
.tline .hg{font-size:calc(2.1em * var(--hg-scale))}
.hidden-ans{filter:blur(6px);cursor:pointer;transition:filter .2s;user-select:none}
.hidden-ans:hover{filter:blur(4px)}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,14,6,.5);display:grid;place-items:center;z-index:100;padding:16px;animation:fade .15s}
.modal{max-width:520px;width:100%;max-height:90vh;overflow:auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--papyrus);padding:10px 18px;border-radius:30px;font-weight:600;z-index:200;box-shadow:var(--shadow);animation:fade .2s}
.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--papyrus-2);display:block}
.heat i.l1{background:rgba(184,134,43,.35)}.heat i.l2{background:rgba(184,134,43,.6)}.heat i.l3{background:var(--gold)}
.fadein{animation:fade .25s}
hr.sep{border:none;border-top:1px solid var(--line);margin:24px 0}
.cult{font-size:17.5px}
.cult p:first-of-type::first-letter{font-family:var(--f-head);font-size:3.2em;float:left;line-height:.9;padding:4px 8px 0 0;color:var(--gold)}
kbd{background:var(--papyrus-2);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:14px}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main id="main"><p class="muted">Cargando…</p></main>
</div>
<nav class="mobilebar" id="mobilebar"></nav>
<script>
/* ======================= CONTENIDO ======================= */
const LESSONS = [];
let SIGNS = [];
let TEXTS = [];
/* ---- 00_helpers.js ---- */
// Ayudantes para escribir el contenido
const X = (h, t, e, n) => `<div class="ex"><span class="hg">${h}</span><span class="tr">${t}</span><span class="es">«${e}»</span>${n ? `<span class="muted" style="font-size:14.5px">${n}</span>` : ''}</div>`;
const H = h => `<span class="hg">${h}</span>`;
const T = t => `<span class="tr">${t}</span>`;
const N = t => `<div class="note">${t}</div>`;
const TIP = t => `<div class="note tip">${t}</div>`;
const TB = (head, rows) => `<div style="overflow-x:auto"><table><thead><tr>${head.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

/* ---- 01_l01_04.js ---- */
/* ===================== LECCIÓN 1 ===================== */
LESSONS.push({
n: 1, title: 'La lengua y la escritura egipcias', sub: 'Qué es el egipcio medio y cómo funcionan los jeroglíficos',
sections: [
['Una lengua de cuatro mil años', `
<p>El egipcio es la lengua más antigua de la que tenemos documentación continua: se escribió desde poco antes del 3000 a.&nbsp;C. hasta la Edad Media, cuando el árabe la sustituyó como lengua hablada. Pertenece a la gran familia <b>afroasiática</b>, junto con las lenguas semíticas (hebreo, árabe, acadio), bereberes, cusíticas y chádicas. Por eso comparte con ellas rasgos como las raíces de consonantes o la terminación <span class="tr">-t</span> del femenino.</p>
<p>A lo largo de su historia la lengua cambió mucho. Los egiptólogos distinguen cinco etapas:</p>
${TB(['Etapa','Época aproximada','Características'],[
['Egipcio antiguo','c. 2600–2100 a. C.','Textos de las Pirámides, inscripciones del Reino Antiguo'],
['<b>Egipcio medio</b>','c. 2100–1600 a. C. (y como lengua culta hasta época romana)','La lengua «clásica»: literatura del Reino Medio, inscripciones de templos y tumbas'],
['Neoegipcio','c. 1350–700 a. C.','Lengua hablada del Reino Nuevo: cartas, cuentos, documentos'],
['Demótico','c. 650 a. C.–450 d. C.','Escritura y lengua de la Baja Época y época grecorromana'],
['Copto','s. III–XVII d. C.','Última etapa, escrita con el alfabeto griego y algunas letras extra'],
])}
<p>Este curso enseña el <b>egipcio medio</b>, la lengua de la literatura clásica y de la inmensa mayoría de las inscripciones jeroglíficas que verás en templos, tumbas, estelas y museos. Se dejó de hablar hacia 1300 a.&nbsp;C., pero se siguió escribiendo durante dos mil años más, igual que el latín en la Europa medieval.</p>`],
['Los jeroglíficos: imágenes que suenan', `
<p>La palabra «jeroglífico» viene del griego y significa «grabado sagrado». Los egipcios llamaban a su escritura ${T('mdw nṯr')} ${H('𓌃𓂧𓅱𓊹')}, «las palabras del dios». Cada signo es un dibujo reconocible —un pájaro, una mano, una casa—, pero <b>casi nunca significa lo que representa</b> sin más: los signos se usan de tres maneras distintas.</p>
${TB(['Uso','Qué hace','Ejemplo'],[
['<b>Fonograma</b>','Representa sonidos (una, dos o tres consonantes)',`${H('𓂋')} boca = sonido ${T('r')}`],
['<b>Ideograma</b>','Representa la palabra de lo que dibuja',`${H('𓉐𓏤')} ${T('pr')} «casa»`],
['<b>Determinativo</b>','No se lee: indica la categoría de significado de la palabra',`${H('𓂻')} piernas = verbo de movimiento`],
])}
<p>Un mismo signo puede servir para las tres cosas. El plano de una casa ${H('𓉐')} es ideograma en ${T('pr')} «casa», fonograma ${T('pr')} en el verbo ${T('prj')} «salir» y determinativo en palabras que designan edificios:</p>
${X('𓉐𓏤','pr','casa','ideograma + trazo que indica «léase como dibujo»')}
${X('𓉐𓂋𓂻','prj','salir','fonograma pr + r de refuerzo + determinativo de movimiento')}
${N('El trazo vertical '+H('𓏤')+' que acompaña a muchos ideogramas avisa: «este signo significa exactamente lo que dibuja».')}`],
['Cómo se escriben las palabras', `
<p>La escritura egipcia, como la árabe o la hebrea, <b>solo anota las consonantes</b>. Las vocales existían, pero no se escribían, y en su mayor parte las desconocemos. Una palabra típica se escribe así:</p>
<ol><li>uno o varios <b>fonogramas</b> que dan su esqueleto de consonantes;</li><li>a veces fonogramas de «refuerzo» que repiten alguna consonante;</li><li>al final, un <b>determinativo</b> que aclara el sentido.</li></ol>
${X('𓂋𓅓𓁿','rmj','llorar','r + m (sonidos) + ojo con lágrimas (determinativo)')}
${X('𓌸𓂋𓀁','mrj','amar','mr (azada) + r de refuerzo + hombre con la mano en la boca')}
<p>Los determinativos son muy útiles: como no hay espacios entre palabras, suelen marcar dónde termina cada una.</p>
<p>Tampoco hay signos de puntuación. El orden de las palabras y la gramática son los que nos permiten saber dónde empieza y acaba una frase; por eso este curso dedica mucha atención a la sintaxis.</p>`],
['Dirección de la escritura y agrupación', `
<p>Los jeroglíficos podían escribirse <b>de derecha a izquierda</b> (lo más habitual), <b>de izquierda a derecha</b> o <b>en columnas</b> de arriba abajo. La regla para saber hacia dónde leer es sencilla: <b>los signos con cara miran hacia el principio de la línea</b>. Si los pájaros y las personas miran a la izquierda, se empieza a leer por la izquierda.</p>
<p>Los signos no se colocan en fila sin más, sino agrupados en cuadrados imaginarios para que el conjunto quede armonioso. Dentro de cada grupo se lee primero lo de arriba y luego lo de abajo.</p>
${N('En esta aplicación, como en la mayoría de las gramáticas modernas, los jeroglíficos se presentan siempre de izquierda a derecha y en una sola línea. Así te concentras en la lectura; cuando veas inscripciones reales, solo tendrás que fijarte en hacia dónde miran los signos.')}
<p>La disposición también podía alterarse por respeto: las palabras «dios», «rey» y los nombres divinos se escriben a menudo <b>delante</b> aunque se lean después. Lo verás en la lección 4 (la «transposición honorífica»).</p>`],
['Hierático, demótico y copto', `
<p>Los jeroglíficos eran una escritura monumental, cuidada y lenta. Para el uso diario —cartas, cuentas, literatura sobre papiro— los escribas usaban el <b>hierático</b>, una forma cursiva que simplificaba los signos y los unía con ligaduras. Casi toda la literatura del Reino Medio nos ha llegado en hierático; los egiptólogos la transcriben a jeroglíficos para estudiarla.</p>
<p>Hacia el 650 a.&nbsp;C. surgió el <b>demótico</b>, una cursiva aún más abreviada. Por último, los cristianos de Egipto escribieron su lengua con el alfabeto griego más siete letras tomadas del demótico: es el <b>copto</b>, que todavía se usa en la liturgia de la Iglesia copta y que nos da valiosas pistas sobre las vocales.</p>
<p>El desciframiento llegó en <b>1822</b>, cuando Jean-François Champollion, apoyándose en la Piedra de Rosetta (un decreto escrito en jeroglífico, demótico y griego) y en su conocimiento del copto, demostró que los jeroglíficos combinaban signos fonéticos y signos de significado.</p>`],
],
culture: ['Breve historia del antiguo Egipto', `
<p>La civilización egipcia se desarrolló a orillas del Nilo durante más de tres milenios. Hacia el 3100 a.&nbsp;C. el país quedó unificado bajo un solo rey, y la tradición egipcia recordaba esa unión como el principio de su historia. Los historiadores organizan los siglos siguientes en «reinos» de prosperidad y unidad separados por «periodos intermedios» de fragmentación.</p>
<p>Durante el <b>Reino Antiguo</b> (c. 2650–2150 a.&nbsp;C.) se construyeron las grandes pirámides de Guiza y Saqqara. Tras un periodo de división, el <b>Reino Medio</b> (c. 2050–1650 a.&nbsp;C.), con reyes como Amenemhat y Senusret, fue la edad clásica de la lengua y la literatura: de esta época proceden <i>Sinuhé</i>, <i>El náufrago</i> o <i>El campesino elocuente</i>, que leerás en parte en este curso.</p>
<p>Después del dominio de los hicsos, el <b>Reino Nuevo</b> (c. 1550–1070 a.&nbsp;C.) convirtió a Egipto en un imperio desde Nubia hasta Siria: es la época de Hatshepsut, Tutmosis III, Akenatón, Tutankamón y Ramsés II. Siguieron siglos de dominio libio, nubio, persa y finalmente macedonio (los Ptolomeos, con Cleopatra VII como última reina) hasta la conquista romana en el 30 a.&nbsp;C.</p>
<p>Los propios egipcios no contaban por siglos, sino por los años de reinado de cada faraón. La división en treinta dinastías procede del sacerdote Manetón, que escribió una historia de Egipto en griego en el siglo III a.&nbsp;C.</p>`],

<p>Como los jeroglíficos solo anotan consonantes, los egiptólogos representan las palabras egipcias con un sistema de letras latinas llamado <b>transliteración</b>. Cada consonante egipcia tiene su letra, y algunas llevan signos especiales (puntos, líneas o ganchos) porque el egipcio tenía sonidos que no existen en español.</p>
<p>La transliteración se escribe en cursiva y en minúsculas, incluso los nombres propios. Además, el sufijo de algunas formas se separa con un punto (${T('pr.f')} «su casa») y las partes de una palabra compuesta con un guion (${T('pr-ꜥꜣ')} «palacio»).</p>

culture: ['La geografía de Egipto', `
<p>Egipto es, como dijo Heródoto, «un don del Nilo». Fuera de la estrecha franja de tierra fértil que el río inundaba cada verano, todo es desierto. Los egipcios llamaban a su país ${T('kmt')}, «la Tierra Negra», por el limo oscuro que dejaba la crecida, y al desierto ${T('dšrt')}, «la Tierra Roja».</p>
<p>El país tenía dos partes muy distintas. El <b>Alto Egipto</b> (${T('šmꜥw')}) es el largo valle del sur, entre la primera catarata, en Asuán, y la región de Menfis. El <b>Bajo Egipto</b> (${T('tꜣ-mḥw')}) es el Delta, la llanura en forma de abanico donde el Nilo se divide antes de llegar al Mediterráneo. Como el río corre de sur a norte, «subir» significaba ir hacia el sur.</p>
<p>Esta dualidad impregnaba toda la ideología real: el faraón era «señor de las Dos Tierras» (${T('nb tꜣwj')}) y llevaba la doble corona, la blanca del Alto Egipto y la roja del Bajo Egipto. El país se dividía además en unas cuarenta provincias, que los griegos llamaron «nomos». Más allá de las fronteras estaban las tierras extranjeras (${T('ḫꜣswt')}), que la escritura representa con un signo de colinas desérticas ${H('𓈉')}.</p>`],

['Complementos fonéticos', `
<p>Los bilíteros y trilíteros suelen ir acompañados de uno o varios unilíteros que <b>repiten</b> parte de su sonido. Son los <b>complementos fonéticos</b>: no añaden consonantes nuevas, solo confirman la lectura.</p>

['Determinativos: la llave del significado', `

<p>Gracias a ellos, palabras que suenan igual se distinguen por escrito, igual que en español distinguimos «vaca» y «baca»:</p>

['Ortografías irregulares', `
<p>La escritura egipcia no era tan regular como la nuestra: una misma palabra puede aparecer escrita de varias maneras, más completas o más abreviadas. Los escribas también intercambiaban el orden de los signos para que el grupo resultara más bonito.</p>
<p>Algunas palabras muy frecuentes se escriben de forma <b>abreviada</b>, solo con su ideograma. Otras conservan signos que ya no se pronunciaban, como la ${T('f')} de ${H('𓇋𓏏𓆑𓀀')} ${T('jt')} «padre».</p>
<p>Por eso, al leer, conviene seguir siempre el mismo método:</p>
<ol><li>identifica el <b>determinativo</b> para saber dónde termina la palabra y qué tipo de palabra es;</li><li>lee los <b>fonogramas</b> sin repetir los complementos;</li><li>busca la palabra en el diccionario teniendo en cuenta las posibles variantes.</li></ol>`],

culture: ['La sociedad egipcia', `
<p>En la cúspide de la sociedad estaba el <b>rey</b>, intermediario entre los dioses y los seres humanos. Por debajo de él, una élite de funcionarios administraba el país: el visir (${T('ṯꜣtj')}), los tesoreros, los gobernadores de provincia y los sacerdotes de los grandes templos. Saber leer y escribir era el privilegio que daba acceso a esta élite: se calcula que solo una pequeña parte de la población estaba alfabetizada.</p>
<p>Los <b>escribas</b> (${T('sš')}) eran el armazón del Estado. Textos escolares como la <i>Sátira de los oficios</i> animaban a los estudiantes a no abandonar sus estudios comparando la vida cómoda del escriba con las penalidades del campesino, el alfarero o el pescador.</p>
<p>La inmensa mayoría de los egipcios eran <b>campesinos</b> que cultivaban cereales, lino y hortalizas en las tierras inundadas por el Nilo y pagaban impuestos en especie. La familia era la base de la sociedad; las mujeres podían poseer bienes, heredar, firmar contratos y presentarse ante los tribunales, una situación excepcional en el mundo antiguo.</p>`],

n: 4, title: 'Los sustantivos', sub: 'Género, número, dual y sintagmas nominales',
sections: [
['Raíces y sustantivos', `
<p>Un <b>sustantivo</b> nombra una persona, un lugar, una cosa o una idea. En egipcio, como en las lenguas semíticas, la mayoría de las palabras se forman sobre una <b>raíz</b> de dos, tres o cuatro consonantes que lleva el significado básico. A partir de ella se forman verbos, sustantivos y adjetivos cambiando las vocales (que no vemos) y añadiendo terminaciones.</p>
${X('𓋹𓈖𓐍','ꜥnḫ','vida; vivir','la misma raíz es sustantivo y verbo')}
${X('𓊵𓏏𓊪','ḥtp','ofrenda; estar satisfecho')}
<p>El egipcio <b>no tiene artículos</b>: ${T('pr')} significa «casa», «una casa» o «la casa», según el contexto.</p>`],
['Género: masculino y femenino', `
<p>Los sustantivos son <b>masculinos</b> o <b>femeninos</b>. Los femeninos llevan casi siempre la terminación ${T('-t')} ${H('𓏏')}, que se coloca antes del determinativo:</p>
${TB(['Masculino','','Femenino',''],[
[H('𓅭𓏤𓀀'),T('sꜣ')+' hijo',H('𓅭𓏏𓁐'),T('sꜣt')+' hija'],
[H('𓌢𓈖𓀀'),T('sn')+' hermano',H('𓌢𓈖𓏏𓁐'),T('snt')+' hermana'],
[H('𓊹𓀭'),T('nṯr')+' dios',H('𓊹𓏏𓆗'),T('nṯrt')+' diosa'],
[H('𓎟'),T('nb')+' señor',H('𓎟𓏏'),T('nbt')+' señora'],
])}
<p>Algunas palabras femeninas no tienen pareja masculina, como ${H('𓈞𓏏𓁐')} ${T('ḥmt')} «mujer, esposa» o ${H('𓊖𓏏𓏤')} ${T('njwt')} «ciudad». Y hay masculinos que terminan en ${T('t')} porque esa consonante forma parte de la raíz, como ${T('jt')} «padre».</p>
${N('En el plural de las palabras abstractas el femenino sirve a menudo para expresar ideas generales: '+T('nfrt')+' «lo bueno, el bien».')}`],
['Número: singular y plural', `
<p>El plural masculino termina en ${T('-w')} y el femenino en ${T('-wt')}, aunque en la escritura esas terminaciones a menudo no se anotan. El plural se indica de tres maneras:</p>
<ol>
<li><b>Con los trazos de plural</b> ${H('𓏥')} detrás del determinativo: ${H('𓉐𓏥')} ${T('prw')} «casas».</li>
<li><b>Repitiendo tres veces</b> el ideograma o el determinativo: ${H('𓊹𓊹𓊹')} ${T('nṯrw')} «dioses».</li>
<li><b>Escribiendo la terminación</b> ${T('w')} ${H('𓅱')}: ${H('𓌢𓈖𓅱𓀀𓏥')} ${T('snw')} «hermanos».</li>
</ol>
${X('𓈞𓏏𓁐𓏥','ḥmwt','mujeres')}
${X('𓈉𓏏𓏥','ḫꜣswt','países extranjeros')}
<p>Algunos sustantivos son <b>colectivos</b>: su forma singular designa un grupo y lleva determinativo de plural, como ${T('rmṯ')} «gente».</p>`],
['El dual', `
<p>Además de singular y plural, el egipcio tenía un <b>dual</b> para cosas que van en pareja. Termina en ${T('-wj')} (masculino) y ${T('-tj')} (femenino), y se escribe duplicando el signo o con los dos trazos ${H('𓏭')}:</p>
${X('𓇾𓇾','tꜣwj','las Dos Tierras (Egipto)')}
${X('𓁹𓁹','jrtj','los dos ojos')}
${X('𓂝𓂝','ꜥwj','los dos brazos')}
${X('𓅭𓏏𓏭𓁐𓁐','sꜣtj','dos hijas')}
<p>Con el paso del tiempo el dual se usó cada vez menos, salvo para las partes del cuerpo y expresiones fijas como «las Dos Tierras».</p>`],
['Definido e indefinido', `
<p>Como no hay artículos, el contexto decide si un sustantivo es definido («la casa») o indefinido («una casa»). En español elige lo más natural:</p>
${X('𓂋𓈖','rn','el nombre / un nombre')}
<p>En el egipcio tardío aparecieron artículos a partir de los demostrativos (${T('pꜣ, tꜣ, nꜣ')}), que darán el artículo copto. En egipcio medio estos demostrativos todavía se traducen como «este, esta, estos» (lección 5).</p>`],
['Sintagmas nominales: aposición y genitivo', `
<p>Un <b>sintagma nominal</b> es un grupo de palabras que funciona como un sustantivo. Hay tres maneras básicas de combinar sustantivos:</p>
<p><b>1. Aposición:</b> un sustantivo explica a otro y va justo detrás: ${T('sꜣ.f ḥr')} «su hijo, Horus».</p>
<p><b>2. Genitivo directo:</b> dos sustantivos seguidos; el segundo pertenece al primero. Es el modo normal cuando la relación es estrecha.</p>
${X('𓎟𓉐𓏤','nb pr','el señor de la casa')}
${X('𓉐𓉻','pr-ꜥꜣ','el palacio («la casa grande»), de donde viene «faraón»')}
<p><b>3. Genitivo indirecto:</b> se une el segundo sustantivo con la palabra ${T('n')} «de», que concuerda con el <b>primer</b> sustantivo:</p>
${TB(['','Forma','Signos'],[
['masculino singular',T('n'),H('𓈖')],
['femenino singular',T('nt'),H('𓈖𓏏')],
['plural (ambos géneros)',T('nw'),H('𓈖𓏌𓅱')],
])}
${X('𓅭𓏤𓀀𓈖𓇓𓏏𓈖','sꜣ n nswt','un hijo del rey')}
${X('𓈞𓏏𓁐𓈖𓏏𓏞𓀀','ḥmt nt sš','la esposa de un escriba')}
${X('𓊹𓊹𓊹𓈖𓏌𓅱𓆎𓏏𓊖','nṯrw nw kmt','los dioses de Egipto')}`],
['La transposición honorífica', `
<p>Por respeto, las palabras que designan a un dios, al rey o a un objeto sagrado se escriben <b>delante</b> en un compuesto, aunque se lean en su lugar normal. Es la <b>transposición honorífica</b>:</p>
${X('𓊹𓍛','ḥm-nṯr','sacerdote («servidor del dios»)','se escribe nṯr + ḥm, pero se lee ḥm-nṯr')}
${X('𓇓𓏏𓈖𓉐𓏤','pr nswt','la casa del rey')}
${X('𓇓𓏏𓈖𓅭𓏤𓀀','sꜣ nswt','hijo del rey, príncipe')}
${X('𓇓𓏏𓈖𓊵𓏏𓊪𓂞','ḥtp-dj-nswt','una ofrenda que da el rey','comienzo de la fórmula de ofrendas')}
${TIP('Si una palabra empieza por '+H('𓊹')+' o '+H('𓇓𓏏𓈖')+' y no tiene sentido leerla así, prueba a leer ese signo al final del grupo.')}`],
],
culture: ['Los dioses', `
<p>Los egipcios veían lo divino en todas las fuerzas de la naturaleza y de la sociedad. Un dios (${T('nṯr')}) era ante todo una fuerza que actuaba en el mundo: el sol, el aire, la crecida del Nilo, la fertilidad, la escritura. Por eso un mismo dios podía manifestarse de muchas formas, y varios dioses podían unirse en uno, como Amón-Ra.</p>
<p>Entre los dioses principales estaban <b>Ra</b> (${T('rꜥ')}), el sol, creador y rey de los dioses; <b>Osiris</b> (${T('jsjrt')}), dios de los muertos y de la regeneración; su esposa <b>Isis</b> (${T('ꜣst')}), maga y madre protectora; su hijo <b>Horus</b> (${T('ḥrw')}), dios halcón del cielo y de la realeza; <b>Seth</b> (${T('stẖ')}), fuerza del desorden y del desierto; <b>Ptah</b> (${T('ptḥ')}), dios creador de Menfis y patrón de los artesanos; <b>Amón</b> (${T('jmn')}), «el oculto», dios de Tebas; <b>Hathor</b> (${T('ḥwt-ḥr')}), diosa del amor, la música y la alegría; y <b>Thot</b> (${T('ḏḥwtj')}), dios de la sabiduría y de la escritura.</p>
<p>El arte representaba a los dioses con cuerpo humano y cabeza de animal, no porque los egipcios los imaginaran así literalmente, sino como un lenguaje simbólico: la cabeza de halcón de Horus expresaba su naturaleza celeste y real.</p>`],

<p>Una oración tiene un <b>sujeto</b> (de quién se habla) y un <b>predicado</b> (lo que se dice de él). En egipcio muchas oraciones no tienen verbo: el verbo «ser» se sobreentiende. Según la clase de palabra que forma el predicado, se distinguen tres tipos de oraciones <b>no verbales</b>:</p>
<ul><li><b>adjetivales</b>: el predicado es un adjetivo («él es bueno»);</li><li><b>nominales</b>: el predicado es un sustantivo o pronombre («yo soy escriba»);</li><li><b>adverbiales</b>: el predicado es un adverbio o una preposición con su complemento («está en casa»), que verás en la lección 10.</li></ul>

LESSONS.push({

sections: [
['Las cifras', `
<p>El sistema numérico egipcio es <b>decimal</b> y aditivo, como el de los números romanos pero sin restas: cada potencia de diez tiene su signo, que se repite tantas veces como haga falta.</p>
${TB(['Signo','Valor','Dibujo'],[
[H('𓏤'),'1','trazo'],
[H('𓎆'),'10','asa de cuerda'],
[H('𓍢'),'100','rollo de cuerda'],
[H('𓆼'),'1000','planta de loto'],
[H('𓂭'),'10 000','dedo'],
[H('𓆐'),'100 000','renacuajo'],
[H('𓁨'),'1 000 000','dios Heh con los brazos alzados'],
])}
<p>Las cifras se escriben de mayor a menor:</p>
${X('𓍢𓍢𓎆𓎆𓎆𓏤𓏤𓏤𓏤','234','dos cientos, tres decenas, cuatro unidades')}
${X('𓆼𓍢𓍢𓍢𓍢𓍢𓏤','1501','mil quinientos uno')}`],

<p>Los números tenían nombre (${T('wꜥ')} «uno», ${T('snwj')} «dos», ${T('ḫmt')} «tres», ${T('fdw')} «cuatro», ${T('djw')} «cinco», ${T('sjsw')} «seis», ${T('sfḫ')} «siete», ${T('ḫmnw')} «ocho», ${T('psḏ')} «nueve», ${T('mḏ')} «diez»…), pero casi siempre se escriben con cifras.</p>
<p>El número va <b>detrás</b> del sustantivo, que se pone normalmente en plural (o en singular, a menudo, en listas y cuentas):</p>
${X('𓊹𓊹𓊹𓏤𓏤𓏤𓏤𓏤𓏤𓏤𓏤𓏤','nṯrw 9','nueve dioses (la Enéada)')}
${X('𓉐𓏥𓏤𓏤𓏤','prw 3','tres casas')}
<p>Los números «uno» y «dos» son especiales: ${T('wꜥ')} puede ir delante del sustantivo con ${T('n')} o detrás como adjetivo («único»), y «dos» se expresa a menudo con el dual: ${T('tꜣwj')} «dos tierras».</p>`],
['Ordinales', `
<p>Los ordinales del segundo al noveno se forman añadiendo ${T('-nw')} ${H('𓏌𓅱')} al número: ${T('snnw')} «segundo», ${T('ḫmtnw')} «tercero», ${T('fdnw')} «cuarto»… Para «primero» se usa la nisbe ${T('tpj')} ${H('𓁶𓏤𓏭')} «el que está en cabeza». A partir de diez se usa la palabra ${T('mḥ')} «que completa»: ${T('mḥ 10')} «décimo».</p>
${X('𓏤𓏤𓏤𓏌𓅱','ḫmtnw','tercero')}
${X('𓅭𓏤𓀀𓆑𓁶𓏤𓏭','sꜣ.f tpj','su primer hijo (su hijo primogénito)')}`],
['Fracciones y medidas', `
<p>Las fracciones egipcias eran casi siempre del tipo 1/n: se escribían colocando la boca ${H('𓂋')} ${T('r')} (que aquí significa «parte») sobre el número. En este curso lo verás en línea: ${H('𓂋𓏤𓏤𓏤')} = 1/3, ${H('𓂋𓎆')} = 1/10. Para 1/2 se usaba ${T('gs')} «mitad» ${H('𓐛')}, y para 2/3 un signo especial.</p>
<p>Otras fracciones se expresaban como sumas: 3/4 = 1/2 + 1/4. El <i>Papiro Rhind</i> muestra cómo los escribas dominaban estos cálculos.</p>
<p>Las medidas más corrientes eran el <b>codo</b> (${T('mḥ')}, unos 52,5 cm), dividido en 7 palmos de 4 dedos; el <b>arura</b> (${T('stꜣt')}) para superficies agrícolas (unos 2735 m²); el <b>heqat</b> (${T('ḥqꜣt')}) para el grano (unos 4,8 litros); y el <b>deben</b> (${T('dbn')}, unos 91 g) para el peso de los metales.</p>`],
['El calendario y las fechas', `
<p>El año civil egipcio tenía <b>365 días</b>: doce meses de treinta días y cinco días «añadidos» (${T('ḥrjw rnpt')}, «los que están sobre el año»). Los meses se agrupaban en <b>tres estaciones</b> de cuatro meses, según el ritmo del Nilo:</p>
${TB(['Estación','Transliteración','Época aproximada'],[

['Cosecha',T('šmw'),'marzo – julio'],
])}
<p>Los meses no se nombraban, sino que se numeraban dentro de cada estación: «mes 2 de la Inundación». Los años se contaban desde el comienzo de cada reinado. Una fecha completa tenía esta forma:</p>
<div class="ex"><span class="tr">rnpt-ḥsb 5 ꜣbd 2 prt sw 10 ẖr ḥm n nswt-bjtj…</span><span class="es">«Año de reinado 5, segundo mes de la estación de Crecimiento, día 10, bajo la majestad del rey dual…»</span></div>
<p>${T('rnpt')} ${H('𓆳𓏏𓏤')} es «año», ${T('ꜣbd')} ${H('𓇹𓇼')} «mes» y ${T('sw')} ${H('𓇳')} «día» (en las fechas).</p>`],
],
culture: ['La cronología egipcia', `
<p>¿Cómo sabemos en qué año reinó cada faraón, si los egipcios contaban por años de reinado? Los egiptólogos combinan varias fuentes: las <b>listas de reyes</b> (como el Canon de Turín o la lista de Abido), la obra de <b>Manetón</b> y, sobre todo, la <b>astronomía</b>.</p>
<p>Como el año civil egipcio tenía 365 días exactos, se desfasaba un día cada cuatro años respecto al año solar. El orto helíaco de la estrella Sirio (${T('spdt')}, Sotis), que anunciaba la crecida, solo coincidía con el día de Año Nuevo una vez cada 1460 años. Algunos documentos registran en qué fecha del calendario civil se observó ese orto, y eso permite calcular el año real con un margen de pocos años.</p>
<p>Gracias a estos cálculos, al radiocarbono y a los sincronismos con otros pueblos, la cronología del Reino Medio y del Reino Nuevo se conoce con un margen de error de unas décadas; la de épocas más antiguas, con márgenes mayores.</p>`],

<p>En la oración adverbial el predicado es un <b>adverbio</b> o una <b>preposición con su complemento</b>: dice dónde, cómo o con quién está el sujeto. El orden normal es <b>sujeto + predicado</b>:</p>

${X('𓅭𓏤𓀀𓆑𓎛𓈖𓂝𓆑','sꜣ.f ḥnꜥ.f','su hijo está con él')}
<p>Se traduce con «estar» (o «ser» en algunos casos) en el tiempo que pida el contexto.</p>`],
['La partícula jw', `
<p>Las oraciones adverbiales independientes suelen ir introducidas por la partícula ${T('jw')} ${H('𓃛𓅱')}. No se traduce: indica que la frase es una afirmación sobre una situación, a menudo vinculada al contexto («resulta que…»).</p>
${X('𓃛𓅱𓅭𓏤𓀀𓎡𓅓𓉐𓏤','jw sꜣ.k m pr','tu hijo está en casa')}
<p>Cuando el sujeto es un pronombre, ${T('jw')} lo toma como <b>sufijo</b>:</p>
${X('𓃛𓅱𓆑𓅓𓊖𓏏𓏤','jw.f m njwt','él está en la ciudad')}
${X('𓃛𓅱𓀀𓎛𓈖𓂝𓎡','jw.j ḥnꜥ.k','estoy contigo')}

${X('𓅓𓎡𓍿𓅱𓅓𓊖𓏏𓏤','mk ṯw m njwt','he aquí que estás en la ciudad')}

culture: ['Maat', `
<p><b>Maat</b> (${T('mꜣꜥt')}) es quizá el concepto más importante de la cultura egipcia. Se traduce a menudo como «verdad» o «justicia», pero su sentido es más amplio: Maat es el <b>orden correcto del mundo</b> tal como lo estableció el creador, el equilibrio que hace que el sol salga, el Nilo crezca, la sociedad funcione y los dioses reciban culto.</p>

LESSONS.push({
n: 12, title: 'Oraciones subordinadas no verbales', sub: 'Relativas con ntj y jwtj, sustantivas con ntt y circunstanciales',
sections: [
['Tres clases de oraciones subordinadas', `
<p>Una oración <b>subordinada</b> forma parte de otra oración mayor y hace en ella el papel de un adjetivo, de un sustantivo o de un adverbio:</p>
<ul>
<li><b>relativa</b> (adjetiva): «el hombre <i>que está en casa</i>»;</li>
<li><b>sustantiva</b>: «sé <i>que estás en casa</i>»;</li>
<li><b>adverbial</b>: «vino <i>cuando yo estaba en casa</i>».</li>
</ul>
<p>Cada clase puede ir <b>marcada</b> por una palabra introductoria o <b>sin marcar</b>, sin nada que la señale. Las no marcadas son muy frecuentes en egipcio y hay que reconocerlas por el contexto.</p>`],
['Relativas con ntj', `
<p>El adjetivo relativo ${T('ntj')} ${H('𓈖𓏏𓏭')} «que» es una nisbe de la antigua palabra ${T('n')}. Concuerda con su antecedente: ${T('ntj')} (masc.), ${T('ntt')} ${H('𓈖𓏏𓏏')} (fem.), ${T('ntjw')} ${H('𓈖𓏏𓏭𓅱𓏥')} (plural).</p>
<p>Cuando el antecedente es el sujeto de la relativa, ${T('ntj')} va seguido directamente del predicado adverbial (<b>relativa directa</b>):</p>
${X('𓊃𓏭𓀀𓈖𓏏𓏭𓅓𓉐𓏤','zj ntj m pr','el hombre que está en la casa')}
${X('𓈞𓏏𓁐𓈖𓏏𓏏𓎛𓈖𓂝𓆑','ḥmt ntt ḥnꜥ.f','la mujer que está con él')}
${X('𓂋𓅓𓍿𓀀𓁐𓏥𓈖𓏏𓏭𓅱𓏥𓅓𓊖𓏏𓏤','rmṯ ntjw m njwt','la gente que está en la ciudad')}
<p>Si el antecedente no es el sujeto, la relativa tiene su propio sujeto y un pronombre «de retorno» que remite al antecedente (<b>relativa indirecta</b>):</p>

['ntj como sustantivo y jwtj', `
<p>Sin antecedente, ${T('ntj')} funciona como sustantivo: «el que, lo que». El femenino ${T('ntt')} significa a menudo «lo que» (cosas):</p>

['Relativas sin ntj', `
<p>Si el antecedente es <b>indefinido</b> («un hombre que…»), la relativa suele ir sin marcar, es decir, sin ${T('ntj')}:</p>

<p>Compara: ${T('zj ntj m pr')} «<b>el</b> hombre que está en casa» frente a ${T('zj sw m pr')} «<b>un</b> hombre que está en casa».</p>`],
['Oraciones sustantivas: ntt', `
<p>Una oración sustantiva funciona como sujeto u objeto de otra. Va marcada por ${T('ntt')} «que» (forma femenina de ${T('ntj')}) y el sujeto pronominal es dependiente:</p>

['Oraciones circunstanciales', `
<p>Muchas veces una oración adverbial sin marca alguna sigue a otra y describe las circunstancias en que ocurre: es una <b>oración circunstancial</b>. Se traduce con «mientras», «cuando», «estando…» o simplemente con «y»:</p>

],
culture: ['La creación del mundo', `
<p>Según la teología de Heliópolis, en el principio un dios surgió por sí mismo de las aguas de Nun: <b>Atum</b> (${T('jtmw')}), «el que está completo». Atum creó de sí mismo a la primera pareja: <b>Shu</b>, el aire seco, y <b>Tefnut</b>, la humedad. Estos engendraron a <b>Geb</b>, la tierra, y a <b>Nut</b>, el cielo. Shu separó a Nut de Geb y la elevó por encima de él, creando el espacio en el que existe la vida.</p>

LESSONS.push({
n: 13, title: 'El verbo', sub: 'Clases de verbos, raíces y visión general del sistema verbal',
sections: [
['Qué expresa un verbo', `
<p>Hasta ahora todas tus oraciones han sido no verbales. A partir de esta lección entra en escena el <b>verbo</b>, que expresa una acción («hacer», «ir») o un estado («ser bueno», «estar contento»).</p>
<p>Los verbos pueden ser <b>transitivos</b> (llevan un objeto directo: «ver algo», «hacer algo») o <b>intransitivos</b> (no lo llevan: «ir», «llegar», «vivir»). Esta distinción es esencial en egipcio, porque algunas formas verbales significan cosas distintas según el tipo de verbo.</p>
<p>Un grupo especial son los <b>verbos adjetivales</b>, como ${T('nfr')} «ser bueno» o ${T('wr')} «ser grande»: la misma raíz da un adjetivo y un verbo de estado.</p>`],
['Rasgos del verbo egipcio', `
<p>El verbo egipcio expresa sobre todo <b>aspecto</b> (si la acción se ve como acabada o en curso) y <b>modo</b> (si es un hecho real o un deseo), más que tiempo. El tiempo (pasado, presente, futuro) se deduce muchas veces del contexto.</p>
<p>Las formas verbales se dividen en dos grandes grupos:</p>
<ul>
<li><b>Formas no conjugadas</b>: el infinitivo, el imperativo, los participios, el estativo (que tiene sus propias terminaciones).</li>
<li><b>La conjugación sufijal</b>: una raíz verbal seguida del sujeto como sufijo o sustantivo. El modelo de los gramáticos es el verbo ${T('sḏm')} «oír»: ${T('sḏm.f')} «él oye», ${T('sḏm.n.f')} «él ha oído»…</li>
</ul>
${X('𓄔𓅓𓆑','sḏm.f','él oye / que él oiga')}
${X('𓄔𓅓𓈖𓆑','sḏm.n.f','él oyó, él ha oído')}
${X('𓄔𓅓𓈖𓎡𓎟𓀀','sḏm.n nb.j','mi señor ha oído','con sujeto nominal no hay sufijo')}`],
['Clases de raíces', `
<p>Los verbos se clasifican según el número y el tipo de consonantes de su raíz, porque cada clase forma algunas de sus formas de manera distinta. La notación de los gramáticos usa abreviaturas latinas:</p>
${TB(['Clase','Descripción','Ejemplos'],[
['2-lit.','dos consonantes fuertes',T('mn')+' «permanecer», '+T('ḏd')+' «decir»'],
['3-lit.','tres consonantes fuertes',T('sḏm')+' «oír», '+T('ḥtp')+' «estar satisfecho»'],
['4-lit.','cuatro consonantes',T('wstn')+' «caminar libremente»'],
['2ae gem.','la segunda consonante se duplica en algunas formas',T('mꜣꜣ')+' «ver», '+T('wnn')+' «existir»'],
['3ae inf.','la tercera consonante es débil (j, w) y desaparece',T('mrj')+' «amar», '+T('jrj')+' «hacer», '+T('msj')+' «dar a luz»'],
['4ae inf.','la cuarta consonante es débil',T('ḥmsj')+' «sentarse»'],
['causativos','prefijo s- «hacer que»',T('sꜥnḫ')+' «hacer vivir», '+T('smn')+' «hacer durar, establecer»'],
['anómalos','irregulares',T('rdj')+' «dar», '+T('jj / jwj')+' «venir»'],
])}
${N('Los verbos de las clases «geminadas» y «débiles» son importantes porque su forma escrita nos ayuda a distinguir formas verbales que en los verbos fuertes se escriben igual.')}`],
['Los verbos anómalos y defectivos', `
<p>Dos verbos muy frecuentes tienen formas irregulares:</p>
<p><b>${T('rdj')} «dar, poner, hacer que».</b> Tiene dos raíces: ${T('rdj')} ${H('𓂋𓂞')} y ${T('dj')} ${H('𓂞')}. Según la forma verbal aparece una u otra. Su imperativo es una palabra distinta: ${T('jmj')} «¡da!».</p>
<p><b>${T('jj')} / ${T('jwj')} «venir».</b> Usa también dos raíces: ${T('jj')} ${H('𓇍𓇋𓂻')} y ${T('jw')} ${H('𓃛𓅱𓂻')}. Su imperativo es ${T('mj')} «¡ven!».</p>
<p>Algunos verbos son <b>defectivos</b>: solo existen en ciertas formas, como ${T('jn')} y ${T('ḏd')} en el sentido de «dice (él)» dentro de citas (lección 22).</p>`],
['Las partes del verbo', `
<p>En una forma de la conjugación sufijal puedes distinguir:</p>
<ol>
<li>la <b>raíz</b>, a veces con duplicación o con terminación: ${T('mrr')}, ${T('mrj')};</li>

<p>En la mentalidad egipcia, las palabras tenían poder para hacer existir las cosas. Dos fuerzas divinas acompañaban al dios creador: <b>Sia</b> (${T('sjꜣ')}), la percepción o comprensión, y <b>Hu</b> (${T('ḥw')}), la palabra que ordena. Con ellas, y con <b>Heka</b> (${T('ḥkꜣ')}), la magia o energía creadora, el dios concibió el mundo en su mente y lo hizo realidad pronunciándolo.</p>

<p>Según este texto, el creador fue <b>Ptah</b>, dios de Menfis. Ptah no creó el mundo con sus manos ni engendrándolo, sino <b>pensándolo con su corazón y pronunciándolo con su lengua</b>. Todo lo que existe, incluidos los dioses, nació de un concepto de su mente que su palabra hizo realidad.</p>

<p>El <b>estativo</b> (llamado también «pseudoparticipio» u «old perfective» en gramáticas antiguas) es una forma verbal que expresa un <b>estado</b>, normalmente el resultado de una acción. Es la única forma verbal con terminaciones propias, que indican persona, número y género del sujeto.</p>
${TB(['Persona','Terminación','Signos'],[

['3.ª plural',T('.w'),H('𓅱')],
])}
<p>La raíz del estativo no cambia: los verbos 3ae inf. suelen perder la consonante débil, y los 2ae gem. no duplican.</p>`],

<li>Con verbos <b>transitivos</b> el sentido es pasivo: ${T('jr.w')} «está hecho».</li>

['Un epíteto muy famoso', `
<p>Tras el nombre del rey aparece constantemente la abreviatura ${H('𓋹𓍑𓋴')}, que se lee ${T('ꜥnḫ wḏꜣ snb')}: tres estativos que significan «(que esté) vivo, próspero y sano». Los egiptólogos la traducen «¡vida, prosperidad, salud!» o «v.p.s.».</p>
${X('𓉐𓉻𓋹𓍑𓋴','pr-ꜥꜣ ꜥnḫ wḏꜣ snb','el faraón, ¡vida, prosperidad, salud!')}

<p>¿Cómo sabemos que el egipcio tenía vocales que no se escribían, y cómo podemos reconstruirlas? Las fuentes principales son tres. La primera es el <b>copto</b>, que se escribía con vocales: la palabra ${T('nfr')} «bueno» aparece en copto como <i>nūfe</i>, y ${T('rmṯ')} «persona» como <i>rōme</i>.</p>
<p>La segunda son las <b>transcripciones en otras lenguas</b>: las cartas de Amarna, escritas en acadio cuneiforme (que sí anota vocales), recogen nombres egipcios; los griegos transcribieron otros muchos. Así sabemos, por ejemplo, que el nombre de trono de Amenhotep III, ${T('nb-mꜣꜥt-rꜥ')}, se pronunciaba aproximadamente «Nibmuaria».</p>

<p>El perfecto expresa una acción <b>terminada</b>. Se traduce normalmente por un pasado («oyó») o un pretérito perfecto («ha oído»), según el contexto. A diferencia del estativo, que describe el estado resultante, el perfecto se centra en la acción misma.</p>

<p>En las oraciones principales suele ir precedido de ${T('jw')} o de ${T('ꜥḥꜥ.n')} «entonces» (literalmente «se levantó»), muy frecuente en los relatos:</p>

<p>¡Atención! El perfecto negado ${T('n sḏm.n.f')} <b>no</b> significa «no oyó», sino «<b>no puede oír</b>» o «no oye» (en general). Es una negación de la capacidad o de lo habitual:</p>

<p>Los egipcios fueron de los primeros pueblos en crear una literatura escrita de ficción y de reflexión. La mayor parte de las obras clásicas se compusieron en egipcio medio durante el Reino Medio, y se siguieron copiando en las escuelas de escribas durante siglos.</p>

culture: ['La literatura sapiencial', `
<p>Las «enseñanzas» (${T('sbꜣyt')}) eran el género literario más prestigioso de Egipto. Adoptan la forma de consejos que un padre, a menudo un visir o un rey, da a su hijo antes de morir. La más célebre es la <i>Enseñanza de Ptahhotep</i>, atribuida a un visir del Reino Antiguo pero compuesta probablemente en el Reino Medio.</p>

n: 20, title: 'El perfectivo y el imperfectivo', sub: 'Acción puntual frente a acción habitual o continua',
sections: [
['Dos aspectos del sḏm.f', `
<p>Además del subjuntivo, la forma ${T('sḏm.f')} esconde otras formas que se escriben casi igual pero tienen significados distintos. Dos de ellas son el <b>perfectivo</b> y el <b>imperfectivo</b>. La diferencia es de <b>aspecto</b>:</p>
<ul>
<li>el <b>perfectivo</b> presenta la acción como un todo, puntual o acabada;</li>
<li>el <b>imperfectivo</b> la presenta como repetida, habitual o en desarrollo.</li>
</ul>
<p>Se distinguen sobre todo en los verbos débiles y geminados:</p>
${TB(['Clase','Perfectivo','Imperfectivo'],[
['3-lit.',T('sḏm.f'),T('sḏm.f')],

['3ae inf.',T('mr.f'),T('mrr.f')+' (con duplicación)'],
['rdj',T('rdj.f'),T('dd.f')],
['jj / jwj',T('jj.f'),T('jw.f')],
])}`],
['El perfectivo negado: n sḏm.f', `

${X('𓂜𓁹𓀀𓐍𓏏𓏛𓏥𓈋𓅱𓏏𓅪𓂋𓂋𓅓𓍿𓀀𓁐𓏥','n jr.j ḫt ḏwt r rmṯ','no hice nada malo contra la gente','al estilo de las declaraciones de inocencia del juicio de los muertos')}
<p>El perfectivo también aparece en oraciones principales del egipcio más antiguo y en ciertas expresiones fijas, pero en egipcio medio su papel principal es el de pasado negativo.</p>`],

['Qué es un participio', `
<p>Un <b>participio</b> es un adjetivo formado a partir de un verbo: «el que oye», «el oído». En egipcio hay participios <b>activos</b> (el sujeto hace la acción) y <b>pasivos</b> (el sujeto la sufre), y cada uno tiene una forma <b>perfectiva</b> y otra <b>imperfectiva</b>:</p>
${TB(['','Perfectivo','Imperfectivo'],[
['Activo',T('mr')+' «el que amó»',T('mrr')+' «el que ama (siempre)»'],
['Pasivo',T('mrj, mrw')+' «el que fue amado»',T('mrrw')+' «el que es amado»'],
])}
<p>Como adjetivos, los participios <b>concuerdan</b> con su antecedente: ${T('-t')} para el femenino y ${T('-w')} para el plural (a menudo no escrita).</p>`],
['Participios como adjetivos y como sustantivos', `
<p>Detrás de un sustantivo, el participio funciona como una oración de relativo:</p>
${X('𓊃𓏭𓀀𓄔𓅓','zj sḏm','un hombre que oye / que escucha')}
${X('𓊹𓀭𓁹𓐙𓂝𓏏𓆄','nṯr jr mꜣꜥt','el dios que hace Maat')}
<p>Sin antecedente, funciona como un sustantivo: «el que…, lo que…»:</p>
${X('𓋹𓈖𓐍𓅱𓏥','ꜥnḫw','los vivos (los que viven)')}
${X('𓇋𓈖𓎡𓀀𓁹𓐙𓂝𓏏𓆄','jnk jr mꜣꜥt','yo soy uno que hace Maat')}`],
['Epítetos con participios', `
<p>Los participios son la base de innumerables epítetos de reyes, dioses y particulares:</p>
${X('𓇋𓏠𓈖𓌸','mrj-jmn','amado de Amón','participio pasivo + agente; jmn se escribe primero por respeto')}

${X('𓌸𓂋𓇋𓇋𓈖𓎟𓆑','mrjj n nb.f','amado de su señor')}
<p>El agente de un participio pasivo puede ir directamente detrás (${T('mrj jmn')}) o con ${T('n')}: ${T('ḥzjj n nb.f')} «favorecido por su señor».</p>`],
['La oración participial: «es X quien…»', `
<p>Una construcción muy expresiva pone de relieve quién hace la acción: <b>${T('jn')} + sujeto + participio</b>. Se traduce «es X quien…»:</p>

${X('𓇋𓈖𓊹𓀭𓁹𓋴𓏏','jn nṯr jr st','es el dios quien lo hace')}

['Negación y matices', `
<p>Los participios se niegan con el participio de ${T('tm')} + complemento negativo:</p>
${X('𓍃𓅓𓄔𓅓','tm sḏm','el que no oye')}
<p>Recuerda que el participio <b>activo</b> de un verbo intransitivo describe el estado del sujeto (${T('jj')} «el que ha venido») y el <b>pasivo</b> de un transitivo describe al que recibe la acción (${T('dj')} «el que es dado»). El perfectivo suele traducirse en pasado y el imperfectivo en presente habitual, pero lo decide el contexto.</p>

culture: ['Himnos y poesía', `
<p>Los himnos egipcios celebran a los dioses, al rey e incluso a fenómenos naturales como la crecida del Nilo. Suelen empezar con una fórmula de saludo —«¡Salve a ti, Ra, cuando sales!»— y continúan con largas series de epítetos, muchos de ellos participios: «el que crea lo que existe», «el que da vida a todos los seres».</p>

['Qué es una forma relativa', `
<p>Un participio describe a su antecedente como <b>sujeto</b> de la acción (${T('zj sḏm')} «el hombre que oye»). Pero, ¿cómo se dice «el hombre <i>al que</i> él oye»? Aquí el antecedente es el <b>objeto</b>, y la acción tiene su propio sujeto. Para eso el egipcio usa las <b>formas relativas</b>: formas de la conjugación sufijal que funcionan como adjetivos.</p>
${TB(['Forma relativa','Ejemplo','Traducción'],[
['perfecto relativo',T('sḏm.n.f'),'que él oyó'],
['imperfectiva',T('mrr.f'),'que él ama'],
['perfectiva',T('mr.f'),'que él amó'],
])}
<p>Como adjetivos, concuerdan con el antecedente: el femenino añade ${T('-t')} a la raíz (${T('jrt.n.f')} «la que él hizo»), y el plural ${T('-w')}.</p>`],

culture: ['Los textos no literarios', `
<p>Junto a la literatura y los textos religiosos, Egipto nos ha dejado una enorme masa de documentos prácticos: cuentas de templos, listas de trabajadores, inventarios, contratos, testamentos, actas judiciales, textos médicos y matemáticos.</p>
<p>El <b>Papiro Rhind</b>, copiado hacia 1550 a.&nbsp;C. a partir de un original del Reino Medio, contiene más de ochenta problemas matemáticos resueltos: repartos de pan, cálculo de áreas de campos, volúmenes de graneros y la pendiente de las pirámides. El <b>Papiro Edwin Smith</b> describe casos de heridas y fracturas con un método sorprendentemente racional: examen, diagnóstico, pronóstico y tratamiento. El <b>Papiro Ebers</b> recoge cientos de recetas.</p>
<p>Los archivos de la aldea de <b>Deir el-Medina</b>, donde vivían los artesanos que excavaban las tumbas del Valle de los Reyes, nos muestran la vida cotidiana con un detalle extraordinario: ausencias al trabajo («le picó un escorpión», «estaba de fiesta»), préstamos, disputas entre vecinos e incluso la primera huelga documentada de la historia.</p>`],

sections: [
['Formas relativas sin antecedente', `
<p>Las formas relativas también pueden usarse <b>sin función de adjetivo</b>, como el núcleo de una oración sustantiva: «(el hecho de) que él oye». En esta función se llaman <b>formas relativas no atributivas</b> (los gramáticos antiguos las llamaban «formas enfáticas» o «sustantivas»).</p>
${TB(['Forma','Ejemplo','Valor'],[
['perfecto',T('sḏm.n.f'),'que él oyó'],
['imperfectiva',T('mrr.f'),'que él ama'],
['perfectiva/prospectiva',T('mr.f'),'que él ame / amará'],
])}
<p>Por ejemplo, pueden ser el objeto de un verbo o ir tras una preposición:</p>
<div class="ex"><span class="tr">rḫ.n.j mrr.f wj</span><span class="es">«supe que él me ama»</span></div>`],
['Las oraciones enfáticas', `
<p>El uso más importante es la <b>oración enfática</b>. En ella el verbo (en forma relativa no atributiva) pasa a ser el tema, y lo importante, lo nuevo, es un <b>complemento adverbial</b>: un lugar, un momento, un modo o una causa. En español lo expresamos con «es… donde/cuando/como/por lo que…»:</p>
${X('𓇍𓇋𓂻𓈖𓀀𓅓𓊖𓏏𓏤𓀀','jj.n.j m njwt.j','es de mi ciudad de donde he venido','lo importante es «de mi ciudad»')}
${X('𓌸𓂋𓂋𓆑𓋴𓅱𓂋𓐍𓏏𓏛𓏥𓎟𓏏','mrr.f sw r ḫt nbt','lo ama más que a cualquier otra cosa')}
<p>Muchas veces basta con traducir de forma normal y poner el acento en el complemento al leer.</p>`],
['Preguntas enfáticas', `
<p>Las preguntas con un interrogativo adverbial («¿por qué?», «¿cómo?», «¿adónde?») usan con frecuencia la construcción enfática, porque lo nuevo es precisamente el interrogativo:</p>
${X('𓇍𓇋𓂻𓈖𓎡𓁷𓏤𓅓','jj.n.k ḥr m','¿por qué has venido?')}
${X('𓈝𓅓𓂻𓎡𓂋𓅓','šm.k r m','¿adónde vas?','literalmente «es hacia qué que vas»')}
${X('𓁹𓂋𓎡𓈖𓈖𓅓𓏇𓇋𓅓','jrr.k nn mj m','¿cómo haces esto?')}`],
['Oraciones equilibradas', `
<p>Cuando dos formas relativas no atributivas aparecen seguidas, la primera expresa una condición o un momento y la segunda la consecuencia: es la <b>oración equilibrada</b> («balanced sentence»):</p>
${X('𓌳𓄿𓄿𓁹𓆑𓋴𓅱𓋹𓈖𓐍𓆑','mꜣꜣ.f sw ꜥnḫ.f','cuando lo ve, vive / si lo ve, vive')}
<div class="ex"><span class="tr">pr.f ḫꜥ.f</span><span class="es">«cuando sale, aparece radiante»</span></div>
<p>Es típica de proverbios y textos religiosos.</p>`],
['Cómo reconocerlas', `
<p>Las formas relativas no atributivas no siempre se distinguen por escrito de otras formas. Estas pistas ayudan:</p>
<ol>
<li>Un ${T('sḏm.n.f')} o un ${T('sḏm.f')} con duplicación al principio de la oración, <b>sin</b> ${T('jw')} ni ${T('ꜥḥꜥ.n')}, seguido de un complemento adverbial destacado, suele ser enfático.</li>
<li>Los interrogativos adverbiales al final (${T('ḥr m')}, ${T('r m')}) casi siempre indican construcción enfática.</li>
<li>El verbo ${T('wnn')} en forma ${T('wnn.f')} al principio de la oración marca muchas veces una enfática de una oración adverbial: ${T('wnn.f m pr')} «es en casa donde está».</li>
</ol>
${N('La negación de una oración enfática se hace con '+T('n')+' … '+T('js')+': «no es por eso por lo que vine».')}`],
],
culture: ['Las cartas', `
<p>Los egipcios escribían cartas sobre papiro, que doblaban, ataban y sellaban con barro. Una carta empezaba con el nombre del remitente y del destinatario y una larga fórmula de saludo que deseaba al destinatario «vida, prosperidad y salud» y el favor de los dioses. Después venía el asunto, introducido a menudo por la fórmula ${T('r ntt')} «para comunicar que…».</p>
<p>Entre las cartas más conocidas están las de <b>Heqanajt</b>, un sacerdote funerario del comienzo del Reino Medio que, desde lejos, da instrucciones a su familia sobre el cultivo de sus tierras, el reparto de las raciones y las peleas domésticas, con un tono gruñón y muy humano. Se encontraron sin abrir en una tumba de Tebas.</p>
<p>Una categoría especial son las <b>cartas a los muertos</b>, escritas a veces en vasijas que se dejaban en la tumba con ofrendas. En ellas los vivos pedían a un familiar difunto que intercediera en el más allá para resolver una enfermedad o una injusticia: una prueba de que, para los egipcios, los muertos seguían formando parte de la familia.</p>`],

<p>Tras el desciframiento de 1822, la egiptología avanzó a gran velocidad. A lo largo del siglo XIX se publicaron las primeras gramáticas y se copiaron las inscripciones de templos y tumbas. Hacia 1880 la escuela de Berlín, con Adolf Erman, estableció el estudio científico de la gramática y emprendió el gran <i>Wörterbuch</i>, el diccionario del egipcio, que reunió más de un millón y medio de fichas.</p>

<script>
/* ======================= MOTOR ======================= */
(function(){
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const DAY = 864e5;
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const PASS = 0.7;

/* ---------- Estado y persistencia ---------- */
const LSKEY = 'medunetjer.progress.v1';
const defaultState = () => ({ v:1, updatedAt:0, lessons:{}, srs:{}, xp:0, streak:{count:0,last:''}, activity:{}, texts:{},
  settings:{ theme:'light', hg:1, unlockAll:false, newPerDay:15 } });
let S = defaultState();
const Sync = { mode:'local', db:null, ref:null, writing:false, pending:false, timer:null };

function mergeDefaults(o){ const d = defaultState(); const s = Object.assign(d, o||{}); s.settings = Object.assign(defaultState().settings, (o||{}).settings||{}); s.streak = Object.assign({count:0,last:''}, (o||{}).streak||{}); return s; }
function loadLocal(){ try { const raw = localStorage.getItem(LSKEY); if (raw) return JSON.parse(raw); } catch(e){} return null; }
function saveLocal(){ try { localStorage.setItem(LSKEY, JSON.stringify(S)); } catch(e){} }

function save(){
  S.updatedAt = Date.now();
  saveLocal();
  clearTimeout(Sync.timer);
  Sync.timer = setTimeout(pushRemote, 1200);
}
async function pushRemote(){
  if (!Sync.ref) return;
  if (Sync.writing){ Sync.pending = true; return; }
  Sync.writing = true; setSync('busy');
  try { await Sync.ref.set(JSON.parse(JSON.stringify(S))); setSync('ok'); }
  catch(e){
    if (e && e.code === 'unavailable'){ setTimeout(pushRemote, 1500 + Math.random()*1500); }
    else if (e && (e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')) { Sync.ref = null; setSync('local'); }
    else setSync('local');
  }
  Sync.writing = false;
  if (Sync.pending){ Sync.pending = false; pushRemote(); }
}
function setSync(m){ Sync.mode = m; const el = $('#syncState'); if (el) el.innerHTML = syncLabel(); }
function syncLabel(){
  return { ok:'<span class="dot ok"></span> Guardado en tu cuenta', busy:'<span class="dot busy"></span> Guardando…', local:'<span class="dot local"></span> Guardado en este dispositivo' }[Sync.mode] || '';
}
async function initRemote(){
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const db = await window.claude.use('db'); if (!db) return;
    const user = await window.claude.use('user'); if (!user) return;
    const id = await user.id(); if (!id) return;
    const ref = db.doc('data/users/' + id + '/progress');
    const timeout = new Promise((_, rej) => setTimeout(() => rej({code:'timeout'}), 10000));
    const snap = await Promise.race([ref.get(), timeout]);
    Sync.ref = ref; Sync.db = db;
    if (snap.exists){
      const remote = snap.data();
      if ((remote.updatedAt||0) > (S.updatedAt||0)){ S = mergeDefaults(JSON.parse(JSON.stringify(remote))); saveLocal(); applySettings(); render(); toast('Progreso recuperado de tu cuenta'); }
      else if ((S.updatedAt||0) > (remote.updatedAt||0)) pushRemote();
      setSync('ok');
    } else {
      if (S.updatedAt) pushRemote(); else setSync('ok');
    }
  } catch(e){ setSync('local'); }
}

/* ---------- Progreso ---------- */
const L = n => LESSONS.find(l => l.n === n);
const LS = n => (S.lessons[n] = S.lessons[n] || { read:[], best:0, done:false, attempts:0, culture:false });
function isUnlocked(n){ return S.settings.unlockAll || n === 1 || !!(S.lessons[n-1] && S.lessons[n-1].done); }
function lessonPct(n){
  const l = L(n), st = S.lessons[n]; if (!st) return 0;
  const secs = l.sections.length; const r = (st.read||[]).length;
  return Math.round(((Math.min(r,secs)/secs)*0.5 + (st.done?0.5:(st.best||0)/100*0.5))*100);
}
function currentLesson(){ for (const l of LESSONS){ if (!(S.lessons[l.n] && S.lessons[l.n].done)) return l.n; } return LESSONS.length ? LESSONS[LESSONS.length-1].n : 1; }
function addXP(x){
  S.xp += x; const t = today(); S.activity[t] = (S.activity[t]||0) + x;
  if (S.streak.last !== t){
    const y = new Date(Date.now()-DAY); const ys = y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
    S.streak.count = (S.streak.last === ys) ? S.streak.count + 1 : 1; S.streak.last = t;
  }
  save();
}

/* ---------- Transliteración ---------- */
const TR_KEYS = ['ꜣ','j','y','ꜥ','w','b','p','f','m','n','r','h','ḥ','ḫ','ẖ','z','s','š','q','k','g','t','ṯ','d','ḏ','.','-','='];
const CANON = {'ꜣ':'A','Ꜣ':'A','3':'A','ȝ':'A','ʒ':'A','ꜥ':'a','Ꜥ':'a','ʿ':'a','ʽ':'a','‘':'a','j':'i','i':'i','ỉ':'i','ı':'i','í':'i','y':'y','ï':'y',
  'ḥ':'H','Ḥ':'H','ḫ':'x','Ḫ':'x','ẖ':'X','h̭':'X','š':'S','Š':'S','ṯ':'T','Ṯ':'T','ḏ':'D','Ḏ':'D','ḳ':'q','ḳ':'q','z':'s','c':'S','č':'T'};
function canonTr(s, ascii){
  s = String(s||'').normalize('NFC');
  let out = '';
  for (const ch of s){
    if (CANON[ch] !== undefined){ out += CANON[ch]; continue; }
    if (/[A-Za-z]/.test(ch)){
      if (ascii){ // convención MdC: A=ꜣ a=ꜥ H=ḥ x=ḫ X=ẖ S=š T=ṯ D=ḏ
        if ('AaHxXSTD'.includes(ch)) { out += ch; continue; }
        if (ch==='i'||ch==='I'||ch==='j'||ch==='J') { out += 'i'; continue; }
        if (ch==='z'||ch==='Z') { out += 's'; continue; }
        out += ch.toLowerCase(); continue;
      }
      if (ch==='J'||ch==='I') { out+='i'; continue; }
      out += ch.toLowerCase(); continue;
    }
    // ignorar separadores y signos
  }
  return out;
}
function trMatch(given, answers){
  const g = canonTr(given, true);
  if (!g) return false;
  return [].concat(answers).some(a => canonTr(a, false) === g);
}
/* ---------- Español ---------- */
const normEs = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9ñ ]+/g,' ').replace(/\s+/g,' ').trim();
function keyCheck(given, groups){
  const g = ' ' + normEs(given) + ' ';
  const miss = [];
  (groups||[]).forEach(grp => { if (!grp.some(k => g.includes(normEs(k)))) miss.push(grp[0]); });
  return miss;
}

/* ---------- SRS ---------- */
const BOX_DAYS = [0, 1, 2, 4, 8, 16, 32, 64, 120];
function allCards(){
  const cards = [];
  const maxL = S.settings.unlockAll ? 99 : Math.max(1, ...LESSONS.filter(l => S.lessons[l.n] && (S.lessons[l.n].read||[]).length).map(l=>l.n));
  SIGNS.forEach(sg => { if ((sg.l||2) <= maxL && (['uni','bi','tri'].includes(sg.k) || sg.srs)) cards.push({ id:'s:'+sg.c, kind:'sign', sg }); });
  LESSONS.forEach(l => { if (l.n <= maxL && S.lessons[l.n] && (S.lessons[l.n].read||[]).length) (l.vocab||[]).forEach((v,i) => cards.push({ id:'v:'+l.n+':'+i, kind:'vocab', v, n:l.n })); });
  return cards;
}
function dueCards(){
  const now = Date.now(); const all = allCards();
  const due = all.filter(c => S.srs[c.id] && S.srs[c.id].due <= now);
  const t = today();
  const introducedToday = Object.values(S.srs).filter(x => x.intro === t).length;
  const room = Math.max(0, (S.settings.newPerDay||15) - introducedToday);
  const fresh = all.filter(c => !S.srs[c.id]).slice(0, room);
  return { due, fresh, total: all.length };
}
function grade(id, g){ // 0 otra vez, 1 difícil, 2 bien, 3 fácil
  const c = S.srs[id] || { box:0, due:0, reps:0, lapses:0, intro: today() };
  if (g === 0){ c.box = 0; c.lapses++; c.due = Date.now() + 60*1000; }
  else {
    if (g === 1) c.box = Math.max(1, c.box);
    if (g === 2) c.box = Math.min(BOX_DAYS.length-1, c.box + 1);
    if (g === 3) c.box = Math.min(BOX_DAYS.length-1, c.box + 2);
    const days = BOX_DAYS[c.box] * (g === 1 ? 0.6 : 1);
    c.due = Date.now() + Math.max(days, 0.5) * DAY - 3600*1000;
  }
  c.reps++; S.srs[id] = c; save();
}

function toast(msg){ const t = document.createElement('div'); t.className='toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2400); }
function modal(html, onMount){
  const bg = document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML = '<div class="card modal fadein">'+html+'</div>';
  bg.addEventListener('click', e => { if (e.target === bg) bg.remove(); });
  document.body.appendChild(bg); if (onMount) onMount(bg, () => bg.remove()); return bg;
}
function confirmBox(text, okLabel, cb){
  modal('<h3>¿Seguro?</h3><p>'+esc(text)+'</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-x>Cancelar</button><button class="btn red" data-ok>'+esc(okLabel)+'</button></div>', (bg, close) => {
    $('[data-x]', bg).onclick = close; $('[data-ok]', bg).onclick = () => { close(); cb(); };
  });
}
function applySettings(){
  document.documentElement.setAttribute('data-theme', S.settings.theme === 'dark' ? 'dark' : 'light');
  document.documentElement.style.setProperty('--hg-scale', S.settings.hg || 1);
}
async function copyText(txt){
  try { await navigator.clipboard.writeText(txt); toast('Copiado al portapapeles'); return true; }
  catch(e){ toast('No se pudo copiar: selecciónalo y cópialo a mano'); return false; }
}

/* ---------- Router ---------- */
let cleanup = null;
function route(){ return (location.hash || '#inicio').slice(1) || 'inicio'; }
function go(r){ if (location.hash === '#'+r) render(); else location.hash = r; }
function render(){
  if (cleanup){ try { cleanup(); } catch(e){} cleanup = null; }
  const r = route();
  renderNav(r);
  const m = $('#main');
  let mm;
  try {
    if (r === 'inicio') viewHome(m);
    else if (r === 'lecciones') viewLessons(m);
    else if ((mm = r.match(/^leccion-(\d+)(?:-(teoria|vocabulario|cultura|ejercicios))?$/))) viewLesson(m, +mm[1], mm[2] || 'teoria');
    else if (r === 'repaso') viewReview(m);
    else if (r === 'signos') viewSigns(m);
    else if (r === 'diccionario') viewDict(m);
    else if (r === 'textos') viewTexts(m);
    else if ((mm = r.match(/^texto-(\d+)$/))) viewText(m, +mm[1]);
    else if (r === 'ajustes') viewSettings(m);
    else if (r === 'practica') viewPractice(m);
    else { m.innerHTML = `<div class="card"><h2>Página no encontrada</h2><p>Esa dirección no existe.</p><a class="btn" href="#inicio">Volver al inicio</a></div>`; }
  } catch(e){ console.error(e); m.innerHTML = `<div class="card"><h2>Algo ha fallado</h2><p class="muted">${esc(e.message)}</p><a class="btn" href="#inicio">Volver al inicio</a></div>`; }
  m.classList.remove('fadein'); void m.offsetWidth; m.classList.add('fadein');
}
window.addEventListener('hashchange', () => { render(); window.scrollTo({top:0}); });

function tabTheory(body, l, st){
  let i = Math.min(st.lastSec || 0, l.sections.length-1);
  const draw = () => {
    if (!st.read.includes(i)){ st.read.push(i); if (st.read.length === 1 && !st.started){ st.started = true; } addXP(2); }
    st.lastSec = i; save();
    const [h, html] = l.sections[i];
    body.innerHTML = `<div class="card theory fadein">
      <div class="eyebrow">Apartado ${i+1} de ${l.sections.length}</div><h3>${h}</h3>${html}</div>
      <div class="sec-nav">
        <button class="btn ghost" id="prev" ${i===0?'disabled':''}>← Anterior</button>
        <div class="sec-dots">${l.sections.map((s,k)=>`<button data-k="${k}" class="${k===i?'on':st.read.includes(k)?'read':''}" title="${esc(s[0].replace(/<[^>]+>/g,''))}">${k+1}</button>`).join('')}</div>
        ${i < l.sections.length-1 ? `<button class="btn" id="next">Siguiente →</button>` : `<a class="btn gold" href="#leccion-${l.n}-vocabulario">Ir al vocabulario →</a>`}

    $('#prev', body) && ($('#prev', body).onclick = () => { i--; draw(); window.scrollTo({top:0,behavior:'smooth'}); });

    $$('.sec-dots button', body).forEach(b => b.onclick = () => { i = +b.dataset.k; draw(); });
    renderNav(route());
  };
  draw();
}

name: Construir APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Comprobar los archivos subidos
        run: |
          # por si el navegador los renombró (p. ej. "index (1).html")
          for patron in "index*.html:index.html" "icon*.png:icon.png" "preparar*.py:preparar.py"; do
            origen=$(ls ${patron%%:*} 2>/dev/null | head -n 1)
            destino=${patron##*:}
            if [ -z "$origen" ]; then echo "FALTA EL ARCHIVO $destino: súbelo al repositorio"; exit 1; fi
            if [ "$origen" != "$destino" ]; then mv "$origen" "$destino"; fi
          done
          ls -la

      - name: Preparar la app
        run: |
          pip install pillow
          python preparar.py web
          cd proyecto
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "Medu Netjer" com.medunetjer.app --web-dir www
          npx cap add android
          cd ..
          python preparar.py iconos
          cd proyecto
          npx cap sync android

      - name: Compilar el APK
        run: |
          cd proyecto/android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../MeduNetjer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Medu-Netjer-APK
          path: MeduNetjer.apk

      - uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v${{ github.run_number }}
          name: Medu Netjer ${{ github.run_number }}
          files: MeduNetjer.apk
